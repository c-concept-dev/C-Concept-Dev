<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Connaissance de soi, de "Nous"</title>
 <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }

 :root {
 --font-size-base: 18px;
 --color-primary: #8FAFB1;
 --color-secondary: #C8D0C3;
 --color-tertiary: #E6D7C3;
 --color-text: #2C2416;
 }

 body {
 font-family: 'Cormorant Garamond', serif;
 background: linear-gradient(135deg, #F5F1E8 0%, #E8E4D8 100%);
 color: var(--color-text);
 line-height: 2.0;
 font-size: var(--font-size-base);
 overflow-x: hidden;
 }

 /* CONTAINER PRINCIPAL */
 .app-container {
 display: flex;
 min-height: 100vh;
 max-width: 1600px;
 margin: 0 auto;
 position: relative;
 }

 /* MENU LATÉRAL FIXE */
 .sidebar {
 width: 280px;
 background: rgba(255, 255, 255, 0.95);
 backdrop-filter: blur(10px);
 padding: 30px 20px;
 position: fixed;
 left: 0;
 top: 0;
 height: 100vh;
 box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
 z-index: 100;
 overflow-y: auto;
 transition: transform 0.3s ease;
 }

 .sidebar-header {
 font-family: 'Allura', cursive;
 font-size: 28px;
 color: var(--color-primary);
 margin-bottom: 30px;
 text-align: center;
 font-weight: 400;
 }

 .nav-menu {
 list-style: none;
 }

 .nav-item {
 margin: 15px 0;
 padding: 12px 15px;
 border-radius: 10px;
 cursor: pointer;
 transition: all 0.3s ease;
 border-left: 4px solid transparent;
 font-size: 17px;
 font-family: 'Cormorant Garamond', serif;
 }

 .nav-item:hover {
 background: var(--color-tertiary);
 border-left-color: var(--color-primary);
 transform: translateX(5px);
 }

 .nav-item.active {
 background: var(--color-primary);
 color: white;
 border-left-color: var(--color-primary);
 }

 /* CONTRÔLES TOP */
 .top-controls {
 position: fixed;
 top: 20px;
 right: 20px;
 z-index: 100;
 display: flex;
 gap: 15px;
 align-items: center;
 }

 .control-btn {
 background: rgba(255, 255, 255, 0.95);
 border: 2px solid var(--color-secondary);
 border-radius: 10px;
 padding: 10px 15px;
 cursor: pointer;
 font-family: 'Cormorant Garamond', serif;
 font-size: 16px;
 transition: all 0.3s ease;
 box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
 }

 .control-btn:hover {
 background: var(--color-primary);
 color: white;
 transform: translateY(-2px);
 box-shadow: 0 6px 20px rgba(143, 175, 177, 0.3);
 }

 /* ZONE LIVRE CENTRALE */
 .book-container {
 flex: 1;
 margin-left: 280px;
 padding: 40px;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 min-height: 100vh;
 }

 .book-wrapper {
 position: relative;
 perspective: 1500px;
 max-width: 900px;
 width: 100%;
 overflow: visible;
 }

 .page {
 width: 100%;
 min-height: 600px;
 background: white;
 padding: 60px;
 border-radius: 15px;
 box-shadow: 0 10px 50px rgba(0, 0, 0, 0.15);
 position: relative;
 transform-origin: left center;
 transform-style: preserve-3d;
 backface-visibility: hidden;
 }

 .page.page-flip-out {
 animation: pageFlipOut 0.9s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
 }

 .page.page-flip-in {
 animation: pageFlipIn 0.9s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
 }

 @keyframes pageFlipOut {
 0% { 
 transform: rotateY(0deg) translateZ(0px);
 opacity: 1;
 box-shadow: 0 10px 50px rgba(0, 0, 0, 0.15);
 }
 25% {
 transform: rotateY(-25deg) translateZ(50px);
 box-shadow: -10px 10px 60px rgba(0, 0, 0, 0.25);
 }
 50% {
 transform: rotateY(-90deg) translateZ(80px);
 opacity: 0.8;
 box-shadow: -15px 10px 70px rgba(0, 0, 0, 0.3);
 }
 75% {
 transform: rotateY(-150deg) translateZ(50px);
 opacity: 0.4;
 }
 100% { 
 transform: rotateY(-180deg) translateZ(0px);
 opacity: 0;
 box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
 }
 }

 @keyframes pageFlipIn {
 0% { 
 transform: rotateY(180deg) translateZ(0px);
 opacity: 0;
 transform-origin: right center;
 box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
 }
 25% {
 transform: rotateY(150deg) translateZ(50px);
 opacity: 0.4;
 transform-origin: right center;
 }
 50% {
 transform: rotateY(90deg) translateZ(80px);
 opacity: 0.8;
 transform-origin: right center;
 box-shadow: 15px 10px 70px rgba(0, 0, 0, 0.3);
 }
 75% {
 transform: rotateY(25deg) translateZ(50px);
 transform-origin: right center;
 box-shadow: 10px 10px 60px rgba(0, 0, 0, 0.25);
 }
 100% { 
 transform: rotateY(0deg) translateZ(0px);
 opacity: 1;
 transform-origin: right center;
 box-shadow: 0 10px 50px rgba(0, 0, 0, 0.15);
 }
 }

 /* CONTENU DES PAGES */
 .page-header {
 text-align: center;
 margin-bottom: 30px;
 padding-bottom: 15px;
 border-bottom: 2px solid var(--color-primary);
 }

 .section-tag {
 font-family: 'Cormorant Garamond', serif;
 font-size: 16px;
 color: var(--color-primary);
 text-transform: uppercase;
 letter-spacing: 1px;
 font-weight: 600;
 }

 .main-title {
 font-family: 'Allura', cursive;
 font-size: 52px;
 color: var(--color-primary);
 margin: 25px 0;
 font-weight: 400;
 line-height: 1.4;
 text-align: center;
 }

 .section-title {
 font-family: 'Allura', cursive;
 font-size: 40px;
 color: var(--color-primary);
 margin: 30px 0 20px 0;
 font-weight: 400;
 text-align: center;
 padding-bottom: 10px;
 border-bottom: 1px solid var(--color-secondary);
 }

 .intro-text {
 font-family: 'Cormorant Garamond', serif;
 font-size: calc(var(--font-size-base) + 1px);
 line-height: 2.0;
 color: var(--color-text);
 margin: 20px 0;
 text-align: justify;
 padding: 20px;
 background: transparent;
 border-radius: 10px;
 border-left: none;
 }

 .question {
 font-family: 'Cormorant Garamond', serif;
 font-size: calc(var(--font-size-base) + 2px);
 line-height: 2.0;
 margin: 25px 0;
 padding-left: 35px;
 position: relative;
 color: var(--color-text);
 text-align: justify;
 }

 .question:before {
 content: attr(data-num) ".";
 position: absolute;
 left: 0;
 font-weight: 700;
 color: var(--color-primary);
 font-size: calc(var(--font-size-base) + 4px);
 }

 .section-intro {
 font-family: 'Cormorant Garamond', serif;
 font-size: calc(var(--font-size-base) + 1px);
 line-height: 2.0;
 color: #555;
 margin: 20px 0 30px 0;
 text-align: center;
 font-style: italic;
 }

 .decorative-line {
 width: 80px;
 height: 2px;
 background: var(--color-secondary);
 margin: 30px auto;
 }

 .cover-ornament {
 width: 120px;
 height: 2px;
 background: linear-gradient(to right, transparent, var(--color-primary), transparent);
 margin: 25px auto;
 }

 /* PAGE DE COUVERTURE */
 .cover-page {
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 text-align: center;
 min-height: 700px;
 }

 .cover-title {
 font-family: 'Allura', cursive;
 font-size: 60px;
 color: var(--color-primary);
 margin: 30px 0 15px 0;
 font-weight: 400;
 line-height: 1.3;
 }

 .cover-subtitle {
 font-family: 'Cormorant Garamond', serif;
 font-size: 22px;
 max-width: 600px;
 line-height: 2.0;
 color: var(--color-text);
 margin: 30px 0;
 text-align: justify;
 }

 /* FOOTER */
 .page-footer {
 position: absolute;
 bottom: 20px;
 left: 60px;
 right: 60px;
 text-align: center;
 font-family: 'Cormorant Garamond', serif;
 font-size: 12px;
 color: #999;
 padding-top: 10px;
 border-top: 1px solid var(--color-tertiary);
 }

 /* NAVIGATION PAGE */
 .page-nav {
 position: absolute;
 bottom: 30px;
 right: 30px;
 display: flex;
 gap: 15px;
 z-index: 10;
 }

 .page-nav-btn {
 background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
 color: white;
 border: none;
 border-radius: 50%;
 width: 50px;
 height: 50px;
 cursor: pointer;
 font-size: 24px;
 display: flex;
 align-items: center;
 justify-content: center;
 transition: all 0.3s ease;
 box-shadow: 0 4px 15px rgba(143, 175, 177, 0.3);
 }

 .page-nav-btn:hover:not(:disabled) {
 transform: scale(1.1);
 box-shadow: 0 6px 20px rgba(143, 175, 177, 0.5);
 }

 .page-nav-btn:disabled {
 opacity: 0.3;
 cursor: not-allowed;
 }

 /* BARRE DE PROGRESSION */
 .progress-bar {
 position: fixed;
 bottom: 30px;
 left: 50%;
 transform: translateX(-50%);
 display: flex;
 gap: 8px;
 background: rgba(255, 255, 255, 0.95);
 padding: 12px 20px;
 border-radius: 25px;
 box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
 z-index: 90;
 }

 .progress-dot {
 width: 10px;
 height: 10px;
 border-radius: 50%;
 background: var(--color-tertiary);
 transition: all 0.3s ease;
 cursor: pointer;
 }

 .progress-dot.active {
 background: var(--color-primary);
 transform: scale(1.3);
 }

 .progress-dot:hover {
 transform: scale(1.2);
 }

 /* RESPONSIVE MOBILE */
 @media (max-width: 768px) {
 .sidebar {
 transform: translateX(-100%);
 width: 250px;
 }

 .sidebar.mobile-open {
 transform: translateX(0);
 }

 .book-container {
 margin-left: 0;
 padding: 20px;
 }

 .page {
 padding: 30px 25px;
 min-height: auto;
 }

 .main-title {
 font-size: 36px;
 }

 .section-title {
 font-size: 28px;
 }

 .top-controls {
 top: 10px;
 right: 10px;
 flex-wrap: wrap;
 }

 .progress-bar {
 bottom: 15px;
 padding: 8px 12px;
 }

 .page-nav {
 bottom: 80px;
 right: 15px;
 }

 .page-nav-btn {
 width: 45px;
 height: 45px;
 }

 /* Mobile: scroll vertical */
 .book-wrapper {
 max-width: 100%;
 }

 .page.page-flip-out,
 .page.page-flip-in {
 animation: none;
 }
 }

 /* BOUTON MENU MOBILE */
 .mobile-menu-btn {
 display: none;
 position: fixed;
 top: 20px;
 left: 20px;
 z-index: 101;
 background: var(--color-primary);
 color: white;
 border: none;
 border-radius: 10px;
 padding: 12px 15px;
 cursor: pointer;
 font-size: 20px;
 box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
 }

 @media (max-width: 768px) {
 .mobile-menu-btn {
 display: block;
 }
 }

 /* OVERLAY MOBILE */
 .overlay {
 display: none;
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 bottom: 0;
 background: rgba(0, 0, 0, 0.5);
 z-index: 99;
 }

 .overlay.active {
 display: block;
 }

 /* IMPRESSION */
 @media print {
 body {
 background: white;
 }

 .sidebar,
 .top-controls,
 .page-nav,
 .progress-bar,
 .mobile-menu-btn {
 display: none !important;
 }

 .book-container {
 margin-left: 0;
 padding: 0;
 }

 .page {
 box-shadow: none;
 page-break-after: always;
 min-height: 297mm;
 padding: 20mm;
 }

 .page:last-child {
 page-break-after: auto;
 }
 }

 .hidden {
 display: none;
 }
 
/* === TOOLTIPS CONTEXTUELS — MODE D'EMPLOI === */
.tooltip-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #8FAFB1;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-left: 8px;
    vertical-align: middle;
    position: relative;
    transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
    box-shadow: 0 2px 6px rgba(143,175,177,0.3);
    user-select: none;
    flex-shrink: 0;
    line-height: 1;
}
.tooltip-trigger:hover,
.tooltip-trigger[aria-expanded="true"] {
    background: #333;
    transform: scale(1.15);
    box-shadow: 0 3px 10px rgba(51,51,51,0.3);
}
.tooltip-bubble {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: #333;
    color: #fff;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.6;
    width: 300px;
    max-width: 90vw;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
    z-index: 1000;
    pointer-events: none;
    text-align: left;
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
}
.tooltip-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #333;
}
.tooltip-bubble.visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
}
.tooltip-bubble.flip-down {
    bottom: auto;
    top: calc(100% + 12px);
    transform: translateX(-50%) translateY(-6px);
}
.tooltip-bubble.flip-down.visible {
    transform: translateX(-50%) translateY(0);
}
.tooltip-bubble.flip-down::after {
    top: auto;
    bottom: 100%;
    border-top-color: transparent;
    border-bottom-color: #333;
}
.tooltip-bubble.align-left {
    left: 0;
    transform: translateX(0) translateY(6px);
}
.tooltip-bubble.align-left.visible {
    transform: translateX(0) translateY(0);
}
.tooltip-bubble.align-left::after {
    left: 16px;
    transform: none;
}
.tooltip-bubble .tip-title {
    font-weight: 600;
    font-size: 13.5px;
    margin-bottom: 6px;
    color: #C8D0C3;
}
.tooltip-bubble .tip-example {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-style: italic;
    font-size: 12px;
    opacity: 0.85;
}
.help-banner-tooltip {
    background: linear-gradient(135deg, #8FAFB1 0%, rgba(143,175,177,0.85) 100%);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    margin: 0 0 25px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 3px 12px rgba(143,175,177,0.25);
    font-family: 'Montserrat', 'Segoe UI', sans-serif;
}
.help-banner-tooltip .dismiss-help {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
}
.help-banner-tooltip .dismiss-help:hover {
    background: rgba(255,255,255,0.35);
}
@media print {
    .tooltip-trigger, .tooltip-bubble, .help-banner-tooltip { display: none !important; }
}
</style>
</head>

 // VARIABLES GLOBALES
 let currentPage = 0;
 let fontSize = 18;

 // INITIALISATION
 function init() {
 renderPage(currentPage);
 renderProgressBar();
 updateNavButtons();
 updateActiveNav();
 }

 // RENDU PAGE
 function renderPage(pageIndex) {
 const pageContent = document.getElementById('pageContent');
 const page = pages[pageIndex];
 
 // Réinitialiser toute transformation avant l'animation
 pageContent.style.transform = 'none';
 pageContent.style.opacity = '1';
 
 pageContent.classList.add('page-flip-out');
 
 setTimeout(() => {
 pageContent.innerHTML = page.content;
 pageContent.classList.remove('page-flip-out');
 pageContent.classList.add('page-flip-in');
 
 setTimeout(() => {
 pageContent.classList.remove('page-flip-in');
 // Force la réinitialisation complète après l'animation
 pageContent.style.transform = 'none';
 pageContent.style.opacity = '1';
 pageContent.style.transformOrigin = 'left center';
 }, 900);
 }, 450);

 updateNavButtons();
 updateActiveNav();
 updateProgressDots();
 }

 // NAVIGATION
 function nextPage() {
 if (currentPage < pages.length - 1) {
 currentPage++;
 renderPage(currentPage);
 }
 }

 function previousPage() {
 if (currentPage > 0) {
 currentPage--;
 renderPage(currentPage);
 }
 }

 function goToPage(pageIndex) {
 if (pageIndex >= 0 && pageIndex < pages.length) {
 currentPage = pageIndex;
 renderPage(currentPage);
 }
 // Fermer le menu mobile
 if (window.innerWidth <= 768) {
 toggleMobileMenu();
 }
 }

 // MISE À JOUR BOUTONS NAV
 function updateNavButtons() {
 const prevBtn = document.getElementById('prevBtn');
 const nextBtn = document.getElementById('nextBtn');
 
 prevBtn.disabled = currentPage === 0;
 nextBtn.disabled = currentPage === pages.length - 1;
 }

 // BARRE DE PROGRESSION
 function renderProgressBar() {
 const progressBar = document.getElementById('progressBar');
 progressBar.innerHTML = '';
 
 pages.forEach((_, index) => {
 const dot = document.createElement('div');
 dot.className = 'progress-dot';
 if (index === currentPage) {
 dot.classList.add('active');
 }
 dot.onclick = () => goToPage(index);
 dot.title = `Page ${index + 1}`;
 progressBar.appendChild(dot);
 });
 }

 function updateProgressDots() {
 const dots = document.querySelectorAll('.progress-dot');
 dots.forEach((dot, index) => {
 if (index === currentPage) {
 dot.classList.add('active');
 } else {
 dot.classList.remove('active');
 }
 });
 }

 // MENU ACTIF
 function updateActiveNav() {
 const navItems = document.querySelectorAll('.nav-item');
 navItems.forEach(item => item.classList.remove('active'));
 
 // Logique pour déterminer quel item activer
 if (currentPage === 0) {
 navItems[0].classList.add('active');
 } else if (currentPage === 1) {
 navItems[1].classList.add('active');
 } else if (currentPage >= 2 && currentPage <= 4) {
 navItems[2].classList.add('active');
 } else if (currentPage >= 6 && currentPage <= 7) {
 navItems[3].classList.add('active');
 } else if (currentPage >= 8 && currentPage <= 10) {
 navItems[4].classList.add('active');
 } else if (currentPage >= 11 && currentPage <= 14) {
 navItems[5].classList.add('active');
 } else if (currentPage >= 15) {
 navItems[6].classList.add('active');
 }
 }

 // IMPRESSION
 function printBook() {
 window.print();
 }

 // MENU MOBILE
 function toggleMobileMenu() {
 const sidebar = document.getElementById('sidebar');
 const overlay = document.querySelector('.overlay');
 
 sidebar.classList.toggle('mobile-open');
 overlay.classList.toggle('active');
 }

 // NAVIGATION CLAVIER
 document.addEventListener('keydown', (e) => {
 if (e.key === 'ArrowRight') {
 nextPage();
 } else if (e.key === 'ArrowLeft') {
 previousPage();
 }
 });

 // DÉMARRAGE
 window.addEventListener('DOMContentLoaded', init);
 </script>


<script>
/* === TOOLTIPS CONTEXTUELS === */
(function(){
    var active=null;
    function closeAll(){
        document.querySelectorAll('.tooltip-bubble.visible').forEach(function(b){b.classList.remove('visible','flip-down','align-left');});
        document.querySelectorAll('.tooltip-trigger[aria-expanded="true"]').forEach(function(t){t.setAttribute('aria-expanded','false');});
        active=null;
    }
    function position(bubble){
        bubble.classList.remove('flip-down','align-left');
        var r=bubble.getBoundingClientRect();
        if(r.top<10) bubble.classList.add('flip-down');
        if(r.left<10) bubble.classList.add('align-left');
    }
    function toggle(trigger){
        var bubble=trigger.querySelector('.tooltip-bubble');
        if(!bubble) return;
        var isOpen=bubble.classList.contains('visible');
        closeAll();
        if(!isOpen){
            bubble.classList.add('visible');
            trigger.setAttribute('aria-expanded','true');
            active=bubble;
            requestAnimationFrame(function(){position(bubble);});
        }
    }
    document.addEventListener('click',function(e){
        var trig=e.target.closest('.tooltip-trigger');
        if(trig){e.stopPropagation();toggle(trig);return;}
        closeAll();
    });
    if(window.matchMedia('(hover:hover)').matches){
        document.addEventListener('mouseover',function(e){
            var trig=e.target.closest('.tooltip-trigger');
            if(trig){closeAll();var b=trig.querySelector('.tooltip-bubble');if(b){b.classList.add('visible');trig.setAttribute('aria-expanded','true');active=b;requestAnimationFrame(function(){position(b);});}}
        });
        document.addEventListener('mouseout',function(e){
            var trig=e.target.closest('.tooltip-trigger');
            if(trig) closeAll();
        });
    }
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
})();
</script>
