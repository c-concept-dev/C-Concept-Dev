","blocks":[{"id":"paragraph-241","type":"paragraph","content":{"text":"L'attachement insécure adulte constitue un facteur de vulnérabilité spécifique à la dépression : il perturbe à la fois la régulation émotionnelle et la qualité des liens affectifs, deux dimensions directement impliquées dans l'installation et le maintien des épisodes dépressifs (Reynaud, 2011)."},"citationIds":["citation-73","citation-74"],"validation":{"citationLinks":[{"citationId":"citation-73","claimText":"L'attachement insécure adulte constitue un facteur de vulnérabilité spécifique à la dépression : il perturbe à la fois la régulation émotionnelle et la qualité des liens affectifs, deux dimensions dir","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-74","claimText":"L'attachement insécure adulte constitue un facteur de vulnérabilité spécifique à la dépression : il perturbe à la fois la régulation émotionnelle et la qualité des liens affectifs, deux dimensions dir","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-242","type":"paragraph","content":{"text":"L'isolement subjectif est particulièrement insidieux chez les partenaires évitants : ils ne perçoivent pas leur solitude comme un problème — jusqu'à ce que la dépression, l'émoussement ou le vide les contraigne à la consultation."},"citationIds":["citation-71"],"validation":{"citationLinks":[{"citationId":"citation-71","claimText":"L'isolement subjectif est particulièrement insidieux chez les partenaires évitants : ils ne perçoivent pas leur solitude comme un problème — jusqu'à ce que la dépression, l'émoussement ou le vide les ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-243","type":"callout","content":{"text":"Le sentiment de solitude à l'intérieur même du couple est l'un des indicateurs les plus fiables d'une souffrance d'attachement non nommée.","visualRole":"info"},"citationIds":["citation-78","citation-71"],"validation":{"citationLinks":[{"citationId":"citation-78","claimText":"Le sentiment de solitude à l'intérieur même du couple est l'un des indicateurs les plus fiables d'une souffrance d'attachement non nommée.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-71","claimText":"Le sentiment de solitude à l'intérieur même du couple est l'un des indicateurs les plus fiables d'une souffrance d'attachement non nommée.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-75","type":"card","content":{"title":"Attachement insécure et troubles de la sexualité","imageRef":"couple emotional disconnection bedroom back turned away","imageAlt":"Partenaires tournant le dos dans un lit, déconnexion émotionnelle visible","blocks":[{"id":"paragraph-245","type":"paragraph","content":{"text":"La sexualité est le baromètre le plus sensible de la sécurité d'attachement dans la dyade. Les troubles du désir, de l'excitation et de l'orgasme apparaissent fréquemment comme des symptômes secondaires d'une insécurité relationnelle non résolue."},"citationIds":["citation-79"],"validation":{"citationLinks":[{"citationId":"citation-79","claimText":"La sexualité est le baromètre le plus sensible de la sécurité d'attachement dans la dyade. Les troubles du désir, de l'excitation et de l'orgasme apparaissent fréquemment comme des symptômes secondair","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-246","type":"list","content":{"items":["Anxieux : sexualité utilisée pour réassurer le lien, puis vécue comme une source de validation ou de rejet","Évitant : inhibition du désir à mesure que l'intimité émotionnelle s'approfondit ; fuite vers la pornographie ou l'abstinence","Désorganisé : alternance entre hypersexualisation et frigidité, dissociation possible pendant les rapports","Partenaire évitant en honte : évitement des situations intimes, tension dans la dyade (Carufel, Bonhomme)"],"ordered":false},"citationIds":["citation-80","citation-81"],"validation":{"citationLinks":[{"citationId":"citation-80","claimText":"Patterns selon le style :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-81","claimText":"Patterns selon le style :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-247","type":"callout","content":{"text":"La qualité de la communication du couple est un baromètre de sa vie sexuelle : travailler l'un sans l'autre laisse la moitié du problème intact.","visualRole":"info"},"citationIds":["citation-79"],"validation":{"citationLinks":[{"citationId":"citation-79","claimText":"La qualité de la communication du couple est un baromètre de sa vie sexuelle : travailler l'un sans l'autre laisse la moitié du problème intact.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-76","type":"card","content":{"title":"Conflits, violence et burnout relationnel","imageRef":"couple exhausted burned out couch emotional fatigue silence","imageAlt":"Couple épuisé assis sur un canapé, regards perdus dans le vide","blocks":[{"id":"paragraph-249","type":"paragraph","content":{"text":"Les conflits répétés non résolus ne sont pas la cause de la détresse — ils en sont le symptôme. Leur répétition épuise progressivement les deux partenaires jusqu'au burnout relationnel : un état d'indifférence acquise qui précède souvent la séparation."},"citationIds":["citation-82"],"validation":{"citationLinks":[{"citationId":"citation-82","claimText":"Les conflits répétés non résolus ne sont pas la cause de la détresse — ils en sont le symptôme. Leur répétition épuise progressivement les deux partenaires jusqu'au burnout relationnel : un état d'ind","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-250","type":"list","content":{"items":["Conflits récurrents autour des mêmes déclencheurs (blessures d'attachement non réparées)","Stratégies inadaptées : riposte systématique, silence punitif, menaces de rupture","Distance émotionnelle croissante ; sentiment d'impuissance partagé","Chez le désorganisé : risque de passage à la coercition ou à la violence (Lyons-Ruth et Jacobvitz, 1999)","Burnout : perte d'intérêt, émoussement affectif, désengagement silencieux"],"ordered":false},"citationIds":["citation-83","citation-72","citation-82"],"validation":{"citationLinks":[{"citationId":"citation-83","claimText":"Escalade clinique typique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-72","claimText":"Escalade clinique typique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-82","claimText":"Escalade clinique typique :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-251","type":"callout","content":{"text":"Se retirer de la riposte systématique est contre-intuitif mais cliniquement décisif : tant qu'un partenaire est perçu comme menaçant, l'autre reste en mode défensif et aucune connexion n'est possible.","visualRole":"warning"},"citationIds":["citation-82"],"validation":{"citationLinks":[{"citationId":"citation-82","claimText":"Se retirer de la riposte systématique est contre-intuitif mais cliniquement décisif : tant qu'un partenaire est perçu comme menaçant, l'autre reste en mode défensif et aucune connexion n'est possible.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-77","type":"card","content":{"title":"Synthèse clinique : ce que le thérapeute doit retenir","imageRef":"therapist listening attentive notes clinical office calm","imageAlt":"Thérapeute attentif prenant des notes dans un cabinet clinique calme","blocks":[{"id":"list-253","type":"list","content":{"items":["Chaque style insécure produit une souffrance spécifique et des symptômes identifiables — la même plainte (conflit, retrait, trouble sexuel) peut avoir une origine d'attachement différente selon le style.","L'insécure anxieux, l'évitant et le désorganisé n'ont pas les mêmes besoins cliniques : une intervention uniforme est inefficace et parfois contre-productive.","Les comorbidités (dépression, anxiété, troubles sexuels, addictions) sont souvent des symptômes secondaires d'une insécurité d'attachement non traitée — pas des diagnostics premiers indépendants.","Le burnout relationnel est un signal d'alarme tardif : la consultation intervient souvent trop tard, quand le désengagement est déjà avancé."],"ordered":false},"citationIds":["citation-76","citation-72","citation-84","citation-68"],"validation":{"citationLinks":[{"citationId":"citation-76","claimText":"Points de repère essentiels pour la pratique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-72","claimText":"Points de repère essentiels pour la pratique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-84","claimText":"Points de repère essentiels pour la pratique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-68","claimText":"Points de repère essentiels pour la pratique :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-254","type":"callout","content":{"text":"La question clinique de départ n'est pas « quel est le problème de ce couple ? » mais « quelle est la peur d'attachement qui organise ce problème — et pour chacun des deux partenaires ? »","visualRole":"success"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-78","type":"card","content":{"title":"Diagnostic différentiel : attachement insécure vs troubles personnalité","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-255","type":"paragraph","content":{"text":"Notions clés : Troubles de la personnalité et attachement, Personnalité limite et attachement anxieux, Personnalité narcissique et attachement évitant, Antisociale et attachement désorganisé, Anxiété généralisée et traumas d'attachement."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-79","type":"card","content":{"title":"La vraie question : spectre ou discontinuité ?","imageRef":"fork in the road two paths diverging forest clinical decision","imageAlt":"Chemin qui bifurque en forêt, évoquant une décision diagnostique","blocks":[{"id":"paragraph-257","type":"paragraph","content":{"text":"Un patient évite l'intimité, se montre froid en couple, incapable de nommer ses besoins. S'agit-il d'un attachement évitant bien ancré, ou d'un trouble de la personnalité constitué ? La question n'est pas rhétorique — elle détermine la cible thérapeutique, la durée du traitement et le pronostic."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-258","type":"callout","content":{"text":"Thèse centrale : l'attachement insécure et les troubles de la personnalité partagent une origine développementale commune, mais se distinguent par trois critères décisifs — la rigidité, l'égo-syntonicité et la pervasivité inter-situationnelle.","visualRole":"info"},"citationIds":["citation-85"],"validation":{"citationLinks":[{"citationId":"citation-85","claimText":"Thèse centrale : l'attachement insécure et les troubles de la personnalité partagent une origine développementale commune, mais se distinguent par trois critères décisifs — la rigidité, l'égo-syntonic","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"rigidité, l'égo-syntonicité","targetId":"m8-deepdive-egosyntonie"}],"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-80","type":"card","content":{"title":"Origine commune : l'environnement insécure précoce","imageRef":"child looking out rainy window lonely home","imageAlt":"Enfant regardant par la fenêtre sous la pluie, évoquant l'insécurité développementale précoce","blocks":[{"id":"paragraph-260","type":"paragraph","content":{"text":"Les expériences précoces d'attachement sont intégrées dans des schémas relationnels qui influencent les relations adultes et servent de stratégies de régulation émotionnelle. C'est le socle commun aux deux tableaux cliniques."},"citationIds":["citation-86"],"validation":{"citationLinks":[{"citationId":"citation-86","claimText":"Les expériences précoces d'attachement sont intégrées dans des schémas relationnels qui influencent les relations adultes et servent de stratégies de régulation émotionnelle. C'est le socle commun aux","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-261","type":"paragraph","content":{"text":"Lorsque la figure d'attachement est défaillante — protectrice à l'excès, absente ou imprévisible — elle perturbe la capacité de l'enfant à prédire le danger et à se réguler. Ce dysfonctionnement peut rester un style insécure, ou se consolider en trouble de la personnalité selon l'intensité, la durée et la multiplicité des adversités."},"citationIds":["citation-87","citation-86"],"validation":{"citationLinks":[{"citationId":"citation-87","claimText":"Lorsque la figure d'attachement est défaillante — protectrice à l'excès, absente ou imprévisible — elle perturbe la capacité de l'enfant à prédire le danger et à se réguler. Ce dysfonctionnement peut ","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-86","claimText":"Lorsque la figure d'attachement est défaillante — protectrice à l'excès, absente ou imprévisible — elle perturbe la capacité de l'enfant à prédire le danger et à se réguler. Ce dysfonctionnement peut ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-262","type":"callout","content":{"text":"Point clé : même matière première développementale, deux devenirs possibles selon la sévérité des défaillances et la présence ou non de facteurs protecteurs.","visualRole":"info"},"citationIds":["citation-88","citation-89"],"validation":{"citationLinks":[{"citationId":"citation-88","claimText":"Point clé : même matière première développementale, deux devenirs possibles selon la sévérité des défaillances et la présence ou non de facteurs protecteurs.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-89","claimText":"Point clé : même matière première développementale, deux devenirs possibles selon la sévérité des défaillances et la présence ou non de facteurs protecteurs.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-81","type":"card","content":{"title":"Les trois critères du diagnostic différentiel","imageRef":"clinical diagnostic checklist psychiatry notebook pen","imageAlt":"Carnet clinique avec liste de critères diagnostiques","blocks":[{"id":"list-264","type":"list","content":{"items":["Rigidité : les schémas s'activent de façon invariante, quelle que soit la situation relationnelle — même là où le contexte ne le justifie pas.","Égo-syntonicité : le patient ne perçoit pas ses patterns comme problématiques ; les remettre en question revient, pour lui, à « mourir une partie de lui-même ».","Pervasivité : les dysfonctionnements envahissent tous les domaines de vie — professionnel, social, intime — pas seulement le contexte de couple."],"ordered":false},"citationIds":["citation-85"],"validation":{"citationLinks":[{"citationId":"citation-85","claimText":"Ce qui distingue un trouble de la personnalité d'un style d'attachement insécure :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-265","type":"callout","content":{"text":"Un style d'attachement insécure est situationnel et activé par la proximité intime. Un trouble de la personnalité est structurel et pervasif — il précède les relations, il ne s'y réduit pas.","visualRole":"info"},"citationIds":["citation-85"],"validation":{"citationLinks":[{"citationId":"citation-85","claimText":"Un style d'attachement insécure est situationnel et activé par la proximité intime. Un trouble de la personnalité est structurel et pervasif — il précède les relations, il ne s'y réduit pas.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-82","type":"card","content":{"title":"Personnalité limite et attachement anxieux-désorganisé","imageRef":"person sitting alone on floor emotional distress clinical psychology","imageAlt":"Personne assise seule sur le sol dans un état de détresse émotionnelle","blocks":[{"id":"paragraph-267","type":"paragraph","content":{"text":"Le trouble de la personnalité borderline (TPB) présente la superposition la plus dense avec l'attachement insécure. Les personnes avec un style craintif-évitant aspirent à l'intimité mais sont submergées par la peur dès qu'elle s'approche — oscillant entre quête intense et rejet brutal."},"citationIds":["citation-90"],"validation":{"citationLinks":[{"citationId":"citation-90","claimText":"Le trouble de la personnalité borderline (TPB) présente la superposition la plus dense avec l'attachement insécure. Les personnes avec un style craintif-évitant aspirent à l'intimité mais sont submerg","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-268","type":"paragraph","content":{"text":"La recherche sur les mères présentant un TPB montre un impact direct sur les comportements d'attachement de leurs bébés à 13 mois — la pathologie de personnalité maternelle génère des patterns insécures ou désorganisés à la génération suivante."},"citationIds":["citation-91"],"validation":{"citationLinks":[{"citationId":"citation-91","claimText":"La recherche sur les mères présentant un TPB montre un impact direct sur les comportements d'attachement de leurs bébés à 13 mois — la pathologie de personnalité maternelle génère des patterns insécur","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-269","type":"callout","content":{"text":"Ce qui distingue le TPB du style anxieux : l'instabilité identitaire profonde, la dysrégulation émotionnelle constitutive et la pervasivité des patterns interpersonnels — pas seulement l'intensité de l'anxiété d'abandon.","visualRole":"info"},"citationIds":["citation-92","citation-93"],"validation":{"citationLinks":[{"citationId":"citation-92","claimText":"Ce qui distingue le TPB du style anxieux : l'instabilité identitaire profonde, la dysrégulation émotionnelle constitutive et la pervasivité des patterns interpersonnels — pas seulement l'intensité de ","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-93","claimText":"Ce qui distingue le TPB du style anxieux : l'instabilité identitaire profonde, la dysrégulation émotionnelle constitutive et la pervasivité des patterns interpersonnels — pas seulement l'intensité de ","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"patterns interpersonnels","targetId":"m8-deepdive-tpl-patterns"}],"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-83","type":"card","content":{"title":"Personnalité narcissique et attachement évitant","imageRef":"mirror reflection person standing alone cold expression","imageAlt":"Reflet dans un miroir d'une personne distante et froide","blocks":[{"id":"paragraph-271","type":"paragraph","content":{"text":"Le style évitant-détaché et la personnalité narcissique partagent une apparence de self-suffisance, un faible investissement émotionnel de l'autre et une tendance à la dévaluation relationnelle. La confusion est fréquente en début de prise en charge."},"citationIds":["citation-94"],"validation":{"citationLinks":[{"citationId":"citation-94","claimText":"Le style évitant-détaché et la personnalité narcissique partagent une apparence de self-suffisance, un faible investissement émotionnel de l'autre et une tendance à la dévaluation relationnelle. La co","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-272","type":"list","content":{"items":["Manque d'empathie constitutif — non situationnel, non lié à la menace d'intimité.","Exploitation instrumentale de l'autre pour atteindre ses propres objectifs.","Sentiment de supériorité et arrogance stables — pas une défense contre la honte, mais une position rigide.","Schémas d'imperfection et de carence affective compensés par la grandiosité."],"ordered":false},"citationIds":["citation-95"],"validation":{"citationLinks":[{"citationId":"citation-95","claimText":"Ce qui distingue la personnalité narcissique du simple attachement évitant :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-273","type":"callout","content":{"text":"Le patient évitant peut apprendre à aller vers l'autre quand le contexte relationnel devient sécure. Le patient narcissique, lui, ne perçoit pas l'autre comme un sujet dont les besoins comptent.","visualRole":"info"},"citationIds":["citation-95","citation-96"],"validation":{"citationLinks":[{"citationId":"citation-95","claimText":"Le patient évitant peut apprendre à aller vers l'autre quand le contexte relationnel devient sécure. Le patient narcissique, lui, ne perçoit pas l'autre comme un sujet dont les besoins comptent.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-96","claimText":"Le patient évitant peut apprendre à aller vers l'autre quand le contexte relationnel devient sécure. Le patient narcissique, lui, ne perçoit pas l'autre comme un sujet dont les besoins comptent.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-84","type":"card","content":{"title":"Personnalité antisociale et attachement désorganisé","imageRef":"broken chain metal dark background fragmentation","imageAlt":"Chaîne brisée sur fond sombre évoquant la rupture du lien","blocks":[{"id":"paragraph-275","type":"paragraph","content":{"text":"L'individu émotionnellement détaché, incapable de maintenir un lien affectif durable avec quiconque, a souvent une histoire de privation prolongée d'attention maternelle dans la prime enfance, associée à un rejet ultérieur. Bowlby voyait dans ce tableau la forme la plus sévère d'évolution pathologique du comportement d'attachement."},"citationIds":["citation-97"],"validation":{"citationLinks":[{"citationId":"citation-97","claimText":"L'individu émotionnellement détaché, incapable de maintenir un lien affectif durable avec quiconque, a souvent une histoire de privation prolongée d'attention maternelle dans la prime enfance, associé","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-276","type":"list","content":{"items":["L'attachement désorganisé produit de la confusion et de la souffrance — le sujet est piégé entre le besoin et la peur de l'autre.","La personnalité antisociale marque une extinction du système d'attachement lui-même — l'autre n'est plus une figure, il est un objet ou une menace."],"ordered":false},"citationIds":["citation-97"],"validation":{"citationLinks":[{"citationId":"citation-97","claimText":"Distinction clinique clé :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-277","type":"callout","content":{"text":"Cliniquement : en présence d'un style désorganisé, on cherche encore le lien sous la désorganisation. En présence d'un trouble antisocial, le lien est absent — non inhibé, absent.","visualRole":"warning"},"citationIds":["citation-97"],"validation":{"citationLinks":[{"citationId":"citation-97","claimText":"Cliniquement : en présence d'un style désorganisé, on cherche encore le lien sous la désorganisation. En présence d'un trouble antisocial, le lien est absent — non inhibé, absent.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-85","type":"card","content":{"title":"Anxiété généralisée et traumas d'attachement","imageRef":"anxiety person window worried hands clinical therapy session","imageAlt":"Personne anxieuse près d'une fenêtre, mains croisées, en attente","blocks":[{"id":"paragraph-279","type":"paragraph","content":{"text":"Le trouble anxieux généralisé (TAG) et les traumas d'attachement précoces se confondent souvent en consultation. L'adulte surgénéralise les situations insécurisées du passé vers le présent, même lorsqu'un infime détail suffit à déclencher la réponse de menace."},"citationIds":["citation-86"],"validation":{"citationLinks":[{"citationId":"citation-86","claimText":"Le trouble anxieux généralisé (TAG) et les traumas d'attachement précoces se confondent souvent en consultation. L'adulte surgénéralise les situations insécurisées du passé vers le présent, même lorsq","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-280","type":"list","content":{"items":["Le TAG se manifeste dans des domaines larges (santé, finances, avenir) — l'anxiété d'attachement est centrée sur la disponibilité et la réponse de l'autre.","Un trauma d'attachement produit des réactions déclenchées qui semblent « venir de nulle part » — marqueur d'une mémoire implicite, non d'un trouble anxieux généralisé.","La coexistence est fréquente : chercher si l'anxiété relationnelle précède ou suit l'anxiété diffuse."],"ordered":false},"citationIds":["citation-86","citation-90"],"validation":{"citationLinks":[{"citationId":"citation-86","claimText":"Indices différentiels à explorer en entretien :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-90","claimText":"Indices différentiels à explorer en entretien :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-86","type":"card","content":{"title":"Chevauchements et comorbidités : ce que dit la recherche","imageRef":"venn diagram overlap two circles research clinical data","imageAlt":"Deux cercles qui se chevauchent représentant la comorbidité","blocks":[{"id":"paragraph-282","type":"paragraph","content":{"text":"Les styles d'attachement insécure ne causent pas mécaniquement les troubles de la personnalité — mais ils constituent des voies de vulnérabilité. Les mécanismes incluent la dérégulation émotionnelle, la surgénéralisation des représentations relationnelles négatives et l'échec des stratégies de coping interpersonnel."},"citationIds":["citation-86"],"validation":{"citationLinks":[{"citationId":"citation-86","claimText":"Les styles d'attachement insécure ne causent pas mécaniquement les troubles de la personnalité — mais ils constituent des voies de vulnérabilité. Les mécanismes incluent la dérégulation émotionnelle, ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-283","type":"paragraph","content":{"text":"Une étude (Kramer et al., 2021) sur le trouble borderline montre que la diminution de la pervasivité des patterns interpersonnels est le médiateur central de l'amélioration symptomatique après traitement — ce qui confirme que cibler la dimension relationnelle est une voie thérapeutique décisive."},"citationIds":["citation-93"],"validation":{"citationLinks":[{"citationId":"citation-93","claimText":"Une étude (Kramer et al., 2021) sur le trouble borderline montre que la diminution de la pervasivité des patterns interpersonnels est le médiateur central de l'amélioration symptomatique après traitem","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-284","type":"callout","content":{"text":"Le diagnostic différentiel n'est pas une étiquette — c'est une carte. Elle indique au clinicien où agir en priorité et à quelle profondeur.","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-87","type":"card","content":{"title":"Adapter l'intervention selon le diagnostic","imageRef":"therapist and patient conversation therapy office face to face","imageAlt":"Thérapeute et patient en conversation en face à face dans un cabinet","blocks":[{"id":"list-286","type":"list","content":{"items":["Style insécure seul : travail sur la sécurité relationnelle en couple, psychoéducation sur les déclencheurs, EFT — objectifs accessibles en thérapie brève à intermédiaire.","Comorbidité trouble de la personnalité : traitement plus long, centré sur les schémas précoces et les modes ; la relation thérapeutique devient elle-même l'outil principal.","TPB : surveiller les ruptures de cadre, la dissociation, la crise — la stabilisation précède tout travail de fond.","Narcissique ou antisociale : ne pas viser l'intimité comme objectif immédiat ; travailler d'abord la motivation au changement et la reconnaissance de l'impact sur l'autre."],"ordered":false},"citationIds":["citation-85","citation-98","citation-99"],"validation":{"citationLinks":[{"citationId":"citation-85","claimText":"Implications cliniques directes du diagnostic différentiel :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-98","claimText":"Implications cliniques directes du diagnostic différentiel :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-99","claimText":"Implications cliniques directes du diagnostic différentiel :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-287","type":"callout","content":{"text":"Règle clinique : une thérapie de couple efficace requiert que la stabilité du cadre individuel soit évaluée avant — ou en parallèle. Là où un trouble de la personnalité est actif et non reconnu, le travail de couple peut exacerber les symptômes.","visualRole":"warning"},"citationIds":["citation-100"],"validation":{"citationLinks":[{"citationId":"citation-100","claimText":"Règle clinique : une thérapie de couple efficace requiert que la stabilité du cadre individuel soit évaluée avant — ou en parallèle. Là où un trouble de la personnalité est actif et non reconnu, le tr","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-88","type":"card","content":{"title":"Auto-évaluation : distinguer les tableaux cliniques","imageRef":"student writing exam focused desk university","imageAlt":"Étudiante concentrée qui écrit lors d'une évaluation","blocks":[{"id":"questionnaire-289","type":"questionnaire","content":{"questions":[{"text":"Un patient évite systématiquement toute discussion sur ses émotions, mais uniquement dans le contexte intime. Au travail, ses relations sont fluides et adaptées. Quel tableau évoquez-vous en priorité ?","options":[{"text":"Trouble de la personnalité évitante — la pervasivité est présente mais sous-estimée.","points":0},{"text":"Style d'attachement évitant — la spécificité contextuelle oriente vers un pattern relationnel, non un trouble structurel.","points":2},{"text":"Personnalité narcissique compensée.","points":0}]},{"text":"Lors de l'évaluation diagnostique, un patient décrit ses comportements dysfonctionnels comme des forces ou des adaptations naturelles. Il ne perçoit pas de problème. Quel critère clinique cela illustre-t-il ?","options":[{"text":"La rigidité cognitive.","points":1},{"text":"L'égo-syntonicité, caractéristique centrale des troubles de personnalité.","points":2},{"text":"La surgénéralisation des représentations d'attachement.","points":0}]},{"text":"Une patiente présente une intense peur de l'abandon, des épisodes de dissociation en cas de conflit conjugal, une instabilité identitaire et des comportements auto-dommageables. Quel diagnostic différentiel prioritaire ?","options":[{"text":"Anxiété généralisée avec traits évitants.","points":0},{"text":"Style anxieux-ambivalent — la sévérité ne justifie pas un diagnostic de trouble de la personnalité.","points":1},{"text":"Trouble de la personnalité borderline avec attachement désorganisé — la pervasivité, la dysrégulation et l'instabilité identitaire sont constitutives.","points":2}]},{"text":"Un patient en thérapie de couple reconnaît souffrir de son pattern de retrait, souhaite changer et montre une capacité de mentalisation intacte. Sa souffrance est ego-dystonique. Quelle implication pour le pronostic thérapeutique ?","options":[{"text":"Pronostic réservé — les patterns insécures sont aussi résistants que les troubles de personnalité.","points":0},{"text":"Pronostic favorable — la conscience du problème et la motivation au changement sont des facteurs protecteurs majeurs.","points":2},{"text":"Indéterminé — seule la durée de traitement permettra de trancher.","points":1}]},{"text":"Chez un patient avec personnalité narcissique, quelle cible thérapeutique est la plus adaptée en début de traitement ?","options":[{"text":"Travail immédiat sur la vulnérabilité et l'intimité émotionnelle en couple.","points":0},{"text":"Psychoéducation sur les styles d'attachement et identification des patterns.","points":1},{"text":"Reconnaissance de l'impact sur l'autre et motivation au changement — avant tout objectif d'intimité.","points":2}]}],"profiles":[{"label":"À consolider","interpretation":"Certaines distinctions diagnostiques méritent d'être approfondies. Reprenez les critères de rigidité, d'égo-syntonicité et de pervasivité — ils sont le cœur du diagnostic différentiel.","minScore":-1000000,"maxScore":3},{"label":"En bonne voie","interpretation":"Vous maîtrisez plusieurs distinctions clés mais quelques nuances cliniques restent à affiner, notamment sur les implications thérapeutiques directes de chaque tableau.","minScore":4,"maxScore":7},{"label":"Maîtrise clinique","interpretation":"Vous distinguez avec précision les tableaux d'attachement insécure et de troubles de la personnalité, et vous en tirez des implications thérapeutiques adaptées. Excellente base pour la pratique clinique.","minScore":8,"maxScore":1000000}],"allowTwoPartners":false},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-89","type":"card","content":{"title":"Principes d'intervention fondés sur l'attachement","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-290","type":"paragraph","content":{"text":"Notions clés : Sécurité thérapeutique, Alliance thérapeutique, Mentalisation et réflexivité, Validation émotionnelle, Régulation affective conjointe, Rupture et réparation."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-90","type":"card","content":{"title":"Ce qui change quand on pense en termes d'attachement","imageRef":"therapist patient dialogue safe conversation clinical office","imageAlt":"Thérapeute et patient en dialogue dans un cabinet clinique sécurisant","blocks":[{"id":"paragraph-292","type":"paragraph","content":{"text":"Travailler avec l'attachement, ce n'est pas appliquer un protocole de plus. C'est adopter une lecture radicalement différente de la souffrance : la douleur du couple n'est pas un problème de communication — c'est un signal de danger d'attachement."},"citationIds":["citation-101"],"validation":{"citationLinks":[{"citationId":"citation-101","claimText":"Travailler avec l'attachement, ce n'est pas appliquer un protocole de plus. C'est adopter une lecture radicalement différente de la souffrance : la douleur du couple n'est pas un problème de communica","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-293","type":"callout","content":{"text":"Postulat fondateur : derrière chaque conflit de couple se joue une question de sécurité — « Es-tu là pour moi ? Puis-je compter sur toi ? » Répondre à cette question, c'est le travail.","visualRole":"info"},"citationIds":["citation-102"],"validation":{"citationLinks":[{"citationId":"citation-102","claimText":"Postulat fondateur : derrière chaque conflit de couple se joue une question de sécurité — « Es-tu là pour moi ? Puis-je compter sur toi ? » Répondre à cette question, c'est le travail.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-294","type":"paragraph","content":{"text":"Ce changement de cadre oriente chaque décision clinique : ce qu'on observe, ce qu'on valide, ce qu'on cible. Les six principes qui suivent en découlent directement."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-91","type":"card","content":{"title":"Principe 1 — La sécurité thérapeutique comme condition première","imageRef":"calm therapy room soft light secure space","imageAlt":"Espace thérapeutique calme et sécurisant avec lumière douce","blocks":[{"id":"paragraph-296","type":"paragraph","content":{"text":"Aucune exploration émotionnelle profonde n'est possible tant que le patient ne ressent pas le cabinet comme un espace sûr. La sécurité thérapeutique n'est pas un préalable formel : c'est une construction active, séance après séance."},"citationIds":["citation-103"],"validation":{"citationLinks":[{"citationId":"citation-103","claimText":"Aucune exploration émotionnelle profonde n'est possible tant que le patient ne ressent pas le cabinet comme un espace sûr. La sécurité thérapeutique n'est pas un préalable formel : c'est une construct","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-297","type":"callout","content":{"text":"Le thérapeute devient littéralement une base de sécurité — au sens de Bowlby : un point d'ancrage depuis lequel le patient peut explorer ce qui lui fait peur, avec la certitude d'un retour possible.","visualRole":"info"},"citationIds":["citation-104","citation-103"],"validation":{"citationLinks":[{"citationId":"citation-104","claimText":"Le thérapeute devient littéralement une base de sécurité — au sens de Bowlby : un point d'ancrage depuis lequel le patient peut explorer ce qui lui fait peur, avec la certitude d'un retour possible.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-103","claimText":"Le thérapeute devient littéralement une base de sécurité — au sens de Bowlby : un point d'ancrage depuis lequel le patient peut explorer ce qui lui fait peur, avec la certitude d'un retour possible.","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"base de sécurité","targetId":"m9-deepdive-base-securite"}],"_status":"needs-review"},{"id":"paragraph-298","type":"paragraph","content":{"text":"En thérapie de couple, cela se complique : chaque partenaire doit se sentir en sécurité avec le thérapeute, ET suffisamment en sécurité avec l'autre pour prendre des risques émotionnels en sa présence."},"citationIds":["citation-105"],"validation":{"citationLinks":[{"citationId":"citation-105","claimText":"En thérapie de couple, cela se complique : chaque partenaire doit se sentir en sécurité avec le thérapeute, ET suffisamment en sécurité avec l'autre pour prendre des risques émotionnels en sa présence","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-92","type":"card","content":{"title":"Principe 2 — L'alliance thérapeutique, un enjeu d'attachement","imageRef":"therapeutic alliance trust collaboration two people working together","imageAlt":"Deux personnes en collaboration thérapeutique, regard de confiance","blocks":[{"id":"paragraph-300","type":"paragraph","content":{"text":"L'alliance thérapeutique n'est pas qu'un facteur commun générique. Vue par le prisme de l'attachement, elle reproduit la dynamique même que le thérapeute cherche à soigner : un lien où l'on peut se montrer vulnérable sans craindre d'être jugé, quitté ou submergé."},"citationIds":["citation-105"],"validation":{"citationLinks":[{"citationId":"citation-105","claimText":"L'alliance thérapeutique n'est pas qu'un facteur commun générique. Vue par le prisme de l'attachement, elle reproduit la dynamique même que le thérapeute cherche à soigner : un lien où l'on peut se mo","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-301","type":"list","content":{"items":["Accord sur les buts — le patient sait où l'on va et pourquoi.","Accord sur les tâches — il comprend ce qu'on lui demande de faire et y consent.","Lien affectif — il ressent que le thérapeute le respecte et croit en sa capacité à changer."],"ordered":true},"citationIds":["citation-106","citation-105"],"validation":{"citationLinks":[{"citationId":"citation-106","claimText":"Accord sur les buts — le patient sait où l'on va et pourquoi.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-105","claimText":"Accord sur les buts — le patient sait où l'on va et pourquoi.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-302","type":"callout","content":{"text":"Attention : en couple, il faut construire DEUX alliances individuelles et une alliance systémique. Perdre l'un des partenaires, c'est perdre la thérapie.","visualRole":"warning"},"citationIds":["citation-107"],"validation":{"citationLinks":[{"citationId":"citation-107","claimText":"Attention : en couple, il faut construire DEUX alliances individuelles et une alliance systémique. Perdre l'un des partenaires, c'est perdre la thérapie.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-93","type":"card","content":{"title":"Principe 3 — Mentalisation et réflexivité comme levier central","imageRef":"person deep reflection introspection psychology thought","imageAlt":"Personne en état de réflexion profonde, introspection psychologique","blocks":[{"id":"paragraph-304","type":"paragraph","content":{"text":"Mentaliser, c'est être capable de se représenter ses propres états mentaux ET ceux de l'autre — de comprendre que le comportement du partenaire a une cause interne, pas seulement une intention hostile. Cette capacité s'effondre exactement quand le système d'attachement est activé."},"citationIds":["citation-108","citation-109"],"validation":{"citationLinks":[{"citationId":"citation-108","claimText":"Mentaliser, c'est être capable de se représenter ses propres états mentaux ET ceux de l'autre — de comprendre que le comportement du partenaire a une cause interne, pas seulement une intention hostile","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-109","claimText":"Mentaliser, c'est être capable de se représenter ses propres états mentaux ET ceux de l'autre — de comprendre que le comportement du partenaire a une cause interne, pas seulement une intention hostile","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-305","type":"callout","content":{"text":"Paradoxe clinique : c'est dans les moments de conflit — ceux où la mentalisation serait la plus utile — qu'elle est la moins disponible. L'intervention doit donc créer les conditions de son retour, pas exiger qu'elle soit déjà là.","visualRole":"warning"},"citationIds":["citation-109"],"validation":{"citationLinks":[{"citationId":"citation-109","claimText":"Paradoxe clinique : c'est dans les moments de conflit — ceux où la mentalisation serait la plus utile — qu'elle est la moins disponible. L'intervention doit donc créer les conditions de son retour, pa","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-306","type":"paragraph","content":{"text":"La posture de réflexivité du thérapeute — curieux, non-jugeant, modélisant l'incertitude — est elle-même un outil : elle invite les partenaires à habiter la même posture l'un envers l'autre."},"citationIds":["citation-109","citation-110"],"validation":{"citationLinks":[{"citationId":"citation-109","claimText":"La posture de réflexivité du thérapeute — curieux, non-jugeant, modélisant l'incertitude — est elle-même un outil : elle invite les partenaires à habiter la même posture l'un envers l'autre.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-110","claimText":"La posture de réflexivité du thérapeute — curieux, non-jugeant, modélisant l'incertitude — est elle-même un outil : elle invite les partenaires à habiter la même posture l'un envers l'autre.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-94","type":"card","content":{"title":"Principe 4 — La validation émotionnelle avant toute intervention","imageRef":"empathic listening person emotional support acknowledgment","imageAlt":"Personne écoutant avec empathie et validation émotionnelle","blocks":[{"id":"paragraph-308","type":"paragraph","content":{"text":"Valider une émotion, c'est signifier à l'autre que ce qu'il ressent a du sens — au regard de son histoire, de la situation, de son système d'attachement. Ce n'est pas approuver le comportement. C'est reconnaître la détresse sous-jacente."},"citationIds":["citation-102"],"validation":{"citationLinks":[{"citationId":"citation-102","claimText":"Valider une émotion, c'est signifier à l'autre que ce qu'il ressent a du sens — au regard de son histoire, de la situation, de son système d'attachement. Ce n'est pas approuver le comportement. C'est ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-309","type":"callout","content":{"text":"En thérapie d'attachement, la validation précède toujours la restructuration. Un patient dont la détresse n'est pas reconnue ne peut pas apprendre — il survit.","visualRole":"critical"},"citationIds":["citation-111"],"validation":{"citationLinks":[{"citationId":"citation-111","claimText":"En thérapie d'attachement, la validation précède toujours la restructuration. Un patient dont la détresse n'est pas reconnue ne peut pas apprendre — il survit.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-310","type":"paragraph","content":{"text":"La figure d'attachement défaillante n'a pas toujours manqué d'amour — elle a souvent manqué de capacité à percevoir et à valider l'état émotionnel de l'enfant. Le thérapeute répare précisément cela."},"citationIds":["citation-112"],"validation":{"citationLinks":[{"citationId":"citation-112","claimText":"La figure d'attachement défaillante n'a pas toujours manqué d'amour — elle a souvent manqué de capacité à percevoir et à valider l'état émotionnel de l'enfant. Le thérapeute répare précisément cela.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-95","type":"card","content":{"title":"Principe 5 — La régulation affective conjointe","imageRef":"couple emotional co-regulation synchronized calm breathing therapy","imageAlt":"Couple en régulation émotionnelle partagée, synchronisation calme","blocks":[{"id":"paragraph-312","type":"paragraph","content":{"text":"La régulation affective n'est pas un processus solitaire. Du nourrisson qui se régule dans les bras de sa mère à l'adulte qui se calme en sentant la présence de son partenaire : l'attachement est un système de régulation interpersonnel."},"citationIds":["citation-101","citation-108"],"validation":{"citationLinks":[{"citationId":"citation-101","claimText":"La régulation affective n'est pas un processus solitaire. Du nourrisson qui se régule dans les bras de sa mère à l'adulte qui se calme en sentant la présence de son partenaire : l'attachement est un s","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-108","claimText":"La régulation affective n'est pas un processus solitaire. Du nourrisson qui se régule dans les bras de sa mère à l'adulte qui se calme en sentant la présence de son partenaire : l'attachement est un s","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-313","type":"paragraph","content":{"text":"En thérapie de couple, la régulation conjointe est à la fois un objectif ET un outil. Le thérapeute module l'activation émotionnelle des séances : ni trop froide (pas de contact avec la détresse réelle), ni trop chaude (effondrement de la capacité réflexive)."},"citationIds":["citation-110"],"validation":{"citationLinks":[{"citationId":"citation-110","claimText":"En thérapie de couple, la régulation conjointe est à la fois un objectif ET un outil. Le thérapeute module l'activation émotionnelle des séances : ni trop froide (pas de contact avec la détresse réell","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-314","type":"callout","content":{"text":"Les schèmes d'attachement sont inscrits en mémoire procédurale — ils s'activent dans la relation avant la pensée. La régulation conjointe en séance offre une expérience correctrice qui ne passe pas d'abord par le langage.","visualRole":"info"},"citationIds":["citation-108"],"validation":{"citationLinks":[{"citationId":"citation-108","claimText":"Les schèmes d'attachement sont inscrits en mémoire procédurale — ils s'activent dans la relation avant la pensée. La régulation conjointe en séance offre une expérience correctrice qui ne passe pas d'","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-96","type":"card","content":{"title":"Principe 6 — Rupture et réparation : un levier, pas un accident","imageRef":"repair relationship reconnection after conflict mending bond","imageAlt":"Moment de réconciliation et de réparation relationnelle entre deux personnes","blocks":[{"id":"paragraph-316","type":"paragraph","content":{"text":"Les ruptures d'alliance sont inévitables. Un thérapeute qui croit les éviter toutes ne les voit simplement pas. Ce qui compte, ce n'est pas leur absence — c'est leur réparation."},"citationIds":["citation-104"],"validation":{"citationLinks":[{"citationId":"citation-104","claimText":"Les ruptures d'alliance sont inévitables. Un thérapeute qui croit les éviter toutes ne les voit simplement pas. Ce qui compte, ce n'est pas leur absence — c'est leur réparation.","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"ruptures d'alliance","targetId":"m9-deepdive-rupture-reparation"}],"_status":"needs-review"},{"id":"list-317","type":"list","content":{"items":["Repérer le signal de rupture : retrait, hostilité, sur-compliance ou déflexion.","Nommer sans défense : « Je pense que quelque chose s'est passé entre nous. Qu'est-ce que vous avez ressenti ? »","Réparer activement : reconnaître l'impact, ajuster, rester en lien."],"ordered":true},"citationIds":["citation-106","citation-105"],"validation":{"citationLinks":[{"citationId":"citation-106","claimText":"Repérer le signal de rupture : retrait, hostilité, sur-compliance ou déflexion.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-105","claimText":"Repérer le signal de rupture : retrait, hostilité, sur-compliance ou déflexion.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-318","type":"callout","content":{"text":"Chaque réparation réussie en séance est une démonstration en direct : les liens peuvent se rompre ET se ressouder. Pour un patient à l'attachement insécure, c'est souvent une expérience radicalement nouvelle.","visualRole":"success"},"citationIds":["citation-104","citation-113"],"validation":{"citationLinks":[{"citationId":"citation-104","claimText":"Chaque réparation réussie en séance est une démonstration en direct : les liens peuvent se rompre ET se ressouder. Pour un patient à l'attachement insécure, c'est souvent une expérience radicalement n","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-113","claimText":"Chaque réparation réussie en séance est une démonstration en direct : les liens peuvent se rompre ET se ressouder. Pour un patient à l'attachement insécure, c'est souvent une expérience radicalement n","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-97","type":"card","content":{"title":"La posture clinique : être une présence régulante","imageRef":"therapist calm centered attentive clinical posture","imageAlt":"Thérapeute attentif et centré, posture clinique régulante","blocks":[{"id":"paragraph-320","type":"paragraph","content":{"text":"Les six principes convergent vers une exigence de posture. Le thérapeute fondé sur l'attachement n'est pas un technicien qui applique des techniques — il est lui-même un instrument clinique dont la régulation interne conditionne l'effet thérapeutique."},"citationIds":["citation-103"],"validation":{"citationLinks":[{"citationId":"citation-103","claimText":"Les six principes convergent vers une exigence de posture. Le thérapeute fondé sur l'attachement n'est pas un technicien qui applique des techniques — il est lui-même un instrument clinique dont la ré","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-321","type":"list","content":{"items":["Disponibilité émotionnelle : être affecté sans être submergé.","Cohérence : ce que le thérapeute dit et ce qu'il fait convergent — les patients insécures détectent toute dissonance.","Flexibilité : adapter le niveau d'activation, la proximité et la distance à chaque patient, à chaque moment.","Surveillance du contre-transfert lié à l'attachement : ses propres modèles internes opérants s'activent en séance."],"ordered":false},"citationIds":["citation-107","citation-103"],"validation":{"citationLinks":[{"citationId":"citation-107","claimText":"Disponibilité émotionnelle : être affecté sans être submergé.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-103","claimText":"Disponibilité émotionnelle : être affecté sans être submergé.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-322","type":"callout","content":{"text":"Recherche (Djillali, Plantade-Gipch & de Roten, 2024) : sur 300 cliniciens, l'âge et les attitudes face à la psychothérapie prédisent la capacité à se constituer comme base de sécurité pour le patient. La posture se travaille — elle ne va pas de soi.","visualRole":"info"},"citationIds":["citation-103"],"validation":{"citationLinks":[{"citationId":"citation-103","claimText":"Recherche (Djillali, Plantade-Gipch & de Roten, 2024) : sur 300 cliniciens, l'âge et les attitudes face à la psychothérapie prédisent la capacité à se constituer comme base de sécurité pour le patient","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-98","type":"card","content":{"title":"Intégration : les six principes en système","imageRef":"interconnected system clinical framework diagram abstract","imageAlt":"Représentation abstraite d'un système clinique interconnecté","blocks":[{"id":"paragraph-324","type":"paragraph","content":{"text":"Ces six principes ne sont pas une liste à cocher — ils forment un système. La sécurité rend l'alliance possible. L'alliance ouvre la mentalisation. La validation permet la régulation. Et les ruptures réparées prouvent que tout cela fonctionne."},"citationIds":["citation-104","citation-111"],"validation":{"citationLinks":[{"citationId":"citation-104","claimText":"Ces six principes ne sont pas une liste à cocher — ils forment un système. La sécurité rend l'alliance possible. L'alliance ouvre la mentalisation. La validation permet la régulation. Et les ruptures ","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-111","claimText":"Ces six principes ne sont pas une liste à cocher — ils forment un système. La sécurité rend l'alliance possible. L'alliance ouvre la mentalisation. La validation permet la régulation. Et les ruptures ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-325","type":"list","content":{"items":["Sécurité thérapeutique — condition d'entrée.","Alliance — contrat de confiance.","Mentalisation — levier cognitivo-affectif.","Validation — reconnaissance de la détresse.","Régulation conjointe — expérience corporelle et relationnelle.","Rupture et réparation — apprentissage par l'expérience du lien."],"ordered":true},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-326","type":"callout","content":{"text":"L'objectif final n'est pas que les partenaires comprennent leur attachement — c'est qu'ils en fassent l'expérience différemment, ensemble, dans la séance.","visualRole":"success"},"citationIds":["citation-113","citation-102"],"validation":{"citationLinks":[{"citationId":"citation-113","claimText":"L'objectif final n'est pas que les partenaires comprennent leur attachement — c'est qu'ils en fassent l'expérience différemment, ensemble, dans la séance.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-102","claimText":"L'objectif final n'est pas que les partenaires comprennent leur attachement — c'est qu'ils en fassent l'expérience différemment, ensemble, dans la séance.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-99","type":"card","content":{"title":"Auto-évaluation : votre posture d'intervention","imageRef":"self assessment reflection clinician professional development","imageAlt":"Clinicien en démarche d'auto-évaluation et de développement professionnel","blocks":[{"id":"paragraph-328","type":"paragraph","content":{"text":"Avant de passer au module suivant, évaluez votre posture actuelle face aux six principes. Ce questionnaire n'est pas un test de connaissance — c'est un outil de conscience clinique."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"questionnaire-329","type":"questionnaire","content":{"questions":[{"text":"Lorsqu'un patient ou un couple manifeste une détresse intense en séance, quelle est votre réaction spontanée ?","options":[{"text":"Je cherche rapidement une technique pour contenir ou réorienter.","points":1},{"text":"Je tolère la détresse mais j'ai du mal à rester pleinement présent.","points":2},{"text":"Je reste disponible émotionnellement tout en maintenant mon assise interne.","points":3}]},{"text":"Comment évaluez-vous votre capacité à repérer une rupture d'alliance en cours de séance ?","options":[{"text":"Je les repère rarement sur le moment, plutôt en supervision après coup.","points":1},{"text":"Je les repère parfois, mais j'hésite à les nommer de peur de fragiliser le lien.","points":2},{"text":"Je les nomme activement et j'engage une réparation explicite.","points":3}]},{"text":"Face à un patient à l'attachement anxieux, votre posture tend à...","options":[{"text":"Maintenir une distance professionnelle pour ne pas encourager la dépendance.","points":1},{"text":"Moduler la proximité selon l'état émotionnel du patient dans l'instant.","points":2},{"text":"Offrir activement de la disponibilité tout en posant des limites claires et contenantes.","points":3}]},{"text":"Dans quelle mesure intégrez-vous la validation émotionnelle AVANT toute intervention technique ?","options":[{"text":"Rarement — je passe rapidement à la reformulation ou à la psychoéducation.","points":1},{"text":"Parfois — cela dépend de mon évaluation de l'urgence clinique.","points":2},{"text":"Systématiquement — c'est mon point d'entrée dans chaque moment difficile.","points":3}]},{"text":"Comment surveillez-vous l'activation de vos propres modèles internes opérants en séance de couple ?","options":[{"text":"Je n'y pense pas en séance, seulement en supervision.","points":1},{"text":"J'ai quelques repères mais ma vigilance est irrégulière.","points":2},{"text":"J'ai développé des marqueurs internes qui m'alertent en temps réel.","points":3}]}],"profiles":[{"label":"En construction","interpretation":"Votre posture est en cours de formation. Les six principes sont connus intellectuellement mais pas encore incarnés en séance. Priorisez la supervision centrée sur l'attachement et des exercices de régulation interne avant et après les séances.","minScore":-1000000,"maxScore":8},{"label":"En transition","interpretation":"Vous appliquez les principes de façon inégale selon les contextes et la charge émotionnelle. La direction est juste — le travail porte sur la cohérence et la disponibilité sous pression. La supervision de cas complexes vous sera particulièrement utile.","minScore":9,"maxScore":11},{"label":"Posture intégrée","interpretation":"Les six principes sont opérationnels dans votre pratique. Vous constituez une base de sécurité réelle pour vos patients. Restez vigilant aux angles morts liés à vos propres patterns d'attachement — ils ne disparaissent pas, ils se gèrent.","minScore":12,"maxScore":1000000}],"allowTwoPartners":false},"citationIds":["citation-103"],"validation":{"citationLinks":[{"citationId":"citation-103","claimText":"Affirmation du bloc.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-100","type":"card","content":{"title":"Thérapie émotionnelle focalisée (EFT) pour le couple","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-330","type":"paragraph","content":{"text":"Notions clés : Blamer-protéger-distancer, Vulnérabilité primaire, Demandes cachées, Moments de vulnérabilité, Réconciliation, Sécurité gagnée."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-101","type":"card","content":{"title":"L'EFT : une réponse aux impasses émotionnelles du couple","imageRef":"couple sitting apart emotional distance therapy room","imageAlt":"Couple assis à distance dans une salle de thérapie, regard absent, tension visible","blocks":[{"id":"paragraph-332","type":"paragraph","content":{"text":"Derrière chaque conflit répétitif de couple se joue une question d'attachement : suis-je en sécurité avec toi ? L'EFT ne traite pas les désaccords de surface — elle réorganise le lien d'attachement lui-même."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-333","type":"callout","content":{"text":"L'EFT est une fusion des thérapies systémiques, de la Gestalt et de la théorie de l'attachement — un modèle validé empiriquement, développé par Susan Johnson à partir des années 1980.","visualRole":"info"},"citationIds":["citation-114"],"validation":{"citationLinks":[{"citationId":"citation-114","claimText":"L'EFT est une fusion des thérapies systémiques, de la Gestalt et de la théorie de l'attachement — un modèle validé empiriquement, développé par Susan Johnson à partir des années 1980.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-334","type":"paragraph","content":{"text":"Sa thèse centrale : les symptômes relationnels (attaque, retrait, escalade) ne sont pas des défauts de caractère, mais des réponses d'attachement désorganisées face à une menace perçue sur le lien."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-102","type":"card","content":{"title":"Le cycle poursuivant-distanceur : anatomie d'une danse","imageRef":"person reaching out while other turns away dark background","imageAlt":"Silhouette d'une personne tendant la main vers une autre qui se détourne","blocks":[{"id":"paragraph-336","type":"paragraph","content":{"text":"La séquence blâmer-protéger-distancer est au coeur de la plupart des crises de couple chroniques. Elle n'est pas le problème — elle est la solution dysfonctionnelle à un problème d'attachement."},"citationIds":[],"validation":{},"deepDiveLinks":[{"text":"blâmer-protéger-distancer","targetId":"m10-deepdive-cycle"}],"_status":"pass"},{"id":"list-337","type":"list","content":{"items":["Le partenaire A exprime une détresse via l'attaque ou la critique (demande d'attachement masquée).","Le partenaire B perçoit un danger et se rétracte pour se protéger (retrait ou déflexion).","Le retrait de B amplifie la détresse de A — la spirale s'emballe."],"ordered":true},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-338","type":"callout","content":{"text":"Ce cycle, et non l'un ou l'autre des partenaires, est l'ennemi commun que l'EFT désigne et traite.","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-103","type":"card","content":{"title":"Les trois phases de l'EFT","imageRef":"three steps pathway upward light clinical setting","imageAlt":"Chemin en trois étapes montant vers la lumière, symbole de progression thérapeutique","blocks":[{"id":"list-340","type":"list","content":{"items":["Phase 1 — Désescalade : identifier et nommer le cycle interactionnel négatif ; créer une alliance de travail autour de ce cycle comme ennemi commun.","Phase 2 — Restructuration des positions : accéder à la vulnérabilité primaire sous-jacente ; favoriser des événements de changement (reaching et responding).","Phase 3 — Consolidation : généraliser les nouvelles réponses à d'autres contextes ; préparer la fin de la thérapie et l'autonomie du couple."],"ordered":true},"citationIds":["citation-115"],"validation":{"citationLinks":[{"citationId":"citation-115","claimText":"Phase 1 — Désescalade : identifier et nommer le cycle interactionnel négatif ; créer une alliance de travail autour de ce cycle comme ennemi commun.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-341","type":"paragraph","content":{"text":"La progression n'est pas linéaire : l'EFT autorise des allers-retours entre phases, notamment en cas de rechute cyclique ou de crise externe."},"citationIds":["citation-115"],"validation":{"citationLinks":[{"citationId":"citation-115","claimText":"La progression n'est pas linéaire : l'EFT autorise des allers-retours entre phases, notamment en cas de rechute cyclique ou de crise externe.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-104","type":"card","content":{"title":"La vulnérabilité primaire : ce qui se cache sous l'attaque","imageRef":"person looking down hands crossed vulnerability close-up","imageAlt":"Personne les mains croisées, regard baissé, exprimant une vulnérabilité intérieure","blocks":[{"id":"paragraph-343","type":"paragraph","content":{"text":"L'émotion de surface — la colère, l'indifférence apparente, le reproche — n'est pas la cible de l'EFT. La cible est la vulnérabilité primaire : la peur d'être abandonné, d'être insuffisant, de ne pas compter pour l'autre."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-344","type":"callout","content":{"text":"La violence émotionnelle — même légère — rend l'expression de cette vulnérabilité non sécuritaire. Le travail d'accès à la vulnérabilité primaire ne peut commencer que dans un espace de sécurité suffisant.","visualRole":"warning"},"citationIds":["citation-116"],"validation":{"citationLinks":[{"citationId":"citation-116","claimText":"La violence émotionnelle — même légère — rend l'expression de cette vulnérabilité non sécuritaire. Le travail d'accès à la vulnérabilité primaire ne peut commencer que dans un espace de sécurité suffi","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-345","type":"paragraph","content":{"text":"La tâche du thérapeute EFT est de ralentir, amplifier et valider ces émotions primaires — et d'aider chaque partenaire à les entendre chez l'autre comme un signal d'attachement, non comme une agression."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-105","type":"card","content":{"title":"Les demandes cachées : déchiffrer ce qui est vraiment dit","imageRef":"couple conversation listening leaning forward empathy","imageAlt":"Deux personnes en conversation, l'une se penche vers l'autre dans une attitude d'écoute attentive","blocks":[{"id":"paragraph-347","type":"paragraph","content":{"text":"Derrière chaque reproche répété se dissimule une demande d'attachement non formulée. L'EFT rend cette demande visible et la reformule dans un registre vulnérable plutôt qu'accusatoire."},"citationIds":["citation-117"],"validation":{"citationLinks":[{"citationId":"citation-117","claimText":"Derrière chaque reproche répété se dissimule une demande d'attachement non formulée. L'EFT rend cette demande visible et la reformule dans un registre vulnérable plutôt qu'accusatoire.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"quote-348","type":"quote","content":{"text":"Est-ce que tu pourrais me dire ce que tu souhaiterais réellement à la place de ce que j'ai fait ?"},"citationIds":["citation-118"],"validation":{"citationLinks":[{"citationId":"citation-118","claimText":"Est-ce que tu pourrais me dire ce que tu souhaiterais réellement à la place de ce que j'ai fait ?","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-349","type":"paragraph","content":{"text":"Formuler la demande cachée de façon concrète, positive et temporellement ancrée — « quand, combien, où » — transforme une plainte diffuse en un appel d'attachement que le partenaire peut entendre et auquel il peut répondre."},"citationIds":["citation-118"],"validation":{"citationLinks":[{"citationId":"citation-118","claimText":"Formuler la demande cachée de façon concrète, positive et temporellement ancrée — « quand, combien, où » — transforme une plainte diffuse en un appel d'attachement que le partenaire peut entendre et a","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-106","type":"card","content":{"title":"Techniques spécifiques de l'EFT","imageRef":"therapist guiding session notes focused clinical work","imageAlt":"Thérapeute prenant des notes en séance, posture concentrée et bienveillante","blocks":[{"id":"list-351","type":"list","content":{"items":["Reflet empathique : valider l'émotion présente sans la corriger ni la minimiser.","Évocation : approfondir et amplifier l'expérience émotionnelle sous-jacente par des images et métaphores.","Reformulation conjunctive : relier l'émotion d'un partenaire au cycle interactionnel — « Quand tu as peur d'être rejeté, tu attaques — et lui se ferme. »","Enactment : inviter les partenaires à s'adresser directement l'un à l'autre à partir de leur vulnérabilité primaire, ici et maintenant.","Tracking : cartographier le cycle séquence par séquence et le rendre visible aux deux partenaires."],"ordered":false},"citationIds":["citation-114"],"validation":{"citationLinks":[{"citationId":"citation-114","claimText":"Les interventions EFT sont organisées autour de cinq mouvements techniques principaux.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-352","type":"callout","content":{"text":"L'enactment est le moment le plus puissant — et le plus risqué. Il ne peut être utilisé qu'une fois la désescalade suffisamment avancée.","visualRole":"warning"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-107","type":"card","content":{"title":"Les moments clés de changement","imageRef":"moment of connection two people eyes meeting breakthrough","imageAlt":"Instant de reconnexion entre deux personnes, regards qui se croisent enfin","blocks":[{"id":"paragraph-354","type":"paragraph","content":{"text":"L'EFT identifie deux événements de changement (change events) spécifiques qui marquent le passage décisif vers un attachement sécure."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"list-355","type":"list","content":{"items":["Reaching event (« s'avancer ») : le partenaire distanceur ou retiré accède à sa vulnérabilité primaire et la partage — il s'avance vers l'autre de façon authentique.","Responding event (« répondre ») : le partenaire poursuivant, qui entend pour la première fois la vulnérabilité de l'autre, répond par une disponibilité et une douceur nouvelles — le cycle s'inverse."],"ordered":true},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-356","type":"callout","content":{"text":"Ces deux moments — souvent intenses, parfois silencieux — sont les marqueurs empiriques du changement en EFT. Leur survenue est prédictive des résultats à long terme.","visualRole":"success"},"citationIds":["citation-119"],"validation":{"citationLinks":[{"citationId":"citation-119","claimText":"Ces deux moments — souvent intenses, parfois silencieux — sont les marqueurs empiriques du changement en EFT. Leur survenue est prédictive des résultats à long terme.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-108","type":"card","content":{"title":"Réconciliation et sécurité gagnée","imageRef":"couple holding hands gently reconciliation warm light","imageAlt":"Mains de deux partenaires se rejoignant doucement dans une lumière chaude","blocks":[{"id":"paragraph-358","type":"paragraph","content":{"text":"La sécurité gagnée n'est pas un retour à un état antérieur — c'est une nouvelle configuration du lien, construite à travers les moments de vulnérabilité partagée et les réponses sensibles."},"citationIds":[],"validation":{},"deepDiveLinks":[{"text":"sécurité gagnée","targetId":"m10-deepdive-earned-security"}],"_status":"pass"},{"id":"paragraph-359","type":"paragraph","content":{"text":"En phase de consolidation, les anciennes dynamiques perdent de leur emprise : elles sont reconnues, nommées, mais ne définissent plus la relation. Les partenaires ont confiance en leur capacité à traverser ensemble les turbulences futures."},"citationIds":["citation-115"],"validation":{"citationLinks":[{"citationId":"citation-115","claimText":"En phase de consolidation, les anciennes dynamiques perdent de leur emprise : elles sont reconnues, nommées, mais ne définissent plus la relation. Les partenaires ont confiance en leur capacité à trav","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-360","type":"callout","content":{"text":"Le thérapeute ne signale pas que le couple aura besoin de revenir pour des problèmes internes — il ouvre la possibilité de séances de rappel en cas de crise externe, marquant ainsi la fin comme une réussite, non un sursis.","visualRole":"info"},"citationIds":["citation-115"],"validation":{"citationLinks":[{"citationId":"citation-115","claimText":"Le thérapeute ne signale pas que le couple aura besoin de revenir pour des problèmes internes — il ouvre la possibilité de séances de rappel en cas de crise externe, marquant ainsi la fin comme une ré","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-109","type":"card","content":{"title":"Indications, contre-indications et prédicteurs de succès","imageRef":"clinical assessment checklist consultation office","imageAlt":"Clinicien consultant une liste d'évaluation lors d'un entretien de bilan","blocks":[{"id":"list-362","type":"list","content":{"items":["Détresse conjugale modérée à sévère avec cycle interactionnel identifiable.","Motivation des deux partenaires à rester dans la relation.","Capacité minimale à tolérer l'affect en séance."],"ordered":false},"citationIds":["citation-116"],"validation":{"citationLinks":[{"citationId":"citation-116","claimText":"Indications prioritaires.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-363","type":"list","content":{"items":["Violence physique active ou menace de sécurité immédiate.","Violence émotionnelle sévère rendant l'expression de vulnérabilité impossible.","Infidélité non résolue ou séparation déjà décidée : l'objectif de sécurité d'attachement devient inatteignable."],"ordered":false},"citationIds":["citation-116","citation-115"],"validation":{"citationLinks":[{"citationId":"citation-116","claimText":"Contre-indications formelles.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-115","claimText":"Contre-indications formelles.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-364","type":"callout","content":{"text":"Le prédicteur de succès le plus robuste : la confiance initiale de la femme en la réactivité émotionnelle de son partenaire, même faible — elle mesure l'existence d'une base d'attachement sur laquelle l'EFT peut travailler.","visualRole":"info"},"citationIds":["citation-116"],"validation":{"citationLinks":[{"citationId":"citation-116","claimText":"Le prédicteur de succès le plus robuste : la confiance initiale de la femme en la réactivité émotionnelle de son partenaire, même faible — elle mesure l'existence d'une base d'attachement sur laquelle","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-110","type":"card","content":{"title":"Ce que l'EFT change — et ce qu'elle ne fait pas","imageRef":"open door light horizon hopeful landscape","imageAlt":"Porte ouverte sur un horizon lumineux, métaphore d'un chemin vers un avenir possible","blocks":[{"id":"paragraph-366","type":"paragraph","content":{"text":"L'EFT ne résout pas les désaccords de fond — elle modifie la façon dont les partenaires se trouvent l'un face à l'autre lorsqu'un désaccord surgit. C'est cette modification du contexte émotionnel qui rend les solutions possibles."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-367","type":"callout","content":{"text":"L'objectif ultime : promouvoir une dynamique interrelationnelle renouvelée, caractérisée par un attachement sécurisant, chez des partenaires qui désirent le mieux-être de leur relation.","visualRole":"success"},"citationIds":["citation-116"],"validation":{"citationLinks":[{"citationId":"citation-116","claimText":"L'objectif ultime : promouvoir une dynamique interrelationnelle renouvelée, caractérisée par un attachement sécurisant, chez des partenaires qui désirent le mieux-être de leur relation.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-368","type":"paragraph","content":{"text":"En somme : l'EFT ne répare pas un couple cassé. Elle réapprend à deux personnes à se constituer comme base sécure l'une pour l'autre — ce que ni l'une ni l'autre n'a peut-être jamais pleinement connu."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-111","type":"card","content":{"title":"Interventions psycho-éducatives et restructuration cognitive","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-369","type":"paragraph","content":{"text":"Notions clés : Psychoéducation sur l'attachement, Schemas relationnels, Communication non-violente, Résolution de conflits, Outils de régulation émotionnelle, Prévention de rechute."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-112","type":"card","content":{"title":"La psychoéducation : pr
