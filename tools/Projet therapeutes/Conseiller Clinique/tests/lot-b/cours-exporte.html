"entry-303","displayLabel":"Serge Hefez, La danse du couple"},{"citationId":"citation-131","sourceSnapshotEntryId":"entry-296","displayLabel":"Joanna Smith, La puissance reparatrice de votre cerveau"},{"citationId":"citation-132","sourceSnapshotEntryId":"entry-293","displayLabel":"ses racines historiques et, p. 43"},{"citationId":"citation-133","sourceSnapshotEntryId":"entry-319","displayLabel":"Harville Hendrix, De la solitude au couple"},{"citationId":"citation-134","sourceSnapshotEntryId":"entry-324","displayLabel":"OLIVIER PIEDFORT-MARIN LUISE REDDEMANN, Psychotherapie des traumas complexes"},{"citationId":"citation-135","sourceSnapshotEntryId":"entry-334","displayLabel":"Anderson, Developper ses competences en IFS"},{"citationId":"citation-136","sourceSnapshotEntryId":"entry-322","displayLabel":"Unknown, Applications cliniques en ICV"},{"citationId":"citation-137","sourceSnapshotEntryId":"entry-331","displayLabel":"Bessel van der Kolk, Bessel van der Kolk - Le corps n'oublie rien"},{"citationId":"citation-138","sourceSnapshotEntryId":"entry-335","displayLabel":"Bowlby, Amour et rupture, les destins d - Bowlby, John"},{"citationId":"citation-139","sourceSnapshotEntryId":"entry-346","displayLabel":"Suares Ducos, Le vécu du deuil chez le jeune enfant entre 2 et 5 ans après le décès d’un parent du cancer. Études de la régulation émotionnelle, de l’attachement et du fonctionnement familial chez de jeunes adultes endeuillés dans leur petite enfance et de jeunes enfants accompagnés dans un dispositif thérapeutique groupal en oncologie"},{"citationId":"citation-140","sourceSnapshotEntryId":"entry-336","displayLabel":"Marie Andersen, L_Emprise-familiale-Marie-Andersen"},{"citationId":"citation-141","sourceSnapshotEntryId":"entry-321","displayLabel":"john wright, p. 190"},{"citationId":"citation-142","sourceSnapshotEntryId":"entry-325","displayLabel":"OLIVIER PIEDFORT-MARIN LUISE REDDEMANN, Psychotherapie des traumas complexes"},{"citationId":"citation-143","sourceSnapshotEntryId":"entry-333","displayLabel":"Faure, Le couple brisé"},{"citationId":"citation-144","sourceSnapshotEntryId":"entry-338","displayLabel":"Sophie Fierdepied, Mode relationnel, addictions et précarité sociale"},{"citationId":"citation-145","sourceSnapshotEntryId":"entry-332","displayLabel":"Lifespan Integration  Intégration du, 20210829_Manuel_N3_PRS_LM -1-"}],"validation":{"sourceIntegrity":"pending","contentCompleteness":"pending","layout":"pending","accessibility":"pending","humanClinicalReview":"required"},"deepDives":[{"id":"m1-deepdive-systeme-comportemental","title":"Le système comportemental d'attachement : architecture fonctionnelle","paragraphs":["Bowlby conceptualise l'attachement comme un système comportemental au sens cybernétique du terme : un ensemble de comportements organisés autour d'un objectif régulateur — maintenir la proximité avec la figure d'attachement, surtout en cas de menace perçue. Ce système s'active et se désactive selon l'évaluation que le sujet fait de la disponibilité de sa figure d'attachement et du niveau de danger de la situation.","Le système d'attachement est en équilibre dynamique avec d'autres systèmes comportementaux — notamment le système d'exploration (qui pousse à la découverte et à l'autonomie) et le système de caregiving (qui oriente vers le soin de l'autre). Quand le système d'attachement est activé par une menace, le système d'exploration se met en retrait : un enfant anxieux n'explore pas. C'est pourquoi la base de sécurité fournie par la figure d'attachement est une condition préalable au développement cognitif, à la créativité et à la prise de risque adaptative.","Ce modèle systémique est fondamental pour la clinique du couple : un partenaire dont le système d'attachement est chroniquement activé (par insécurité relationnelle, conflits répétés, menaces de séparation) n'est pas en mesure de s'engager pleinement dans les activités d'exploration commune — projets partagés, intimité sexuelle, croissance mutuelle. La réduction de la détresse d'attachement est donc une condition, et non un objectif secondaire, de toute thérapie de couple fondée sur l'attachement."]},{"id":"m1-deepdive-neurobio-attachement","title":"Neurobiologie de l'attachement : ce que le corps enregistre","paragraphs":["La co-régulation émotionnelle entre le nourrisson et sa figure d'attachement n'est pas qu'une métaphore relationnelle : elle est un processus neurobiologique précis. Les interactions synchronisées — regard, voix, toucher, accordage affectif — activent le système nerveux autonome du nourrisson et modulent la libération d'ocytocine, de cortisol et de dopamine. C'est à travers la répétition de ces séquences que le cerveau limbique se structure.","Winnicott, contemporain de Bowlby, insistait sur la dimension corporelle de ces premières interactions : la façon dont une mère tient son bébé détermine la manière dont celui-ci expérimentera son corps comme le lieu où vit la psyché. L'accordage physique précède et fonde l'accordage affectif. Les traces de ces expériences s'inscrivent en mémoire implicite — elles ne se souviennent pas, elles se répètent.","En clinique, cela signifie que les réactions d'attachement insécures dans le couple — hypervigilance à l'abandon, gel émotionnel devant l'intimité — ne sont pas des croyances irrationnelles accessibles par le seul raisonnement. Ce sont des états somatiques, des régulations automatiques du système nerveux. Toute intervention qui ne prend pas en compte cette dimension corporelle et procédurale travaille en surface."]},{"id":"m2-deepdive-bartholomew","title":"Le modèle de Bartholomew en détail : dimensions, scores et RSQ","paragraphs":["Kim Bartholomew (1990), puis Griffin et Bartholomew (1994), proposent une reformulation dimensionnelle de la théorie de l'attachement adulte en s'appuyant sur deux variables latentes continues. La première dimension — l'anxiété — reflète le modèle interne de soi : une image de soi négative correspond à une forte anxiété d'abandon, une image de soi positive à une faible anxiété. La seconde dimension — l'évitement — reflète le modèle interne d'autrui : une image d'autrui positive correspond à une faible évitement, une image d'autrui négative à un fort évitement.","Le Relationship Scales Questionnaire (RSQ), autoquestionnaire de 30 items, opérationnalise ce modèle en attribuant à chaque répondant un score sur chacune des quatre échelles correspondant aux quatre prototypes. Un score n'est pas une appartenance exclusive : un sujet peut scorer modérément sur deux prototypes adjacents, ce qui est fréquent et cliniquement significatif. C'est précisément cet avantage sur les approches purement catégorielles que valorise la recherche contemporaine.","La validation transculturelle du RSQ en français (Kpelly et al., 2020) confirme la structure factorielle du modèle dans un contexte francophone, tout en soulignant que les seuils de coupure doivent être adaptés à la population locale. Les scores bruts obtenus dans une population nord-américaine ne sont pas directement transposables sans étalonnage.","Sur le plan clinique, les deux dimensions permettent un suivi longitudinal : une thérapie orientée attachement peut réduire le score d'évitement ou d'anxiété de façon mesurable, même sans changement de la catégorie principale. Ce suivi quantitatif est l'un des arguments les plus solides en faveur de l'approche dimensionnelle en contexte de recherche clinique."]},{"id":"m3-deepdive-mio-origine","title":"Comment se forme un modèle interne opérant : de l'interaction à la structure","paragraphs":["Un MIO ne se construit pas à partir d'un événement isolé mais à partir du pattern répété des interactions avec les figures d'attachement. C'est la prévisibilité — ou son absence — qui forge le modèle. Si la figure d'attachement répond de manière sensible et cohérente, l'enfant intègre une représentation de lui-même comme digne d'attention et une représentation d'autrui comme fiable. Si les réponses sont incohérentes, punitives ou absentes, le modèle se construit autour de l'incertitude, de la méfiance ou du repli.","Cette construction est d'abord somatique et procédurale : elle précède le langage. C'est pourquoi les MIO résistent à la simple verbalisation : ils sont encodés dans des circuits qui ne passent pas par le cortex préfrontal narratif. Le travail clinique doit donc toucher ces niveaux d'encodage — par l'expérience relationnelle, l'activation émotionnelle et la mise en sens — plutôt que se limiter à l'interprétation discursive.","La notion de modèle opérant interne est intimement liée à celle de schéma précoce inadapté dans la thérapie des schémas de Young : les deux construits partagent l'idée que des conclusions durables sur soi et sur le monde se déposent précocement et orientent ensuite toute expérience nouvelle. La différence est surtout de niveau d'analyse : le MIO est un concept issu de la théorie de l'attachement (Bowlby, Ainsworth), le schéma est un construit cognitivo-émotionnel cliniquement opérationnalisé."]},{"id":"m3-deepdive-memoire-implicite","title":"Mémoire implicite et traces relationnelles : ce que le cerveau retient sans le dire","paragraphs":["La mémoire implicite désigne l'ensemble des traces mnésiques qui influencent le comportement sans être accessibles à la remémoration consciente. Elle inclut la mémoire procédurale (savoir-faire), la mémoire conditionnée (associations émotionnelles) et la mémoire primée (activation de schémas de reconnaissance). Dans le contexte de l'attachement, ce sont les patterns relationnels précoces qui s'y inscrivent.","Ces traces se forment dès les premiers mois de vie, bien avant que le langage ou la mémoire épisodique ne soient fonctionnels. Elles ne peuvent donc pas être « rappelées » : elles se manifestent comme des réactions, des tonalités émotionnelles, des anticipations automatiques en situation relationnelle. Un patient qui réagit avec une panique disproportionnée à l'absence de réponse de son partenaire ne se « souvient » pas d'un abandon infantile : il en reproduit le pattern affectif inscrit dans sa mémoire implicite.","Sur le plan neurobiologique, la reconsolidation mémorielle (Ecker, 2018 ; travaux sur le cortex péri-rhinal) ouvre une perspective fondamentale : lors de la réactivation d'une trace mnésique implicite dans un contexte émotionnel sécure et différent, cette trace devient labiale — c'est-à-dire susceptible d'être modifiée avant d'être reconsolidée. C'est la base neurologique du changement thérapeutique profond, au-delà de la simple régulation comportementale de surface."]},{"id":"m4-deepdive-aai","title":"L'AAI en pratique : passation, cotation et limites","paragraphs":["L'Adult Attachment Interview (AAI) a été développé par Mary Main et Ruth Goldwyn à Berkeley dans les années 1980. Il s'agit d'un entretien semi-structuré d'environ 60 à 90 minutes, conduit par un clinicien formé, durant lequel le sujet est invité à décrire sa relation avec chacun de ses parents ou figures de soins principales au cours de l'enfance. L'entretien comprend une vingtaine de questions standardisées portant sur les premières expériences de soin, les séparations, les rejets, les menaces, les pertes et les abus.","La cotation de l'AAI est un processus spécialisé qui requiert une formation approfondie : elle n'évalue pas la sévérité des expériences rapportées, mais la manière dont le sujet en parle. On analyse la qualité des maximes de Grice — quantité, qualité, pertinence et manière — appliquées au discours. Un adulte sécure produit un récit crédible, cohérent, qui intègre des expériences négatives sans être submergé ou au contraire dans le déni. Un adulte détaché produit un discours court, idéalisant ou minimisant, souvent contredit par les exemples qu'il donne lui-même. Un adulte préoccupé produit un discours long, enchevêtré, encore émotionnellement capté par le passé.","La principale limite de l'AAI en pratique clinique est son coût de formation et de cotation : la certification est longue, l'entretien doit être enregistré et retranscrit, et la cotation prend plusieurs heures. Des versions abrégées ou des entretiens inspirés de l'AAI (comme le Current Relationship Interview, CRI) permettent une utilisation clinique plus accessible, tout en conservant la logique narrative centrale. Il est également important de rappeler que l'AAI évalue les représentations de l'attachement — pas les comportements effectifs dans la relation — et doit donc être articulé à d'autres sources de données pour une formulation complète."]},{"id":"m4-deepdive-dyades","title":"Combinaisons dyadiques et dynamiques cliniques en couple","paragraphs":["La rencontre de deux styles d'attachement dans un couple ne produit pas une simple moyenne : elle génère une dynamique relationnelle propre, souvent organisée autour d'un cycle récurrent que les thérapeutes systémiciens et les praticiens EFT ont largement documenté. Comprendre ces combinaisons est essentiel pour orienter l'évaluation et ne pas réduire la souffrance du couple à la pathologie de l'un ou de l'autre.","La dyade la plus fréquemment rencontrée en clinique est la dyade préoccupé / détaché-évitant. Le partenaire préoccupé — anxiété élevée, évitement faible — cherche intensément la proximité et l'assurance que le lien est solide. Le partenaire détaché — anxiété faible, évitement élevé — perçoit cette demande comme une menace à son autonomie et se retire. Le retrait renforce l'anxiété du premier, qui intensifie ses demandes, ce qui accentue le retrait du second : c'est la boucle poursuite-retrait, nommée aussi cycle de la demande-distance.","La dyade craintif / craintif — deux partenaires à anxiété et évitement élevés — est cliniquement plus complexe : chacun désire l'intimité mais la redoute simultanément. Les relations sont souvent chaotiques, marquées par des cycles rapprochement-distance intenses, des ruptures et des réconciliations répétées. Cette configuration est fréquemment associée à des histoires traumatiques chez l'un ou les deux partenaires.","La dyade sécure / insécure est souvent sous-estimée : le partenaire sécure peut — à court terme — offrir une base de régulation à son partenaire insécure. Mais sans travail thérapeutique, ce rôle devient épuisant et asymétrique, risquant de générer à son tour du ressentiment et du retrait. L'évaluation doit donc identifier non seulement les profils, mais aussi la manière dont la dyade a organisé ses rôles compensatoires au fil du temps."]},{"id":"m5-deepdive-transmission","title":"Psychogénéalogie et transmission inconsciente : ce que la clinique observe","paragraphs":["La notion de transmission intergénérationnelle inconsciente a été formalisée notamment par Anne Ancelin Schützenberger, qui a montré comment des événements non élaborés — morts prématurées, traumatismes collectifs, secrets de famille — peuvent se rejouer dans les générations suivantes sous la forme de symptômes, de comportements répétitifs ou de choix de vie apparemment inexplicables. Ce champ, désigné sous le terme de psychogénéalogie, reste l'objet d'un débat méthodologique ouvert entre la clinique et la recherche académique.","La distinction essentielle pour le clinicien est celle entre transmission directe (modelage comportemental observé, discours explicites sur la famille, pratiques éducatives) et transmission indirecte (affects non nommés, silences, loyautés invisibles envers des membres de la famille décédés ou absents). La seconde forme est souvent la plus puissante car elle échappe à la conscience réflexive du sujet.","En pratique clinique, l'exploration de ces transmissions passe par le récit biographique, le génogramme et, parfois, la remobilisation de témoins de la famille d'origine en séance — technique proposée notamment par Andolfi, qui permet à chaque partenaire d'acquérir une plus grande conscience des frontières individuelles, de couple et intergénérationnelles."]},{"id":"m5-deepdive-resilience","title":"Figures d'attachement alternatives et résilience : au-delà de la famille d'origine","paragraphs":["La résilience, au sens clinique, n'est pas une propriété fixe de l'individu mais un processus dynamique qui se construit dans la relation. Les recherches sur les enfants placés ou issus de milieux à haut risque montrent de façon convergente qu'une figure d'attachement alternative — qu'il s'agisse d'un membre élargi de la famille, d'un enseignant, d'un éducateur ou d'un thérapeute — peut jouer un rôle structurant comparable à celui d'une figure parentale sécurisante.","La notion de 'tuteur de résilience' (Cyrulnik) désigne précisément cet adulte tiers qui offre, dans un moment critique du développement, une expérience relationnelle suffisamment cohérente et bienveillante pour permettre à l'enfant de construire un modèle interne alternatif. L'assistant familial, par exemple, peut occuper cette fonction à condition que la relation soit suffisamment stable et que l'institution soutienne ce lien — ce qui n'est pas toujours le cas dans les dispositifs de protection de l'enfance.","Pour l'adulte engagé dans une thérapie de couple, la relation thérapeutique elle-même peut constituer une expérience corrective d'attachement sécure. Ce n'est pas un effet secondaire de la thérapie : c'est, dans certains modèles, son levier principal. La capacité à développer une cohérence narrative sur sa propre histoire — l'une des mesures clés de l'Adult Attachment Interview — est fortement corrélée à la capacité de fournir à ses propres enfants un attachement sécurisé, indépendamment du style d'attachement vécu dans l'enfance."]},{"id":"m6-deepdive-boucle","title":"La mécanique des boucles négatives : amplification et homéostasie dysfonctionnelle","paragraphs":["Une boucle relationnelle négative fonctionne selon le principe systémique de la causalité circulaire : il n'y a pas de cause première, seulement des actions qui se répondent et se renforcent mutuellement. Chercher « qui a commencé » est non seulement inutile cliniquement, c'est activement contre-thérapeutique — cela renforce la logique de blâme qui alimente la boucle.","Le paradoxe central est celui de l'homéostasie dysfonctionnelle : le système couple maintient son organisation même quand cette organisation est douloureuse. Chaque tentative de changement unilatéral (un partenaire décide de ne plus critiquer, ou de ne plus se retirer) échoue parce que le système exerce une pression de rappel vers l'équilibre antérieur. Ce n'est pas de la mauvaise volonté — c'est de la physique relationnelle.","D'un point de vue clinique, cela explique pourquoi la simple psychoéducation ou la liste de conseils comportementaux ne suffit pas. Le pattern ne change pas parce qu'on en comprend le mécanisme — il change quand l'expérience émotionnelle sous-jacente, qui l'alimente, est suffisamment modifiée pour que la réponse habituelle devienne moins nécessaire. C'est précisément l'enjeu des approches fondées sur l'attachement et des thérapies centrées sur l'émotion."]},{"id":"m7-deepdive-anxieux-depression","title":"Anxiété relationnelle, régulation émotionnelle et vulnérabilité dépressive","paragraphs":["Les travaux de Reynaud (2011) montrent que l'attachement insécure adulte — en particulier le style anxieux — constitue un facteur de vulnérabilité spécifique à la dépression chez la femme, opérant via deux vecteurs complémentaires : la perturbation des stratégies de régulation émotionnelle et l'insécurité des représentations des liens d'attachement passés et actuels. Ce double mécanisme explique pourquoi la dépression d'un partenaire anxieux résiste souvent aux traitements centrés sur les symptômes seuls.","Henschel (2020) précise que les styles insécures sont associés à des profils distincts de régulation émotionnelle et d'empathie, avec des trajectoires développementales différenciées selon le style. Le style anxieux est caractérisé par une hyperactivation émotionnelle : les émotions négatives sont amplifiées, les ressources cognitives mobilisées pour la surveillance relationnelle réduisent la capacité à réguler ces états, créant une vulnérabilité chronique aux états dépressifs et anxieux. Le style évitant, à l'inverse, présente une désactivation qui masque la détresse mais ne la supprime pas — elle ressurgit sous forme somatique ou dépressive quand les défenses s'épuisent.","Sur le plan clinique, l'évaluation de l'attachement adulte devrait systématiquement faire partie du bilan lors d'une présentation dépressive, en particulier lorsque la dépression est récurrente ou résistante. Les styles d'attachement évoluent d'ailleurs significativement au cours d'une hospitalisation pour dépression, ce qui suggère que le traitement de la dépression et le remaniement des représentations d'attachement sont des processus mutuellement influents (Reynaud et al., 2012)."]},{"id":"m7-deepdive-poursuite-retrait","title":"La spirale poursuite-retrait : mécanique d'un cercle vicieux","paragraphs":["La spirale poursuite-retrait est le pattern relationnel le plus fréquemment observé dans les couples en souffrance d'attachement. Sa logique est simple et impitoyable : plus le partenaire anxieux ressent une menace sur le lien (distance perçue, silence, désengagement), plus il intensifie ses comportements de réassurance — demandes, protestations, reproche. Plus le partenaire évitant perçoit cette pression comme une menace à son autonomie ou à son intégrité, plus il se ferme ou se retire. Ce retrait est alors interprété par le partenaire anxieux comme une confirmation de son pire scénario, ce qui amplifie encore ses demandes. Le cycle est auto-entretenu.","Ce qui rend ce pattern particulièrement tenace, c'est que chaque partenaire réagit logiquement depuis sa propre économie d'attachement : l'anxieux fait ce qu'il a toujours fait pour survivre à la menace d'abandon, l'évitant fait ce qu'il a toujours fait pour survivre à la menace d'engloutissement. Aucun des deux n'est pathologique en soi — c'est l'interaction qui devient dysfonctionnelle. Neuburger parle de 'jeu circulaire' dont il serait contre-productif de chercher à sortir par une simple injonction comportementale adressée à l'un des deux : le blocage est systémique.","L'impuissance partagée qui s'installe — chacun se sentant incompris, injustement traité, et incapable de changer quoi que ce soit — est précisément ce qui conduit à la distance émotionnelle progressive, puis au burnout relationnel. L'intervention clinique doit viser à rendre ce mécanisme visible pour les deux partenaires simultanément, de sorte qu'ils puissent commencer à s'allier contre le pattern plutôt que de continuer à se battre l'un contre l'autre."]},{"id":"m8-deepdive-egosyntonie","title":"L'égo-syntonicité : pourquoi le trouble de la personnalité ne se vit pas comme un problème","paragraphs":["L'égo-syntonicité désigne le fait que les symptômes, croyances et comportements pathologiques sont vécus par le patient comme cohérents avec son identité — comme des « faits sur lui-même » plutôt que comme des dysfonctionnements. Ce phénomène est central dans les troubles de la personnalité et constitue l'un des obstacles thérapeutiques les plus difficiles à surmonter.","Dans la thérapie des schémas, Pascal Bernard souligne que les patients concernés « s'accrochent de façon rigide et parfois agressive à ce qu'ils ont toujours considéré comme des vérités absolues ». Modifier leurs schémas revient, pour eux, à perdre une partie d'eux-mêmes — d'où la résistance particulière à la psychoéducation et au recadrage cognitif standard.","Cette dimension contraste directement avec l'égo-dystonicité observée dans les styles d'attachement insécure sans trouble de personnalité : le patient insécure souffre de ses patterns, les reconnaît souvent comme problématiques et peut exprimer une motivation au changement. Ce contraste a des implications majeures pour la construction de l'alliance thérapeutique et pour le choix des techniques d'intervention."]},{"id":"m8-deepdive-tpl-patterns","title":"Patterns interpersonnels dans le trouble borderline : ce que la recherche montre","paragraphs":["La notion de pattern interpersonnel pervasif — telle qu'elle est opérationnalisée par la méthode du Core Conflictual Relationship Theme (CCRT) — désigne la tendance du patient à reproduire le même scénario relationnel (désir, réponse de l'autre, réponse de soi) dans la quasi-totalité de ses liens significatifs. Dans le trouble de la personnalité borderline, ces patterns sont particulièrement rigides et envahissants.","Une étude randomisée contrôlée (Kramer et al., 2021) a montré que la diminution de la pervasivité de ces patterns interpersonnels est le médiateur central de l'amélioration symptomatique après traitement. Autrement dit, ce n'est pas tant la réduction directe des symptômes (impulsivité, humeur labile) qui explique le changement, mais la flexibilisation progressive des scénarios relationnels répétitifs.","Cette donnée a une conséquence directe pour la pratique en couple : travailler uniquement sur la communication ou la gestion des conflits sans cibler les patterns sous-jacents risque de produire des gains superficiels et peu durables. La thérapie doit nommer, relier et assouplir ces scénarios — ce qui requiert du temps, de la répétition et une relation thérapeutique suffisamment stable pour servir elle-même de contre-exemple."]},{"id":"m9-deepdive-base-securite","title":"La base de sécurité en psychothérapie : de Bowlby au cabinet clinique","paragraphs":["Bowlby a introduit le concept de base de sécurité pour décrire la fonction de la figure d'attachement : un havre de protection depuis lequel l'enfant peut explorer le monde, avec la certitude d'un retour possible en cas de danger. Ce n'est pas une présence fusionnelle — c'est une présence fiable et prévisible.","Transposé en psychothérapie, ce concept désigne la capacité du thérapeute à offrir un espace où l'exploration émotionnelle devient possible parce qu'elle est sécurisée. La recherche de Djillali, Plantade-Gipch et de Roten (2024) montre que cette capacité varie significativement selon les cliniciens, en fonction de l'âge et des attitudes épistémiques face à la psychothérapie — ce qui confirme qu'elle se travaille activement.","En thérapie de couple, la base de sécurité a une dimension supplémentaire : le thérapeute ne doit pas seulement être sécurisant pour chacun des partenaires, mais il doit également accompagner la construction progressive d'une base de sécurité mutuelle entre eux. C'est là l'objectif à long terme : que le couple devienne son propre système de régulation, moins dépendant de la présence du thérapeute.","Il est crucial de distinguer la base de sécurité de la neutralité bienveillante classique. La neutralité peut être vécue comme de l'indifférence par un patient à l'attachement anxieux, ou comme de la distance froide par un patient évitant en crise. La base de sécurité implique une présence affective modulée — ni envahissante, ni absente."]},{"id":"m9-deepdive-rupture-reparation","title":"Ruptures et réparations de l'alliance : la mécanique du changement","paragraphs":["Les ruptures d'alliance thérapeutique se définissent comme des tensions ou des dégradations dans la qualité du lien de collaboration entre thérapeute et patient. Elles peuvent être de type confrontation — le patient exprime ouvertement sa frustration ou son désaccord — ou de type retrait — le patient se désengage émotionnellement, répond en surface, évite les sujets chauds.","Du point de vue de l'attachement, les ruptures sont des moments d'activation du système d'attachement en direction du thérapeute lui-même. La réponse du thérapeute à ce moment devient une donnée clinique centrale : va-t-il se défendre, minimiser, contre-attaquer, ou rester disponible et engager une réparation ?","La réparation n'implique pas que le thérapeute ait eu tort. Elle implique qu'il reconnaisse l'impact de ce qui s'est passé sur le patient, qu'il reste dans le lien malgré la tension, et qu'il offre une réponse différente de ce que le patient anticipe depuis ses modèles internes. Pour un patient dont l'histoire est jalonnée de ruptures sans réparation, ce moment peut constituer une expérience émotionnelle correctrice fondamentale.","Sur le plan technique, la réparation commence par une nomination non défensive de la rupture, se poursuit par une exploration de l'expérience du patient, et se clôt par un réajustement de la posture ou du contrat thérapeutique si nécessaire. La rapidité de la réparation importe moins que sa qualité — une réparation superficielle est pire qu'une rupture non nommée."]},{"id":"m10-deepdive-cycle","title":"Le cycle blâmer-protéger-distancer : anatomie et logique d'attachement","paragraphs":["Le cycle blâmer-protéger-distancer est la séquence interactionnelle la plus fréquemment rencontrée en thérapie de couple. Il se structure autour d'une asymétrie de régulation émotionnelle : l'un des partenaires hyperactive sa stratégie d'attachement (cri, reproche, attaque) tandis que l'autre la désactive (silence, retrait, déflexion). Ces deux pôles se coactivent mutuellement dans une spirale auto-renforcée.","Ce que l'EFT met en évidence, c'est que les deux positions — aussi irritantes qu'elles paraissent à l'autre — sont des tentatives de gestion de la même peur : perdre le lien, ne pas compter, être seul avec sa détresse. Le poursuivant hurle parce qu'il a peur d'être abandonné. Le distanceur se ferme parce qu'il a peur d'être submergé, inadéquat, ou de blesser davantage.","Identifier ce cycle nommément — lui donner un titre commun — est l'un des actes thérapeutiques les plus puissants de la phase 1. Quand les partenaires passent de 'c'est lui le problème' à 'c'est ce cycle notre problème', la coalescence thérapeutique devient possible. L'ennemi cesse d'être dans la pièce.","Cette reformulation systémique de la souffrance individuelle est l'une des contributions distinctives de l'EFT par rapport aux approches purement cognitivo-comportementales de la thérapie de couple, qui travaillent davantage les contenus du conflit que la structure émotionnelle qui le génère."]},{"id":"m10-deepdive-earned-security","title":"La sécurité gagnée : un attachement construit, pas retrouvé","paragraphs":["La notion de 'sécurité gagnée' (earned security) désigne un état d'attachement sécure acquis à l'âge adulte, en dépit d'une histoire développementale marquée par des expériences d'attachement insécure ou traumatique. En EFT, ce concept prend une dimension relationnelle : la sécurité ne se reconstruit pas seulement de façon individuelle, mais dans et par la relation de couple elle-même.","Ce qui est 'gagné', c'est la capacité à se montrer vulnérable et à recevoir une réponse sensible — répétée suffisamment pour modifier les modèles internes opérants. Chaque moment de reaching et de responding réussi en séance est un dépôt dans ce compte d'expériences sécurisantes. La répétition crée la réorganisation.","La sécurité gagnée en couple se distingue de la sécurité d'attachement primaire par sa fragilité potentielle face aux crises externes. C'est pourquoi l'EFT ne clôture pas la thérapie en prétendant que le couple est 'guéri', mais en lui donnant les outils pour reconnaître et nommer le cycle dès qu'il réapparaît — et pour sortir du cycle par leurs propres moyens, sans avoir besoin du thérapeute comme tiers régulateur."]},{"id":"m11-deepdive-memoire-procedurale","title":"Mémoire procédurale et schèmes d'attachement : pourquoi le corps sait avant le cortex","paragraphs":["La mémoire procédurale est un système de mémoire implicite qui encode les savoir-faire automatiques — conduire, nager, mais aussi : comment se comporter lorsqu'une figure d'attachement s'approche ou s'éloigne. Elle est opérationnelle dès les premiers mois de vie, bien avant l'acquisition du langage, et ses encodages sont parmi les plus stables que le système nerveux produit.","En thérapie de couple, cela a une conséquence directe : le partenaire anxieux qui se crispe quand l'autre arrive en retard ne 'décide' pas de se crisper. Son système nerveux exécute un programme appris dans la petite enfance, réactivé par le déclencheur présent. La pensée consciente arrive après coup — pour justifier, pas pour initier.","C'est pourquoi la psychoéducation seule ne suffit pas : comprendre un pattern n'efface pas son inscription procédurale. La modification durable nécessite des expériences correctives répétées, en séance et hors séance, qui réécrivent progressivement le programme — non par la conviction intellectuelle, mais par la répétition d'un vécu relationnel différent. C'est ce que Bruce Ecker nomme la reconsolidation mémorielle : une expérience qui viole la prédiction du schème ancien, suffisamment répétée pour en déstabiliser l'encodage."]},{"id":"m12-deepdive-deuil-complexe","title":"Deuil compliqué et dépression : frontière clinique","paragraphs":["Le deuil et la dépression partagent une phénoménologie proche — humeur basse, retrait social, anhédonie, troubles du sommeil — ce qui rend le diagnostic différentiel cliniquement délicat. La distinction fondamentale tient moins aux symptômes qu'à leur dynamique : dans le deuil non compliqué, les affects oscillent, des moments de répit existent, et le lien à l'objet perdu reste conscient. Dans le deuil compliqué ou prolongé, la personne est comme enkystée dans une temporalité figée, incapable d'intégrer la perte dans une continuité narrative de soi.","La recherche sur le deuil précoce (perte d'un parent entre 2 et 5 ans) montre que les traces portées à l'âge adulte concernent spécifiquement la régulation émotionnelle et les stratégies d'attachement — non les souvenirs explicites de la perte, que l'enfant n'a souvent pas. Ce sont des cicatrices implicites, visibles dans la façon dont l'adulte gère la séparation, la proximité, et la peur de la perte dans sa vie de couple.","Dans le travail clinique avec un couple dont l'un des membres traverse un deuil prolongé, l'enjeu est double : accompagner le processus individuel de transformation du lien à l'objet perdu, et simultanément soutenir le partenaire qui supporte la charge relationnelle de cette période sans toujours être reconnu comme lui-même affecté."]},{"id":"m12-deepdive-trahison-trauma","title":"Trahison comme trauma d'attachement : ce que la neurobiologie éclaire","paragraphs":["La découverte d'une infidélité produit un tableau neurobiologique proche de celui d'un événement traumatique soudain : activation intense du système de menace, effondrement de la cohérence du modèle interne opérant, et hyperactivation de la surveillance relationnelle. Le partenaire trahi scrute désormais chaque signal — regard, délai de réponse, inflexion de voix — à la recherche de la menace qu'il n'avait pas su détecter la première fois.","Cette hypervigilance est fonctionnelle dans un contexte de danger réel ; elle devient destructrice quand elle persiste dans un contexte de reconstruction, transformant chaque moment de normalité en occasion de doute. Le thérapeute doit nommer ce mécanisme explicitement pour que le couple comprenne que la défiance n'est pas un manque de volonté de guérir, mais la trace neurologique d'un système d'attachement mis en alerte.","Le travail de reconstruction ne commence véritablement qu'après que le partenaire responsable de la trahison a cessé de se défendre pour commencer à se montrer — c'est-à-dire à rendre visible sa propre vulnérabilité dans le lien. Sans cette étape, aucune réassurance verbale ne peut atteindre le niveau émotionnel où la blessure réside."]}],"modules":[{"id":"m1","title":"Fondements de la théorie de l'attachement adulte","cardId":"card-01"},{"id":"m2","title":"Styles d'attachement : modèles dimensionnels et catégoriques","cardId":"card-12"},{"id":"m3","title":"Représentations mentales et modèles internes opérants","cardId":"card-23"},{"id":"m4","title":"Évaluation clinique des styles d'attachement adulte","cardId":"card-34"},{"id":"m5","title":"Transmission intergénérationnelle et histoire développementale","cardId":"card-45"},{"id":"m6","title":"Dynamiques dysfonctionnelles dans le couple : patterns critiques","cardId":"card-56"},{"id":"m7","title":"Conséquences cliniques des attachements insécures en couple","cardId":"card-67"},{"id":"m8","title":"Diagnostic différentiel : attachement insécure vs troubles personnalité","cardId":"card-78"},{"id":"m9","title":"Principes d'intervention fondés sur l'attachement","cardId":"card-89"},{"id":"m10","title":"Thérapie émotionnelle focalisée (EFT) pour le couple","cardId":"card-100"},{"id":"m11","title":"Interventions psycho-éducatives et restructuration cognitive","cardId":"card-111"},{"id":"m12","title":"Cas cliniques complexes : trauma, deuil et transitions","cardId":"card-122"}]};

    const svgAplat = () =>

        : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250"><rect width="400" height="250" fill="%23e2e8f0"/><text x="50%" y="50%" fill="%2394a3b8" font-size="14" text-anchor="middle" dominant-baseline="middle">' + encodeURIComponent(label.substring(0, 60)) + '</text></svg>';

function adocPresentGoToInternal(newIndex, opts) {

function adocPresentInstallKeydownHandler() {

      // jamais laissé remonter vers le gestionnaire de fermeture de l'espace de travail ci-dessous,

      if (window._adocPresentState && document.getElementById('cc-ws-present-overlay')?.classList.contains('open')) {

        // ferme UNIQUEMENT la porte, jamais les deux niveaux (présentation + porte) d'un seul
        // coup — l'utilisatrice doit pouvoir refermer une porte et rester sur sa diapositive.
        const door = document.getElementById('cc-ws-present-door');

window.adocQuizSelectOption = function (buttonEl, idx) {

    blockEl.classList.add('is-answered');
    const correctIndex = parseInt(blockEl.dataset.correctIndex, 10);
    const options = blockEl.querySelectorAll('.adoc-sc-quiz-option');
    options.forEach(function (opt, i) {
      opt.disabled = true;
      if (i === correctIndex) opt.classList.add('is-correct');

window.adocPresentClose = function () {

  };
window.adocPresentNext = function () {

window.adocPresentPrev = function () {

window.adocQuestionnaireSelectOption = function (buttonEl) {

    blockEl.querySelectorAll('.adoc-sc-questionnaire-partner-panel').forEach(function (panel) {

window.adocQuestionnaireCalculerResultat = function (buttonEl) {
    const blockEl = buttonEl.closest('.adoc-sc-questionnaire');
    if (!blockEl) return;
    let profiles;
    try { profiles = JSON.parse(blockEl.dataset.profiles || '[]'); } catch (_e) { profiles = []; }
    const panels = Array.from(blockEl.querySelectorAll('.adoc-sc-questionnaire-partner-panel'));
    const resultEl = blockEl.querySelector('.adoc-sc-questionnaire-result');
    if (!resultEl) return;

    if (scores.some(function (s) { return s === null; })) {
      resultEl.innerHTML = '<p class="adoc-sc-questionnaire-incomplete">Merci de répondre à toutes les questions avant de voir le résultat' +
        (panels.length > 1 ? ' (pour chaque partenaire)' : '') + '.</p>';
      resultEl.hidden = false;
      return;
    }
    const entries = scores.map(function (score, i) {
      return { label: panels.length > 1 ? 'Partenaire ' + (i + 1) : null, score: score, profile: adocQuestionnaireFindProfile(profiles, score) };
    });
    let html = entries.map(function (e) {
      return '<div class="adoc-sc-questionnaire-result-entry">' +
        (e.label ? '<p class="adoc-sc-questionnaire-result-partner">' + adocEsc(e.label) + '</p>' : '') +
        '<p><strong>Score : ' + e.score + '</strong> — ' + adocEsc(e.profile ? e.profile.label : '') + '</p>' +
        '<p>' + adocEsc(e.profile ? e.profile.interpretation : '') + '</p></div>';

      html += '<p class="adoc-sc-questionnaire-compare">' + (same ? 'Vous partagez le même profil.' : 'Vos profils diffèrent — cela peut ouvrir une discussion utile.') + '</p>';

window.adocPresentOpenImageDoor = function (imgEl) {

window.adocPresentCloseImageDoor = function () {
