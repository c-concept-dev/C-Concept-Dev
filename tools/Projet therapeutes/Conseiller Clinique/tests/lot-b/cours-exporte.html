l'évolution. C'est précisément là que commence la théorie de l'attachement.","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-03","type":"card","content":{"title":"Bowlby : une révolution darwinienne en psychiatrie","imageRef":"John Bowlby era 1950s child development research hospital observation","imageAlt":"Illustration évocatrice d'une époque de recherche clinique pionnière sur l'enfant","blocks":[{"id":"paragraph-06","type":"paragraph","content":{"text":"En 1953, Bowlby observe l'hospitalisme : des nourrissons séparés de leur mère présentent des réponses universelles de détresse, indépendamment de la culture et du milieu. Il en tire une hypothèse radicale : l'attachement n'est pas un dérivé de la satisfaction des besoins alimentaires — c'est un système comportemental autonome, sélectionné par l'évolution."},"citationIds":["citation-1","citation-2"],"validation":{"citationLinks":[{"citationId":"citation-1","claimText":"En 1953, Bowlby observe l'hospitalisme : des nourrissons séparés de leur mère présentent des réponses universelles de détresse, indépendamment de la culture et du milieu. Il en tire une hypothèse radi","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-2","claimText":"En 1953, Bowlby observe l'hospitalisme : des nourrissons séparés de leur mère présentent des réponses universelles de détresse, indépendamment de la culture et du milieu. Il en tire une hypothèse radi","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"système comportemental autonome","targetId":"m1-deepdive-systeme-comportemental"}],"_status":"needs-review"},{"id":"paragraph-07","type":"paragraph","content":{"text":"Bowlby forge sa théorie à la confluence de trois champs : l'éthologie de Lorenz (l'empreinte, 1935), la cybernétique des systèmes et la psychanalyse. C'est ce métissage théorique qui lui donne une portée que la psychiatrie de son époque n'avait pas anticipée."},"citationIds":["citation-2","citation-1"],"validation":{"citationLinks":[{"citationId":"citation-2","claimText":"Bowlby forge sa théorie à la confluence de trois champs : l'éthologie de Lorenz (l'empreinte, 1935), la cybernétique des systèmes et la psychanalyse. C'est ce métissage théorique qui lui donne une por","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-1","claimText":"Bowlby forge sa théorie à la confluence de trois champs : l'éthologie de Lorenz (l'empreinte, 1935), la cybernétique des systèmes et la psychanalyse. C'est ce métissage théorique qui lui donne une por","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-04","type":"card","content":{"title":"Le principe central : un instinct de lien","imageRef":"mother holding newborn skin to skin primal bond biology","imageAlt":"Mère tenant son nouveau-né peau contre peau, illustrant le lien biologique primaire","blocks":[{"id":"quote-09","type":"quote","content":{"text":"Les êtres humains, ainsi que les animaux, possèdent un instinct d'attachement qui vise à établir une relation stable avec la mère ou un autre personnage d'attachement."},"citationIds":["citation-2"],"validation":{"citationLinks":[{"citationId":"citation-2","claimText":"Les êtres humains, ainsi que les animaux, possèdent un instinct d'attachement qui vise à établir une relation stable avec la mère ou un autre personnage d'attachement.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-10","type":"paragraph","content":{"text":"Ce principe a une conséquence clinique immédiate : le besoin de proximité avec une figure d'attachement n'est pas une faiblesse ou une immaturité. C'est une nécessité biologique, aussi fondamentale que la faim ou la douleur. Le nier en thérapie, c'est travailler contre la biologie du patient."},"citationIds":["citation-3","citation-4"],"validation":{"citationLinks":[{"citationId":"citation-3","claimText":"Ce principe a une conséquence clinique immédiate : le besoin de proximité avec une figure d'attachement n'est pas une faiblesse ou une immaturité. C'est une nécessité biologique, aussi fondamentale qu","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-4","claimText":"Ce principe a une conséquence clinique immédiate : le besoin de proximité avec une figure d'attachement n'est pas une faiblesse ou une immaturité. C'est une nécessité biologique, aussi fondamentale qu","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-05","type":"card","content":{"title":"La figure d'attachement : ce qu'elle fait vraiment","imageRef":"caregiver comforting distressed child secure embrace","imageAlt":"Soignant réconfortant un enfant en détresse dans un cadre sécurisant","blocks":[{"id":"paragraph-12","type":"paragraph","content":{"text":"Bowlby distingue le comportement d'attachement — chercher la proximité en cas de menace — du caregiving, son complément côté figure d'attachement. Cassidy définit le caregiving system comme l'ensemble des comportements visant à promouvoir proximité et réconfort dès que l'enfant perçoit un danger."},"citationIds":["citation-5"],"validation":{"citationLinks":[{"citationId":"citation-5","claimText":"Bowlby distingue le comportement d'attachement — chercher la proximité en cas de menace — du caregiving, son complément côté figure d'attachement. Cassidy définit le caregiving system comme l'ensemble","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-13","type":"list","content":{"items":["Maintien de la proximité physique et émotionnelle","Refuge sécurisant en situation de détresse","Base de sécurité pour l'exploration du monde","Régulation des émotions et du stress"],"ordered":false},"citationIds":["citation-6","citation-5"],"validation":{"citationLinks":[{"citationId":"citation-6","claimText":"Maintien de la proximité physique et émotionnelle","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-5","claimText":"Maintien de la proximité physique et émotionnelle","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-14","type":"callout","content":{"text":"Ces quatre fonctions ne disparaissent pas à l'âge adulte. Elles se réorganisent — et se retrouvent intactes dans la relation de couple.","visualRole":"info"},"citationIds":["citation-6"],"validation":{"citationLinks":[{"citationId":"citation-6","claimText":"Ces quatre fonctions ne disparaissent pas à l'âge adulte. Elles se réorganisent — et se retrouvent intactes dans la relation de couple.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-06","type":"card","content":{"title":"Du berceau à la tombe : la continuité du lien","imageRef":"elderly couple walking hand in hand lifetime attachment bond","imageAlt":"Couple âgé marchant main dans la main, symbolisant la continuité de l'attachement tout au long de la vie","blocks":[{"id":"quote-16","type":"quote","content":{"text":"Bowlby considérait que l'attachement était pertinent « du berceau à la tombe ». Selon lui, les relations amoureuses adultes fonctionnent comme des liens d'attachement réciproques, où chaque partenaire sert de figure d'attachement à l'autre."},"citationIds":["citation-6"],"validation":{"citationLinks":[{"citationId":"citation-6","claimText":"Bowlby considérait que l'attachement était pertinent « du berceau à la tombe ». Selon lui, les relations amoureuses adultes fonctionnent comme des liens d'attachement réciproques, où chaque partenaire","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-17","type":"paragraph","content":{"text":"Ce glissement est décisif : dans le couple adulte, la relation cesse d'être asymétrique (un soignant, un soigné) pour devenir réciproque. Chaque partenaire est tour à tour figure d'attachement et sujet en besoin de réconfort. La psychopathologie conjugale commence souvent là où cette réciprocité se bloque."},"citationIds":["citation-6","citation-7"],"validation":{"citationLinks":[{"citationId":"citation-6","claimText":"Ce glissement est décisif : dans le couple adulte, la relation cesse d'être asymétrique (un soignant, un soigné) pour devenir réciproque. Chaque partenaire est tour à tour figure d'attachement et suje","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-7","claimText":"Ce glissement est décisif : dans le couple adulte, la relation cesse d'être asymétrique (un soignant, un soigné) pour devenir réciproque. Chaque partenaire est tour à tour figure d'attachement et suje","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-07","type":"card","content":{"title":"Ce que l'attachement enfant et adulte partagent","imageRef":"parallel child adult reaching out connection mirror","imageAlt":"Image en miroir d'un enfant et d'un adulte tendant la main, illustrant la continuité des besoins d'attachement","blocks":[{"id":"paragraph-19","type":"paragraph","content":{"text":"Les parallèles entre attachement enfant-parent et attachement adulte-adulte sont structurels, pas métaphoriques. On retrouve dans les deux cas : la recherche préférentielle d'une figure spécifique, la détresse à la séparation, le refuge en cas de menace, et la base sécure pour l'exploration."},"citationIds":["citation-6"],"validation":{"citationLinks":[{"citationId":"citation-6","claimText":"Les parallèles entre attachement enfant-parent et attachement adulte-adulte sont structurels, pas métaphoriques. On retrouve dans les deux cas : la recherche préférentielle d'une figure spécifique, la","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-20","type":"callout","content":{"text":"Différence cruciale : l'adulte dispose de ressources cognitives et symboliques pour tolérer la distance et négocier ses besoins — capacité absente chez le nourrisson. L'attachement adulte est médiatisé par le langage, les représentations et l'histoire.","visualRole":"warning"},"citationIds":["citation-6","citation-8"],"validation":{"citationLinks":[{"citationId":"citation-6","claimText":"Différence cruciale : l'adulte dispose de ressources cognitives et symboliques pour tolérer la distance et négocier ses besoins — capacité absente chez le nourrisson. L'attachement adulte est médiatis","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-8","claimText":"Différence cruciale : l'adulte dispose de ressources cognitives et symboliques pour tolérer la distance et négocier ses besoins — capacité absente chez le nourrisson. L'attachement adulte est médiatis","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-08","type":"card","content":{"title":"Les modèles internes opérants : la mémoire du lien","imageRef":"neural pathways brain memory formation early childhood","imageAlt":"Représentation schématique de voies neuronales et de la mémoire procédurale","blocks":[{"id":"paragraph-22","type":"paragraph","content":{"text":"Bowlby postule que chaque enfant construit, à partir de ses interactions répétées avec ses figures parentales, un modèle interne opérant (IWM) — une représentation de soi, de l'autre et de la relation. Ce modèle devient le filtre à travers lequel toutes les relations futures sont lues et anticipées."},"citationIds":["citation-8","citation-9"],"validation":{"citationLinks":[{"citationId":"citation-8","claimText":"Bowlby postule que chaque enfant construit, à partir de ses interactions répétées avec ses figures parentales, un modèle interne opérant (IWM) — une représentation de soi, de l'autre et de la relation","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-9","claimText":"Bowlby postule que chaque enfant construit, à partir de ses interactions répétées avec ses figures parentales, un modèle interne opérant (IWM) — une représentation de soi, de l'autre et de la relation","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-23","type":"paragraph","content":{"text":"Ce schème d'attachement est inscrit en mémoire procédurale : il agit à l'insu du sujet, se réactive dans la relation thérapeutique et dans le couple. La croyance sur la disponibilité de l'autre — « sera-t-il là si j'en ai besoin ? » — structure l'ensemble des réponses émotionnelles face au danger."},"citationIds":["citation-8","citation-3"],"validation":{"citationLinks":[{"citationId":"citation-8","claimText":"Ce schème d'attachement est inscrit en mémoire procédurale : il agit à l'insu du sujet, se réactive dans la relation thérapeutique et dans le couple. La croyance sur la disponibilité de l'autre — « se","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-3","claimText":"Ce schème d'attachement est inscrit en mémoire procédurale : il agit à l'insu du sujet, se réactive dans la relation thérapeutique et dans le couple. La croyance sur la disponibilité de l'autre — « se","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-09","type":"card","content":{"title":"Neurosciences : l'attachement câblé dans le cerveau","imageRef":"brain scan limbic system emotional regulation neuroscience","imageAlt":"Image de neuroimagerie illustrant les réseaux limbiques impliqués dans la régulation émotionnelle","blocks":[{"id":"paragraph-25","type":"paragraph","content":{"text":"Le nourrisson vient au monde sans capacité d'autorégulation émotionnelle. Sa fenêtre de tolérance se construit à traver  pires","targetId":"m1-deepdive-neurobio-attachement"}],"_status":"needs-review"},{"id":"callout-27","type":"callout","content":{"text":"Le système d'attachement est un système motivationnel génétiquement programmé, commun à toutes les espèces à niveau cérébral : il contribue à la survie, à la régulation émotionnelle et à l'adaptation sociale.","visualRole":"info"},"citationIds":["citation-3"],"validation":{"citationLinks":[{"citationId":"citation-3","claimText":"Le système d'attachement est un système motivationnel génétiquement programmé, commun à toutes les espèces à niveau cérébral : il contribue à la survie, à la régulation émotionnelle et à l'adaptation ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-10","type":"card","content":{"title":"Quand la figure d'attachement se trompe","imageRef":"anxious parent child overprotection misattunement family dynamics","imageAlt":"Scène de famille illustrant un désaccord de lecture entre parent et enfant sur une situation de danger","blocks":[{"id":"paragraph-29","type":"paragraph","content":{"text":"La défaillance du caregiving n'est pas nécessairement un manque d'amour. Elle opère par erreur de calibration : aide excessive, aide insuffisante, ou alternance imprévisible des deux. Une mère anxieuse apprend à son enfant à percevoir comme dangereux ce qui ne l'est pas ; une mère qui sous-estime l'exposition de l'enfant le laisse sans protection interne suffisante."},"citationIds":["citation-11"],"validation":{"citationLinks":[{"citationId":"citation-11","claimText":"La défaillance du caregiving n'est pas nécessairement un manque d'amour. Elle opère par erreur de calibration : aide excessive, aide insuffisante, ou alternance imprévisible des deux. Une mère anxieus","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-30","type":"callout","content":{"text":"C'est dans cet écart de calibratio ":"Personne anxieuse attendant un message, illustrant l'hypervigilance relationnelle de l'attachement anxieux","blocks":[{"id":"paragraph-60","type":"paragraph","content":{"text":"Forte anxiété d'abandon, image de soi négative, image d'autrui positive. Le partenaire est idéalisé, la relation suresurveillée."},"citationIds":["citation-16"],"validation":{"citationLinks":[{"citationId":"citation-16","claimText":"Forte anxiété d'abandon, image de soi négative, image d'autrui positive. Le partenaire est idéalisé, la relation suresurveillée.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-61","type":"list","content":{"items":["Demandes répétées de réassurance affective","Hyperactivation du système d'attachement face à toute distance","Tendance à rester dans une relation insatisfaisante plutôt que de risquer l'abandon","Représentations de soi faibles, représentations d'autrui positives"],"ordered":false},"citationIds":["citation-16","citation-19"],"validation":{"citationLinks":[{"citationId":"citation-16","claimText":"Manifestations observables :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-19","claimText":"Manifestations observables :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-62","type":"paragraph","content":{"text":"En session, le patient préoccupé déborde souvent le cadre : la détresse déborde le récit. La régulation émotionnelle est l'enjeu central — mais cela relève du module 6."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-20","type":"card","content":{"title":"Portrait du style évitant-détaché en couple","imageRef":"person alone reading book distant closed body language","imageAlt":"Personne seule et fermée, illustrant le retrait émotionnel caractéristique de l'attachement évitant","blocks":[{"id":"paragraph-64","type":"paragraph","content":{"text":"Faible anxiété d'abandon, fort évitement de l'intimité. L'autonomie est surinvestie. Le contact émotionnel est ressenti comme coûteux, voire menaçant."},"citationIds":["citation-20","citation-19"],"validation":{"citationLinks":[{"citationId":"citation-20","claimText":"Faible anxiété d'abandon, fort évitement de l'intimité. L'autonomie est surinvestie. Le contact émotionnel est ressenti comme coûteux, voire menaçant.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-19","claimText":"Faible anxiété d'abandon, fort évitement de l'intimité. L'autonomie est surinvestie. Le contact émotionnel est ressenti comme coûteux, voire menaçant.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-65","type":"paragraph","content":{"text":"Le besoin de contact existe, mais est dénié consciemment. Il est souvent satisfait indirectement — par le partenaire anxieux qui initie la proximité."},"citationIds":["citation-21"],"validation":{"citationLinks":[{"citationId":"citation-21","claimText":"Le besoin de contact existe, mais est dénié consciemment. Il est souvent satisfait indirectement — par le partenaire anxieux qui initie la proximité.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-66","type":"callout","content":{"text":"La danse évitant-anxieux est l'une des configurations les plus fréquentes en thérapie de couple : l'un fuit, l'autre poursuit — chacun amplifiant la réaction de l'autre.","visualRole":"info"},"citationIds":["citation-21","citation-22"],"validation":{"citationLinks":[{"citationId":"citation-21","claimText":"La danse évitant-anxieux est l'une des configurations les plus fréquentes en thérapie de couple : l'un fuit, l'autre poursuit — chacun amplifiant la réaction de l'autre.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-22","claimText":"La danse évitant-anxieux est l'une des configurations les plus fréquentes en thérapie de couple : l'un fuit, l'autre poursuit — chacun amplifiant la réaction de l'autre.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-21","type":"card","content":{"title":"Portrait du style désorganisé-craintif en couple","imageRef":"person in emotional conflict internal turmoil distressed","imageAlt":"Personne en conflit émotionnel intense, illustrant l'ambivalence du style d'attachement désorganisé","blocks":[{"id":"paragraph-68","type":"paragraph","content":{"text":"Forte anxiété ET fort évitement : le partenaire est simultanément source de sécurité souhaitée et source de danger anticipé. La figure d'attachement a historiquement été effrayante — ou effrayée elle-même."},"citationIds":["citation-23"],"validation":{"citationLinks":[{"citationId":"citation-23","claimText":"Forte anxiété ET fort évitement : le partenaire est simultanément source de sécurité souhaitée et source de danger anticipé. La figure d'attachement a historiquement été effrayante — ou effrayée elle-","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-69","type":"list","content":{"items":["S'approcher déclenche de la peur","S'éloigner déclenche de l'angoisse d'abandon","Le comportement relationnel devient imprévisible, parfois chaotique"],"ordered":false},"citationIds":["citation-23"],"validation":{"citationLinks":[{"citationId":"citation-23","claimText":"Résultat : une double contrainte relationnelle.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-70","type":"callout","content":{"text":"Ce profil est le plus complexe à distinguer des troubles de la personnalité — la question du diagnostic différentiel est traitée dans le module 7.","visualRole":"warning"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-22","type":"card","content":{"title":"Ce que les modèles ne disent pas — et pourquoi c'est important","imageRef":"compass map navigation orientation clinical perspective","imageAlt":"Boussole et carte symbolisant l'orientation clinique sans réduction de la personne à une étiquette","blocks":[{"id":"paragraph-72","type":"paragraph","content":{"text":"Les styles d'attachement ne sont pas des traits de personnalité fixes. Ils sont des stratégies relationnelles apprises, contextuelles, et modifiables."},"citationIds":["citation-18"],"validation":{"citationLinks":[{"citationId":"citation-18","claimText":"Les styles d'attachement ne sont pas des traits de personnalité fixes. Ils sont des stratégies relationnelles apprises, contextuelles, et modifiables.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-73","type":"list","content":{"items":["Deux patients avec le même label n'ont pas le même profil dimensionnel","Un style peut varier selon la relation, le contexte, la charge de stress","La catégorie oriente l'hypothèse de travail — elle ne remplace pas la formulation individuelle"],"ordered":false},"citationIds":["citation-18"],"validation":{"citationLinks":[{"citationId":"citation-18","claimText":"Trois limites cliniques à garder en tête :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"questionnaire-74","type":"questionnaire","content":{"questions":[{"text":"Face à une distance émotionnelle inattendue de votre partenaire, quelle est votre première réaction ?","options":[{"text":"Je continue mes activités — cela passera tout seul.","points":1},{"text":"Je me demande si quelque chose s'est passé, mais j'attends.","points":2},{"text":"Je cherche à comprendre rapidement ce qui se passe.","points":3},{"text":"Je ressens une forte inquiétude et j'ai besoin d'un signe rassurant très vite.","points":4}]},{"text":"Lorsque vous exprimez un besoin affectif, vous vous sentez :","options":[{"text":"Très mal à l'aise — je préfère ne pas le montrer.","points":1},{"text":"Un peu vulnérable, mais généralement à l'aise.","points":2},{"text":"À l'aise si le contexte s'y prête.","points":3},{"text":"Naturellement porté à exprimer mes besoins, parfois avec intensité.","points":4}]},{"text":"Dans une relation proche, le sentiment de dépendre de l'autre vous semble :","options":[{"text":"Inconfortable et à éviter autant que possible.","points":1},{"text":"Acceptable dans certaines limites.","points":2},{"text":"Normal et même souhaitable.","points":3},{"text":"Rassurant — plus il y a d'interdépendance, mieux je me sens.","points":4}]},{"text":"Quand une relation se termine, votre tendance est de :","options":[{"text":"Passer à autre chose assez rapidement en vous centrant sur vous.","points":1},{"text":"Traverser un deuil normal, puis reprendre pied.","points":2},{"text":"Analyser longuement ce qui s'est passé avant de tourner la page.","points":3},{"text":"Avoir du mal à accepter la fin et à ne pas retourner vers l'autre.","points":4}]},{"text":"En séance (ou en supervision), vous identifiez chez vous une tendance à :","options":[{"text":"Minimiser la dimension émotionnelle des cas — la logique prime.","points":1},{"text":"Équilibrer émotion et analyse selon le cas.","points":2},{"text":"Être facilement touché par la détresse du patient sans en être débordé.","points":3},{"text":"Vous surinvestir émotionnellement dans certaines prises en charge.","points":4}]}],"profiles":[{"label":"Orientation évitante","interpretation":"Votre profil tend vers un fort évitement de l'intimité et une minimisation des besoins affectifs. Ce registre est précieux pour la clarté analytique, mais peut limiter l'accordage émotionnel en séance. Notez-le comme hypothèse de travail, pas comme un verdict.","minScore":-1000000,"maxScore":10},{"label":"Profil sécure dominant","interpretation":"Votre profil suggère une relative aisance avec l'interdépendance et la vulnérabilité. L'attachement sécure se construit tout au long de la vie — ce score est une tendance, pas une certitude.","minScore":11,"maxScore":15},{"label":"Orientation anxieuse","interpretation":"Votre profil tend vers une forte anxiété relationnelle et une hypervigilance aux signaux affectifs. Cela peut enrichir l'empathie clinique, mais aussi exposer à des dynamiques de sur-implication. Une supervision centrée sur ces résonances peut être utile.","minScore":16,"maxScore":1000000}],"allowTwoPartners":false},"citationIds":["citation-18"],"validation":{"citationLinks":[{"citationId":"citation-18","claimText":"Affirmation du bloc.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-23","type":"card","content":{"title":"Représentations mentales et modèles internes opérants","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-75","type":"paragraph","content":{"text":"Notions clés : Modèles internes opérants, Représentation du self, Représentation d'autrui, Schémas relationnels, Croyances sur le lien amoureux."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-24","type":"card","content":{"title":"Ce que vous croyez sur l'amour avant même de l'avoir vécu","imageRef":"child looking at reflection in water, contemplative mood","imageAlt":"Enfant observant son reflet dans l'eau, évoquant la formation précoce d'une image intérieure","blocks":[{"id":"paragraph-77","type":"paragraph","content":{"text":"Avant de rencontrer un partenaire, vous avez déjà une théorie de l'amour. Elle est implicite, préverbale, stockée dans le corps autant que dans la pensée. Ce module en explore la structure."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-78","type":"callout","content":{"text":"Question d'ouverture : si l'amour que vous connaissez aujourd'hui ressemble étrangement à celui de votre enfance — est-ce un hasard ou un programme ?","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-25","type":"card","content":{"title":"Définition : le modèle interne opérant","imageRef":"abstract neural network architecture blueprint technical diagram","imageAlt":"Schéma abstrait d'un réseau de connexions, évoquant l'architecture mentale d'un modèle interne","blocks":[{"id":"paragraph-80","type":"paragraph","content":{"text":"Un modèle interne opérant (MIO) est une représentation mentale de soi en relation, construite à partir des premières expériences d'attachement. Il n'est pas un souvenir conscient : c'est une architecture qui filtre, anticipe et interprète toute expérience relationnelle ultérieure."},"citationIds":["citation-24"],"validation":{"citationLinks":[{"citationId":"citation-24","claimText":"Un modèle interne opérant (MIO) est une représentation mentale de soi en relation, construite à partir des premières expériences d'attachement. Il n'est pas un souvenir conscient : c'est une architect","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"premières expériences d'attachement","targetId":"m3-deepdive-mio-origine"}],"_status":"needs-review"},{"id":"callout-81","type":"callout","content":{"text":"Les MIO opèrent depuis l'arrière-plan : ils orientent la perception sans être perçus. C'est précisément ce qui les rend cliniquement décisifs.","visualRole":"info"},"citationIds":["citation-24"],"validation":{"citationLinks":[{"citationId":"citation-24","claimText":"Les MIO opèrent depuis l'arrière-plan : ils orientent la perception sans être perçus. C'est précisément ce qui les rend cliniquement décisifs.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-26","type":"card","content":{"title":"Deux axes, un seul modèle : self et autrui","imageRef":"two mirrors facing each other infinite reflection","imageAlt":"Deux miroirs se faisant face, générant une réflexion infinie, illustration du dédoublement self-autrui","blocks":[{"id":"paragraph-83","type":"paragraph","content":{"text":"Tout MIO est structuré autour de deux représentations indissociables : l'image de soi en relation (suis-je digne d'être aimé ?) et l'image d'autrui comme partenaire potentiel (l'autre est-il fiable, disponible, bienveillant ?)."},"citationIds":["citation-25"],"validation":{"citationLinks":[{"citationId":"citation-25","claimText":"Tout MIO est structuré autour de deux représentations indissociables : l'image de soi en relation (suis-je digne d'être aimé ?) et l'image d'autrui comme partenaire potentiel (l'autre est-il fiable, d","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-84","type":"list","content":{"items":["Représentation du self : valeur personnelle, compétence à être aimé, légitimité du besoin.","Représentation d'autrui : fiabilité, disponibilité, intentionnalité du partenaire.","Ces deux pôles se co-construisent et s'alimentent mutuellement en permanence."],"ordered":false},"citationIds":["citation-25"],"validation":{"citationLinks":[{"citationId":"citation-25","claimText":"Représentation du self : valeur personnelle, compétence à être aimé, légitimité du besoin.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-27","type":"card","content":{"title":"La mémoire implicite : le substrat invisible","imageRef":"iceberg underwater blue ocean surface hidden depth","imageAlt":"Iceberg dont la majeure partie est immergée sous la surface de l'eau, métaphore de la mémoire implicite","blocks":[{"id":"paragraph-86","type":"paragraph","content":{"text":"Les MIO sont alimentés par la mémoire implicite précoce. Ces contenus ne peuvent pas être rappelés consciemment : ils constituent la toile de fond, l'ambiance — le décor de théâtre dans lequel la vie relationnelle se déploie."},"citationIds":["citation-24"],"validation":{"citationLinks":[{"citationId":"citation-24","claimText":"Les MIO sont alimentés par la mémoire implicite précoce. Ces contenus ne peuvent pas être rappelés consciemment : ils constituent la toile de fond, l'ambiance — le décor de théâtre dans lequel la vie ","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"mémoire implicite précoce","targetId":"m3-deepdive-memoire-implicite"}],"_status":"needs-review"},{"id":"callout-87","type":"callout","content":{"text":"Ce que le patient ne se souvient pas, son corps et ses réactions relationnelles s'en souviennent parfaitement.","visualRole":"warning"},"citationIds":["citation-24"],"validation":{"citationLinks":[{"citationId":"citation-24","claimText":"Ce que le patient ne se souvient pas, son corps et ses réactions relationnelles s'en souviennent parfaitement.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-28","type":"card","content":{"title":"MIO et schémas précoces inadaptés : même famille","imageRef":"old worn map with marked routes and territories","imageAlt":"Vieille carte usée avec des routes et territoires balisés, évoquant des chemins mentaux tracés tôt","blocks":[{"id":"paragraph-89","type":"paragraph","content":{"text":"Les schémas précoces inadaptés (Young) sont, de fait, des modèles opérants internes dysfonctionnels : les deux construits partagent la même racine — une interaction précoce avec une figure d'attachement qui n'a pas su répondre aux besoins fondamentaux de l'enfant."},"citationIds":["citation-25"],"validation":{"citationLinks":[{"citationId":"citation-25","claimText":"Les schémas précoces inadaptés (Young) sont, de fait, des modèles opérants internes dysfonctionnels : les deux construits partagent la même racine — une interaction précoce avec une figure d'attacheme","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-90","type":"list","content":{"ite nnent de l'argile sur un tour de potier, métaphore de la transformation progressive des modèles internes","blocks":[{"id":"paragraph-101","type":"paragraph","content":{"text":"Les MIO sont stables par design : ils sont construits pour être prédictifs. Mais la neurobiologie de la reconsolidation mémorielle confirme qu'ils ne sont pas figés. Une expérience relationnelle correctrice — thérapeutique ou conjugale — peut modifier les structures représentationnelles elles-mêmes, pas seulement les comportements de surface."},"citationIds":["citation-31"],"validation":{"citationLinks":[{"citationId":"citation-31","claimText":"Les MIO sont stables par design : ils sont construits pour être prédictifs. Mais la neurobiologie de la reconsolidation mémorielle confirme qu'ils ne sont pas figés. Une expérience relationnelle corre","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-102","type":"callout","content":{"text":"La plasticité n'est pas la fragilité. Un MIO change lentement, sous condition d'expériences répétées et émotionnellement signifiantes — pas d'une simple prise de conscience cognitive.","visualRole":"info"},"citationIds":["citation-31"],"validation":{"citationLinks":[{"citationId":"citation-31","claimText":"La plasticité n'est pas la fragilité. Un MIO change lentement, sous condition d'expériences répétées et émotionnellement signifiantes — pas d'une simple prise de conscience cognitive.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-33","type":"card","content":{"title":"Ce qu'il faut retenir : trois idées pour la clinique","imageRef":"clear key concept notepad desk focused light","imageAlt":"Carnet de notes sur un bureau avec une lumière focalisée, évoquant la clarté des concepts retenus","blocks":[{"id":"list-104","type":"list","content":{"items":["Le MIO structure la perception avant le comportement : c'est là qu'il faut intervenir.","Dans le couple, le problème n'est jamais uniquement entre les partenaires — il est aussi entre leurs modèles internes respectifs.","Changer un MIO demande du temps, de la sécurité relationnelle et des expériences émotionnellement vives — le thérapeute en est l'un des vecteurs."],"ordered":false},"citationIds":["citation-25","citation-24","citation-31"],"validation":{"citationLinks":[{"citationId":"citation-25","claimText":"Trois lignes directrices pour la pratique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-24","claimText":"Trois lignes directrices pour la pratique :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-31","claimText":"Trois lignes directrices pour la pratique :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-105","type":"callout","content":{"text":"La prochaine étape du cours — l'évaluation clinique — vous donnera les outils pour rendre ces modèles visibles. Mais savoir qu'ils existent change déjà le regard posé sur chaque couple.","visualRole":"success"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-34","type":"card","content":{"title":"Évaluation clinique des styles d'attachement adulte","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-106","type":"paragraph","content":{"text":"Notions clés : Adult Attachment Interview (AAI), Experiences in Close Relationships (ECR), Questionnaires d'auto-rapport, Observation clinique des patrons d'interaction, Analyse des récits."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-35","type":"card","content":{"title":"Pourquoi évaluer l'attachement adulte ?","imageRef":"clinician taking notes during therapy session adult","imageAlt":"Clinicien prenant des notes lors d'un entretien thérapeutique","blocks":[{"id":"paragraph-108","type":"paragraph","content": ],"validation":{},"_status":"pass"},{"id":"card-53","type":"card","content":{"title":"Parentalité, couple et boucle de transmission","imageRef":"parent child interaction play affection home warm","imageAlt":"Parent jouant avec son enfant dans un cadre chaleureux, illustrant la relation d'attachement précoce","blocks":[{"id":"paragraph-167","type":"paragraph","content":{"text":"L'enfant a besoin de devenir autonome tout en étant soutenu par un être aimant et bienveillant. Lorsque ce mouvement est accueilli, il grandit et se relie librement. Lorsqu'il est entravé, il apprend à se modeler pour être aimé — un apprentissage qui structure son futur fonctionnement de couple."},"citationIds":["citation-52"],"validation":{"citationLinks":[{"citationId":"citation-52","claimText":"L'enfant a besoin de devenir autonome tout en étant soutenu par un être aimant et bienveillant. Lorsque ce mouvement est accueilli, il grandit et se relie librement. Lorsqu'il est entravé, il apprend ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-168","type":"callout","content":{"text":"La qualité de la parentalité reçue n'est pas seulement un passé : elle est un modèle actif qui oriente la façon d'aimer, d'être aimé, et d'élever à son tour ses propres enfants.","visualRole":"info"},"citationIds":["citation-52","citation-47"],"validation":{"citationLinks":[{"citationId":"citation-52","claimText":"La qualité de la parentalité reçue n'est pas seulement un passé : elle est un modèle actif qui oriente la façon d'aimer, d'être aimé, et d'élever à son tour ses propres enfants.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-47","claimText":"La qualité de la parentalité reçue n'est pas seulement un passé : elle est un modèle actif qui oriente la façon d'aimer, d'être aimé, et d'élever à son tour ses propres enfants.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-54","type":"card","content":{"title":"L'effet système : thérapie d'un maillon, bénéfice pour tous","imageRef":"ripple effect water drop concentric circles calm lake","imageAlt":"Effet de vague concentrique sur l'eau illustrant la propagation d'un changement","blocks":[{"id":"paragraph-170","type":"paragraph","content":{"text":"Un phénomène clinique remarquable : lorsqu'un seul membre d'une famille — notamment un grand-parent — engage un travail thérapeutique sur ses propres insécurités d'attachement, des changements positifs se propagent aux deux générations suivantes, sans que celles-ci soient directement en traitement."},"citationIds":["citation-47"],"validation":{"citationLinks":[{"citationId":"citation-47","claimText":"Un phénomène clinique remarquable : lorsqu'un seul membre d'une famille — notamment un grand-parent — engage un travail thérapeutique sur ses propres insécurités d'attachement, des changements positif","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-171","type":"callout","content":{"text":"Ce constat redéfinit la cible thérapeutique : travailler avec un adulte sur son histoire d'attachement, c'est aussi — potentiellement — intervenir en prévention sur la génération suivante.","visualRole":"success"},"citationIds":["citation-47"],"validation":{"citationLinks":[{"citationId":"citation-47","claimText":"Ce constat redéfinit la cible thérapeutique : travailler avec un adulte sur son histoire d'attachement, c'est aussi — potentiellement — intervenir en prévention sur la génération suivante.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-55","type":"card","content":{"title":"Rupture de la chaîne : résilience et facteurs de protection","imageRef":"person standing at dawn open landscape freedom resilience hope","imageAlt":"Silhouette d'une personne face à un paysage ouvert à l'aube, évoquant la résilience","blocks":[{"id":"paragraph-173","type":"paragraph","content":{"text":"La transmission n'est pas un destin. Les recherches sur la résilience montrent que des figures d'attachement alternatives — un adulte suffisamment bon, un enseignant, un thérapeute — peuvent constituer des points d'ancrage capables d'interrompre une chaîne transgénérationnelle."},"citationIds":["citation-53","citation-54"],"validation":{"citationLinks":[{"citationId":"citation-53","claimText":"La transmission n'est pas un destin. Les recherches sur la résilience montrent que des figures d'attachement alternatives — un adulte suffisamment bon, un enseignant, un thérapeute — peuvent constitue","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-54","claimText":"La transmission n'est pas un destin. Les recherches sur la résilience montrent que des figures d'attachement alternatives — un adulte suffisamment bon, un enseignant, un thérapeute — peuvent constitue","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"figures d'attachement alternatives","targetId":"m5-deepdive-resilience"}],"_status":"needs-review"},{"id":"list-174","type":"list","content":{"items":["La cohérence narrative : pouvoir raconter sa propre histoire sans la subir","L'accès à au moins une relation sécurisante réparatrice","La mentalisation : comprendre ses états internes et ceux de l'autre"],"ordered":false},"citationIds":["citation-53","citation-55"],"validation":{"citationLinks":[{"citationId":"citation-53","claimText":"Trois conditions cliniquement associées à la rupture positive de la chaîne :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-55","claimText":"Trois conditions cliniquement associées à la rupture positive de la chaîne :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-56","type":"card","content":{"title":"Dynamiques dysfonctionnelles dans le couple : patterns critiques","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-175","type":"paragraph","content":{"text":"Notions clés : Demande-retrait (pursue-withdraw), Critique-défense, Mépris et déconnexion, Escalade négative, Cycles d'attachement, Rupture de synchronie."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-57","type":"card","content":{"title":"Une question avant de commencer","imageRef":"two people sitting apart on a bench in silence urban park","imageAlt":"Deux personnes assises à distance l'une de l'autre sur un banc, regard perdu, silence urbain","blocks":[{"id":"paragraph-177","type":"paragraph","content":{"text":"Vous avez tous en tête un couple qui souffre sans se comprendre. Ils s'aiment — ou ils se sont aimés. Pourtant, chaque échange devient une blessure. Pourquoi ?"},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-178","type":"callout","content":{"text":"L'hypothèse de ce module : ce ne sont pas des personnes dysfonctionnelles. Ce sont des patterns — des boucles — qui dysfonctionnent. Et ces boucles ont une logique interne que l'on peut décrire, reconnaître, et interrompre.","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-58","type":"card","content":{"title":"Ce que nous entendons par « pattern »","imageRef":"loop spiral staircase architectural abstract","imageAlt":"Escalier en spirale vu du dessus, symbolisant une boucle répétitive","blocks":[{"id":"paragraph-180","type":"paragraph","content":{"text":"Un pattern n'est pas un trait de personnalité ni un diagnostic. C'est une séquence interactionnelle qui se répète — prévisible, auto-entretenue, et indépendante de la volonté des partenaires."},"citationIds":["citation-56"],"validation":{"citationLinks":[{"citationId":"citation-56","claimText":"Un pattern n'est pas un trait de personnalité ni un diagnostic. C'est une séquence interactionnelle qui se répète — prévisible, auto-entretenue, et indépendante de la volonté des partenaires.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-181","type":"list","content":{"items":["Il est déclenché par un stresseur, interne ou externe.","Il est amplifié par les réponses réciproques des partenaires.","Il stabilise — au prix d'une souffrance croissante."],"ordered":true},"citationIds":["citation-56"],"validation":{"citationLinks":[{"citationId":"citation-56","claimText":"Il est déclenché par un stresseur, interne ou externe.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-182","type":"callout","content":{"text":"Repère clinique fondamental : ce que chaque partenaire fait pour réduire sa propre détresse intensifie celle de l'autre. C'est là la mécanique centrale des boucles négatives.","visualRole":"info"},"citationIds":["citation-56"],"validation":{"citationLinks":[{"citationId":"citation-56","claimText":"Repère clinique fondamental : ce que chaque partenaire fait pour réduire sa propre détresse intensifie celle de l'autre. C'est là la mécanique centrale des boucles négatives.","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"boucles négatives","targetId":"m6-deepdive-boucle"}],"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-59","type":"card","content":{"title":"Le pattern demande-retrait","imageRef":"person reaching out hand while other turns away indoors","imageAlt":"Une main tendue vers quelqu'un qui se détourne, en intérieur","blocks":[{"id":"paragraph-184","type":"paragraph","content":{"text":"C'est le pattern le mieux documenté en thérapie de couple. Un partenaire poursuit — il réclame, insiste, critique. L'autre se retire — il se tait, s'évite, se ferme. Plus l'un avance, plus l'autre recule. Plus l'autre recule, plus l'un avance."},"citationIds":["citation-57"],"validation":{"citationLinks":[{"citationId":"citation-57","claimText":"C'est le pattern le mieux documenté en thérapie de couple. Un partenaire poursuit — il réclame, insiste, critique. L'autre se retire — il se tait, s'évite, se ferme. Plus l'un avance, plus l'autre rec","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-185","type":"callout","content":{"text":"Ce qui est perçu comme agressivité chez le poursuivant est souvent de l'angoisse d'abandon. Ce qui est perçu comme indifférence chez le retrayant est souvent une régulation émotionnelle par évitement.","visualRole":"info"},"citationIds":["citation-57","citation-58"],"validation":{"citationLinks":[{"citationId":"citation-57","claimText":"Ce qui est perçu comme agressivité chez le poursuivant est souvent de l'angoisse d'abandon. Ce qui est perçu comme indifférence chez le retrayant est souvent une régulation émotionnelle par évitement.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-58","claimText":"Ce qui est perçu comme agressivité chez le poursuivant est souvent de l'angoisse d'abandon. Ce qui est perçu comme indifférence chez le retrayant est souvent une régulation émotionnelle par évitement.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-186","type":"paragraph","content":{"text":"La boucle est symétrique dans sa logique, asymétrique dans sa visibilité : le poursuivant est « visible », le retrayant semble absent. Le thérapeute doit restituer la souffrance des deux."},"citationIds":["citation-57"],"validation":{"citationLinks":[{"citationId":"citation-57","claimText":"La boucle est symétrique dans sa logique, asymétrique dans sa visibilité : le poursuivant est « visible », le retrayant semble absent. Le thérapeute doit restituer la souffrance des deux.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-60","type":"card","content":{"title":"Le pattern critique-défense","imageRef":"couple facing each other tense body language indoor conflict","imageAlt":"Deux personnes face à face, posture fermée et tendue, conflit intérieur","blocks":[{"id":"paragraph-188","type":"paragraph","content":{"text":"La critique attaque la personne plutôt que le comportement. La défense, en retour, neutralise toute information relationnelle. Aucun des deux ne s'entend — et chacun se sent incompris."},"citationIds":["citation-59"],"validation":{"citationLinks":[{"citationId":"citation-59","claimText":"La critique attaque la personne plutôt que le comportement. La défense, en retour, neutralise toute information relationnelle. Aucun des deux ne s'entend — et chacun se sent incompris.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-189","type":"callout","content":{"text":"Paradoxe clinique : la critique est souvent une demande de lien mal formulée. La défense est souvent une tentative de préserver l'estime de soi, pas un refus de l'autre.","visualRole":"warning"},"citationIds":["citation-60"],"validation":{"citationLinks":[{"citationId":"citation-60","claimText":"Paradoxe clinique : la critique est souvent une demande de lien mal formulée. La défense est souvent une tentative de préserver l'estime de soi, pas un refus de l'autre.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-190","type":"paragraph","content":{"text":"Hendrix note que les critiques adressées au partenaire peuvent être le miroir d'un conflit interne non résolu : ce que je ne supporte pas chez toi est parfois ce que je ne supporte pas en moi."},"citationIds":["citation-60"],"validation":{"citationLinks":[{"citationId":"citation-60","claimText":"Hendrix note que les critiques adressées au partenaire peuvent être le miroir d'un conflit interne non résolu : ce que je ne supporte pas chez toi est parfois ce que je ne supporte pas en moi.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-61","type":"card","content":{"title":"Le mépris : marqueur de rupture de synchronie","imageRef":"person looking away with cold distant expression relationship distance","imageAlt":"Regard froid et distant, expression de dédain ou d'indifférence dans une relation","blocks":[{"id":"paragraph-192","type":"paragraph","content":{"text":"Parmi les signaux d'alarme cliniques, le mépris occupe une place à part. Ce n'est plus un conflit — c'est une déshumanisation partielle de l'autre. Il se manifeste par le sarcasme, le roulement des yeux, la raillerie, le ton condescendant."},"citationIds":["citation-61"],"validation":{"citationLinks":[{"citationId":"citation-61","claimText":"Parmi les signaux d'alarme cliniques, le mépris occupe une place à part. Ce n'est plus un conflit — c'est une déshumanisation partielle de l'autre. Il se manifeste par le sarcasme, le roulement des ye","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-193","type":"callout","content":{"text":"Gottman identifie le mépris comme le prédicteur le plus robuste de la dissolution relationnelle : il empoisonne la relation car il exprime le dégoût, rendant toute résolution de problème pratiquement impossible.","visualRole":"critical"},"citationIds":["citation-61"],"validation":{"citationLinks":[{"citationId":"citation-61","claimText":"Gottman identifie le mépris comme le prédicteur le plus robuste de la dissolution relationnelle : il empoisonne la relation car il exprime le dégoût, rendant toute résolution de problème pratiquement ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-194","type":"paragraph","content":{"text":"Andersen le formule autrement : le mépris est l'arme des faibles. Il protège d'une vulnérabilité que l'on n'a pas pu nommer. Cliniquement, c'est une piste, pas un verdict."},"citationIds":["citation-62"],"validation":{"citationLinks":[{"citationId":"citation-62","claimText":"Andersen le formule autrement : le mépris est l'arme des faibles. Il protège d'une vulnérabilité que l'on n'a pas pu nommer. Cliniquement, c'est une piste, pas un verdict.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-62","type":"card","content":{"title":"Le déni et la déconnexion émotionnelle","imageRef":"person staring blankly out window emotional numbness","imageAlt":"Personne regardant par la fenêtre dans le vide, expression émotionnellement éteinte","blocks":[{"id":"paragraph-196","type":"paragraph","content":{"text":"Certains couples ne se disputent plus — ils se sont déconnectés. Le déni d'un vécu douloureux peut être transitoirement protecteur, mais à terme il coûte plus qu'il ne protège."},"citationIds":["citation-63"],"validation":{"citationLinks":[{"citationId":"citation-63","claimText":"Certains couples ne se disputent plus — ils se sont déconnectés. Le déni d'un vécu douloureux peut être transitoirement protecteur, mais à terme il coûte plus qu'il ne protège.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-197","type":"paragraph","content":{"text":"Young décrit ce mécanisme en termes de coupure émotionnelle : les émotions s'engourdissent. Ce n'est pas délibéré. La personne « s'éteint » face à une menace relationnelle qu'elle ne peut pas traiter autrement."},"citationIds":["citation-58"],"validation":{"citationLinks":[{"citationId":"citation-58","claimText":"Young décrit ce mécanisme en termes de coupure émotionnelle : les émotions s'engourdissent. Ce n'est pas délibéré. La personne « s'éteint » face à une menace relationnelle qu'elle ne peut pas traiter ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-198","type":"callout","content":{"text":"Le refoulement d'un vécu douloureux ne l'anesthésie pas : il lui donne force et pouvoir invisibles. L'ennemi interne travaille dans l'ombre — le couple aussi.","visualRole":"warning"},"citationIds":["citation-63"],"validation":{"citationLinks":[{"citationId":"citation-63","claimText":"Le refoulement d'un vécu douloureux ne l'anesthésie pas : il lui donne force et pouvoir invisibles. L'ennemi interne travaille dans l'ombre — le couple aussi.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-63","type":"card","content":{"title":"L'escalade négative : la boucle s'emballe","imageRef":"storm wave crashing dark sea escalation metaphor","imageAlt":"Vague sombre s'écrasant avec force, métaphore d'une escalade émotionnelle hors de contrôle","blocks":[{"id":"paragraph-200","type":"paragraph","content":{"text":"Les patterns décrits jusqu'ici restent stables tant que chaque partenaire maintient sa stratégie habituelle. L'escalade survient quand les deux perdent le contrôle de leur régulation émotionnelle simultanément."},"citationIds":["citation-56"],"validation":{"citationLinks":[{"citationId":"citation-56","claimText":"Les patterns décrits jusqu'ici restent stables tant que chaque partenaire maintient sa stratégie habituelle. L'escalade survient quand les deux perdent le contrôle de leur régulation émotionnelle simu","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-201","type":"list","content":{"items":["Amplification réciproque et rapide des affects négatifs.","Perte progressive de la capacité à mentaliser l'autre.","Débordement physiologique (flooding) qui bloque l'accès aux ressources cognitives.","Irréversibilité apparente : on ne peut plus se souvenir d'où cela a commencé."],"ordered":false},"citationIds":["citation-56","citation-59"],"validation":{"citationLinks":[{"citationId":"citation-56","claimText":"Caractéristiques cliniques de l'escalade :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-59","claimText":"Caractéristiques cliniques de l'escalade :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-202","type":"callout","content":{"text":"L'escalade est le moment où l'intervention thérapeutique devient urgente — et paradoxalement le plus difficile à atteindre, car le couple arrive souvent épuisé, pas en pleine crise.","visualRole":"warning"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-64","type":"card","content":{"title":"Cycles d'attachement : la matrice des patterns","imageRef":"circular diagram cycle abstract visualization relationship","imageAlt":"Diagramme circulaire abstrait représentant un cycle relationnel","blocks":[{"id":"paragraph-204","type":"paragraph","content":{"text":"Chaque pattern décrit n'est pas isolé. Il s'inscrit dans un cycle d'attachement : un événement déclencheur active une insécurité, qui génère une réponse comportementale, qui confirme la peur initiale du partenaire, qui réactive son insécurité — et ainsi de suite."},"citationIds":["citation-56","citation-64"],"validation":{"citationLinks":[{"citationId":"citation-56","claimText":"Chaque pattern décrit n'est pas isolé. Il s'inscrit dans un cycle d'attachement : un événement déclencheur active une insécurité, qui génère une réponse comportementale, qui confirme la peur initiale ","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-64","claimText":"Chaque pattern décrit n'est pas isolé. Il s'inscrit dans un cycle d'attachement : un événement déclencheur active une insécurité, qui génère une réponse comportementale, qui confirme la peur initiale ","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-205","type":"callout","content":{"text":"Les couples déséquilibrés sont des couples insuffisamment équipés pour accomplir leurs tâches de développement — l'équilibre entre appartenance et séparation est compromis, et la boucle devient la seule organisation disponible.","visualRole":"info"},"citationIds":["citation-64"],"validation":{"citationLinks":[{"citationId":"citation-64","claimText":"Les couples déséquilibrés sont des couples insuffisamment équipés pour accomplir leurs tâches de développement — l'équilibre entre appartenance et séparation est compromis, et la boucle devient la seu","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-206","type":"paragraph","content":{"text":"La transmission intergénérationnelle alimente ces cycles : ce que la famille d'origine a installé comme modèle relationnel se rejoue — avec un degré variable d'amplification — dans le couple adulte."},"citationIds":["citation-65","citation-66"],"validation":{"citationLinks":[{"citationId":"citation-65","claimText":"La transmission intergénérationnelle alimente ces cycles : ce que la famille d'origine a installé comme modèle relationnel se rejoue — avec un degré variable d'amplification — dans le couple adulte.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-66","claimText":"La transmission intergénérationnelle alimente ces cycles : ce que la famille d'origine a installé comme modèle relationnel se rejoue — avec un degré variable d'amplification — dans le couple adulte.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-65","type":"card","content":{"title":"Trajectoire adaptative vs inadaptée : comment les distinguer ?","imageRef":"fork in road two paths diverging nature decision","imageAlt":"Un chemin qui se divise en deux directions dans un paysage naturel, symbolisant un choix de trajectoire","blocks":[{"id":"paragraph-208","type":"paragraph","content":{"text":"Tous les couples traversent des cycles de tension. La distinction clinique ne porte pas sur la présence de conflits, mais sur la capacité à en sortir et à retrouver une synchronie."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"list-209","type":"list","content":{"items":["Le conflit est suivi d'une réparation.","Chaque partenaire peut nommer sa propre vulnérabilité.","La communication non verbale reste accessible même sous stress.","La relation contient des séquences positives robustes."],"ordered":false},"citationIds":["citation-59"],"validation":{"citationLinks":[{"citationId":"citation-59","claimText":"Trajectoire adaptative — indicateurs :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-210","type":"list","content":{"items":["Les patterns se rigidifient et ne varient plus.","Le mépris s'installe comme registre basal.","La réparation devient impossible ou absente.","La modification du système est bloquée par son organisation même."],"ordered":false},"citationIds":["citation-64","citation-61"],"validation":{"citationLinks":[{"citationId":"citation-64","claimText":"Trajectoire inadaptée — signaux d'alerte :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-61","claimText":"Trajectoire inadaptée — signaux d'alerte :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-66","type":"card","content":{"title":"Ce que le clinicien doit retenir","imageRef":"clinical therapist taking notes focused professional office","imageAlt":"Thérapeute clinicien prenant des notes dans un bureau, posture concentrée et professionnelle","blocks":[{"id":"paragraph-212","type":"paragraph","content":{"text":"Les patterns pathogènes du couple ne sont ni des accidents ni des pathologies individuelles. Ce sont des systèmes en équilibre, même précaire — et tout système en équilibre résiste au changement."},"citationIds":["citation-64"],"validation":{"citationLinks":[{"citationId":"citation-64","claimText":"Les patterns pathogènes du couple ne sont ni des accidents ni des pathologies individuelles. Ce sont des systèmes en équilibre, même précaire — et tout système en équilibre résiste au changement.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-213","type":"callout","content":{"text":"La première tâche du thérapeute n'est pas de corriger les comportements : c'est d'enseigner aux partenaires à voir le pattern qu'ils ne voient pas — avant de tenter de le changer.","visualRole":"success"},"citationIds":["citation-59"],"validation":{"citationLinks":[{"citationId":"citation-59","claimText":"La première tâche du thérapeute n'est pas de corriger les comportements : c'est d'enseigner aux partenaires à voir le pattern qu'ils ne voient pas — avant de tenter de le changer.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-214","type":"paragraph","content":{"text":"Demande-retrait, critique-défense, mépris, déconnexion, escalade : cinq formes, une seule mécanique. Chacune est une réponse à une peur que l'autre ne peut pas encore entendre. Le travail clinique commence là."},"citationIds":["citation-57","citation-61","citation-58"],"validation":{"citationLinks":[{"citationId":"citation-57","claimText":"Demande-retrait, critique-défense, mépris, déconnexion, escalade : cinq formes, une seule mécanique. Chacune est une réponse à une peur que l'autre ne peut pas encore entendre. Le travail clinique com","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-61","claimText":"Demande-retrait, critique-défense, mépris, déconnexion, escalade : cinq formes, une seule mécanique. Chacune est une réponse à une peur que l'autre ne peut pas encore entendre. Le travail clinique com","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-58","claimText":"Demande-retrait, critique-défense, mépris, déconnexion, escalade : cinq formes, une seule mécanique. Chacune est une réponse à une peur que l'autre ne peut pas encore entendre. Le travail clinique com","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-67","type":"card","content":{"title":"Conséquences cliniques des attachements insécures en couple","imageRef":null,"imageAlt":null,"blocks":[{"id":"paragraph-215","type":"paragraph","content":{"text":"Notions clés : Anxiété relationnelle, Isolement et dépression, Troubles sexuels, Conflits et violence, Burnout relationnel, Santé physique et mentale."},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-68","type":"card","content":{"title":"De la théorie à la clinique : une souffrance concrète","imageRef":"couple sitting apart in silence emotional distance indoor","imageAlt":"Deux partenaires assis à distance l'un de l'autre dans un silence chargé","blocks":[{"id":"paragraph-217","type":"paragraph","content":{"text":"Les styles insécures ne sont pas des étiquettes abstraites. Ils produisent une souffrance mesurable, des symptômes identifiables, et des patterns relationnels qui s'autoalimentent jusqu'à l'épuisement ou la rupture."},"citationIds":[],"validation":{},"_status":"pass"},{"id":"callout-218","type":"callout","content":{"text":"Question clinique centrale : comment le style d'attachement d'un individu se traduit-il, au quotidien, en symptômes pour lui-même et en dysfonctionnement pour le couple ?","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"},{"id":"list-219","type":"list","content":{"items":["Anxiété relationnelle chronique","Isolement et dépression","Troubles sexuels","Conflits répétés et violence","Burnout relationnel","Atteintes à la santé physique et mentale"],"ordered":false},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-69","type":"card","content":{"title":"L'attachement insécure anxieux : quand l'amour fait peur","imageRef":"person anxious waiting for message phone worried","imageAlt":"Personne anxieuse scrutant son téléphone dans l'attente d'un message","blocks":[{"id":"paragraph-221","type":"paragraph","content":{"text":"Le style anxieux organise la vie de couple autour d'une peur centrale : être abandonné. Cette hypervigilance aux signaux de rejet mobilise des ressources cognitives et émotionnelles considérables, générant une fatigue chronique pour les deux partenaires."},"citationIds":["citation-67"],"validation":{"citationLinks":[{"citationId":"citation-67","claimText":"Le style anxieux organise la vie de couple autour d'une peur centrale : être abandonné. Cette hypervigilance aux signaux de rejet mobilise des ressources cognitives et émotionnelles considérables, gén","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-222","type":"list","content":{"items":["Rumination et surveillance constante du lien","Comportements de réassurance répétitifs (appels, messages, vérifications)","Jalousie réactionnelle disproportionnée","Effondrements émotionnels lors des moindres distances perçues","Dépendance affective à l'humeur de l'autre"],"ordered":false},"citationIds":["citation-68","citation-69"],"validation":{"citationLinks":[{"citationId":"citation-68","claimText":"Symptômes cliniques caractéristiques :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-69","claimText":"Symptômes cliniques caractéristiques :","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"anxiété relationnelle chronique","targetId":"m7-deepdive-anxieux-depression"}],"_status":"needs-review"},{"id":"callout-223","type":"callout","content":{"text":"Le partenaire anxieux ne souffre pas d'un excès d'amour : il souffre d'un déficit de sécurité intérieure que l'autre ne peut pas combler, quoi qu'il fasse.","visualRole":"info"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-70","type":"card","content":{"title":"L'attachement insécure évitant : le mur intérieur","imageRef":"person alone reading book emotional wall distant partner","imageAlt":"Personne seule et absorbée dans sa lecture, partenaire ignoré en arrière-plan","blocks":[{"id":"paragraph-225","type":"paragraph","content":{"text":"L'évitant ne fuit pas le lien par indifférence : il le fuit parce que l'intimité active un système d'alarme appris. Sous l'apparente autosuffisance se cache une détresse que ni lui ni son partenaire ne savent nommer."},"citationIds":["citation-70"],"validation":{"citationLinks":[{"citationId":"citation-70","claimText":"L'évitant ne fuit pas le lien par indifférence : il le fuit parce que l'intimité active un système d'alarme appris. Sous l'apparente autosuffisance se cache une détresse que ni lui ni son partenaire n","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-226","type":"list","content":{"items":["Désactivation émotionnelle : minimisation des besoins de l'autre et des siens","Retrait physique et communicationnel lors des conflits","Difficulté à exprimer de la vulnérabilité ou à en recevoir","Investissement compensatoire dans le travail, les loisirs, la performance","Sentiment d'étouffement à chaque demande d'intimité"],"ordered":false},"citationIds":["citation-68"],"validation":{"citationLinks":[{"citationId":"citation-68","claimText":"Manifestations cliniques :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-227","type":"callout","content":{"text":"Pour le partenaire de l'évitant, vivre avec quelqu'un qui se ferme est une forme particulièrement douloureuse de solitude à deux.","visualRole":"info"},"citationIds":["citation-71"],"validation":{"citationLinks":[{"citationId":"citation-71","claimText":"Pour le partenaire de l'évitant, vivre avec quelqu'un qui se ferme est une forme particulièrement douloureuse de solitude à deux.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-71","type":"card","content":{"title":"L'attachement désorganisé : quand le refuge est aussi la menace","imageRef":"person frozen conflict fear expression close up","imageAlt":"Visage exprimant la peur et la sidération face à une situation de conflit","blocks":[{"id":"paragraph-229","type":"paragraph","content":{"text":"Le désorganisé est pris dans une contradiction neurobiologique : il cherche la sécurité chez l'autre, mais l'autre active simultanément son système de défense. Le résultat est un comportement paradoxal, souvent incompréhensible pour le partenaire."},"citationIds":["citation-72"],"validation":{"citationLinks":[{"citationId":"citation-72","claimText":"Le désorganisé est pris dans une contradiction neurobiologique : il cherche la sécurité chez l'autre, mais l'autre active simultanément son système de défense. Le résultat est un comportement paradoxa","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-230","type":"list","content":{"items":["Dissociation en contexte de conflit ou d'intimité","Comportements contradictoires : demande de proximité verbale, retrait corporel","Tendance au contrôle par la coercition ou la violence","Comorbidités fréquentes : addictions, troubles anxieux, troubles dissociatifs","Prédictif de comportements agressifs dans la dyade (Lyons-Ruth et Jacobvitz, 1999)"],"ordered":false},"citationIds":["citation-72"],"validation":{"citationLinks":[{"citationId":"citation-72","claimText":"Conséquences cliniques majeures :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-231","type":"callout","content":{"text":"Deux systèmes psychobiologiques antagonistes activés simultanément : le système d'attachement (engagement social) et le système défensif dorsal-vagal. L'organisme ne peut pas résoudre cette contradiction — il se fige.","visualRole":"critical"},"citationIds":["citation-72"],"validation":{"citationLinks":[{"citationId":"citation-72","claimText":"Deux systèmes psychobiologiques antagonistes activés simultanément : le système d'attachement (engagement social) et le système défensif dorsal-vagal. L'organisme ne peut pas résoudre cette contradict","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-72","type":"card","content":{"title":"Comorbidités : l'attachement insécure comme facteur de vulnérabilité","imageRef":"clinical psychology assessment mood disorder therapy session notes","imageAlt":"Clinicien prenant des notes lors d'une évaluation psychologique","blocks":[{"id":"paragraph-233","type":"paragraph","content":{"text":"L'attachement insécure n'est pas un trouble en soi, mais il constitue un facteur de vulnérabilité transdiagnostique. Il amplifie, précipite ou entretient de nombreux troubles psychologiques."},"citationIds":["citation-73","citation-74"],"validation":{"citationLinks":[{"citationId":"citation-73","claimText":"L'attachement insécure n'est pas un trouble en soi, mais il constitue un facteur de vulnérabilité transdiagnostique. Il amplifie, précipite ou entretient de nombreux troubles psychologiques.","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-74","claimText":"L'attachement insécure n'est pas un trouble en soi, mais il constitue un facteur de vulnérabilité transdiagnostique. Il amplifie, précipite ou entretient de nombreux troubles psychologiques.","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"list-234","type":"list","content":{"items":["Troubles anxieux : anxiété de séparation, trouble panique, anxiété généralisée","Dépression : perturbation de la régulation émotionnelle et isolement subjectif","Troubles de la personnalité (notamment état-limite et narcissique)","Addictions comportementales et substances","Troubles dissociatifs (attachement désorganisé)"],"ordered":false},"citationIds":["citation-72","citation-75","citation-73"],"validation":{"citationLinks":[{"citationId":"citation-72","claimText":"Comorbidités documentées :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-75","claimText":"Comorbidités documentées :","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-73","claimText":"Comorbidités documentées :","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"callout-235","type":"callout","content":{"text":"L'attachement insécure adulte perturbe structurellement la régulation émotionnelle : l'individu dispose de moins de ressources pour moduler ses états internes, ce qui augmente la réactivité aux stresseurs relationnels (Henschel, 2020).","visualRole":"warning"},"citationIds":["citation-68"],"validation":{"citationLinks":[{"citationId":"citation-68","claimText":"L'attachement insécure adulte perturbe structurellement la régulation émotionnelle : l'individu dispose de moins de ressources pour moduler ses états internes, ce qui augmente la réactivité aux stress","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-73","type":"card","content":{"title":"Anxiété relationnelle et fonctionnement du couple","imageRef":"couple arguing tension living room emotional conflict","imageAlt":"Couple en tension émotionnelle dans leur salon, regard évitant","blocks":[{"id":"paragraph-237","type":"paragraph","content":{"text":"L'anxiété d'un partenaire ne reste jamais cantonnée à lui seul. Elle entre en interaction avec les défenses de l'autre et crée un patron relationnel dysfonctionnel qui affecte la qualité globale de la relation."},"citationIds":["citation-76"],"validation":{"citationLinks":[{"citationId":"citation-76","claimText":"L'anxiété d'un partenaire ne reste jamais cantonnée à lui seul. Elle entre en interaction avec les défenses de l'autre et crée un patron relationnel dysfonctionnel qui affecte la qualité globale de la","claimSupport":"needs-review","_technicalOk":true}]},"_status":"needs-review"},{"id":"paragraph-238","type":"paragraph","content":{"text":"Le pattern le plus documenté est la spirale poursuite-retrait : le partenaire anxieux intensifie ses demandes, l'évitant se ferme davantage, ce qui amplifie l'anxiété du premier — et ainsi de suite, sans résolution possible depuis l'intérieur du système."},"citationIds":["citation-76","citation-77"],"validation":{"citationLinks":[{"citationId":"citation-76","claimText":"Le pattern le plus documenté est la spirale poursuite-retrait : le partenaire anxieux intensifie ses demandes, l'évitant se ferme davantage, ce qui amplifie l'anxiété du premier — et ainsi de suite, s","claimSupport":"needs-review","_technicalOk":true},{"citationId":"citation-77","claimText":"Le pattern le plus documenté est la spirale poursuite-retrait : le partenaire anxieux intensifie ses demandes, l'évitant se ferme davantage, ce qui amplifie l'anxiété du premier — et ainsi de suite, s","claimSupport":"needs-review","_technicalOk":true}]},"deepDiveLinks":[{"text":"spirale poursuite-retrait","targetId":"m7-deepdive-poursuite-retrait"}],"_status":"needs-review"},{"id":"callout-239","type":"callout","content":{"text":"Ce qui se présente comme un problème de communication est souvent un problème de sécurité émotionnelle. Travailler la forme sans traiter le fond ne fait que déplacer le conflit.","visualRole":"warning"},"citationIds":[],"validation":{},"_status":"pass"}]},"citationIds":[],"validation":{},"_status":"pass"},{"id":"card-74","type":"card","content":{"title":"Isolement, dépression et santé mentale","imageRef":"person sitting alone window rain introspection depression","imageAlt":"Personne seule regardant la pluie par une fenêtre, expression mélancolique
