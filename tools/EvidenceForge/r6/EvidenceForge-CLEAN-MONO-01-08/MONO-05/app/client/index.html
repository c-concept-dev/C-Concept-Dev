<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvidenceForge — Opérateur</title>
<style>
  :root { --bg:#111417; --panel:#1b1f24; --border:#2c333a; --text:#e6e9ec; --muted:#9aa4ac; --accent:#4a9eff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  main { display:flex; height:calc(100vh - 42px); }
  nav#runsList { width:260px; border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; }
  #content { flex:1; overflow-y:auto; padding:16px; min-width:0; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  table { border-collapse: collapse; width:100%; }
  th, td { border-bottom:1px solid var(--border); padding:6px 8px; text-align:left; vertical-align:top; }
  .run-item { display:block; width:100%; text-align:left; padding:10px 12px; border:none; border-bottom:1px solid var(--border); border-radius:0; background:none; }
  .run-item[aria-current="true"] { background: var(--panel); }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px; font-size:12px; border:1px solid var(--border); }
  .badge .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .state-NOT_STARTED .dot { background:#666; } .state-NOT_STARTED { color:#aaa; }
  .state-READY .dot { background:#4a9eff; } .state-READY { color:#4a9eff; }
  .state-RUNNING .dot { background:#e6b800; } .state-RUNNING { color:#e6b800; }
  .state-SUCCESS .dot { background:#3fbf5f; } .state-SUCCESS { color:#3fbf5f; }
  .state-FAILED .dot { background:#e05656; } .state-FAILED { color:#e05656; }
  .state-BLOCKED .dot { background:#c96bd6; } .state-BLOCKED { color:#c96bd6; }
  .state-PAUSED .dot { background:#e08a3f; } .state-PAUSED { color:#e08a3f; }
  .graph { display:flex; flex-wrap:wrap; gap:8px; }
  .node-box { border:1px solid var(--border); border-radius:6px; padding:8px 10px; min-width:150px; background:var(--panel); }
  .node-box button { display:block; margin-top:6px; }
  section { margin-bottom:20px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin:0 0 8px; }
  .error-box { border:1px solid #e05656; background:#2a1616; padding:8px 10px; border-radius:4px; margin-top:8px; }
  code { background:#00000055; padding:1px 4px; border-radius:3px; }
  .help { color:var(--muted); font-size:12px; margin-top:2px; }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  @media (max-width: 900px) { main { flex-direction:column; height:auto; } nav#runsList { width:100%; max-height:200px; } }
</style>
</head>
<body>
<header>
  <h1>EvidenceForge — Opérateur</h1>
  <button id="btnNewRun" type="button">Nouveau run</button>
  <span id="pollStatus" class="help" aria-live="polite"></span>
</header>
<main>
  <nav id="runsList" aria-label="Liste des runs"></nav>
  <div id="content" role="main" aria-live="polite"></div>
</main>
<script src="app.js"></script>
</body>
</html>
