# ══════════════════════════════════════════════════════════════════════════════
# ATTENTION AU DÉPLOIEMENT
#
# Toujours déployer ainsi, depuis ce dossier, avec « --config » :
#
#     npx wrangler deploy --config wrangler.toml
#
# SANS « --config », wrangler remonte à la racine du dépôt et prend
# wrangler.jsonc, qui est le site statique « c-concept-dev » : il le
# remplacerait par cette API. Le même piège est documenté dans
# « Worker/wrangler.toml », qui l'a rencontré.
#
# Et jamais depuis la racine : « Worker/ » appartient à clone-proxy, dont
# Studio Clinique dépend, et tout changement dans ce dossier le redéploie
# automatiquement. Ce fichier-ci ne le concerne pas.
#
# Un essai à blanc montre ce qui partirait, sans rien envoyer :
#
#     npx wrangler deploy --config wrangler.toml --dry-run
#
# ══════════════════════════════════════════════════════════════════════════════

name = "lienotheque-api"
main = "src/index.ts"
compatibility_date = "2026-03-08"

# Figé, pour qu'un déploiement n'annonce plus aucun écart avec ce qui est en ligne.
# « workers_dev » garde l'adresse par laquelle l'application appelle ; « preview_urls » est
# désactivé parce qu'une adresse de prévisualisation est une porte de plus sur la même route,
# et celle-ci n'a pas à en avoir deux.
workers_dev = true
preview_urls = false

# ── Les secrets ne sont pas ici, et n'y seront jamais ─────────────────────────
#
# « ANTHROPIC_API_KEY » et « JETON_ACCES » sont posés à la main sur le Worker,
# hors du dépôt, et n'apparaissent dans aucun fichier, journal ni réponse :
#
#     npx wrangler secret put ANTHROPIC_API_KEY --config wrangler.toml
#     npx wrangler secret put JETON_ACCES       --config wrangler.toml
#
# Pour une mise au point locale, « wrangler dev » lit « .dev.vars », qui est
# ignoré par git et ne doit jamais y entrer.
#
# Aucune section [vars] : une variable déclarée ici serait en clair dans le
# dépôt public. Les deux secrets sont lus par le code depuis les liaisons de
# l'hébergeur, et la route refuse d'ouvrir si l'un manque.

# ── Le registre des bibliothèques publiées (lot E1, étape 1) ──────────────────
#
# Une base à part, qui ne contient aucun contenu de bibliothèque : seulement de
# quoi savoir laquelle existe, où elle est servie et dans quel état.
#
# Les bibliothèques elles-mêmes auront chacune leur base, déclarée ici sur une
# place nommée de la réserve (BIB_1…BIB_4) — c'est ce qui évite de donner au
# Worker un jeton de compte capable de créer ou de supprimer une base, ce que
# SEC-08 interdit. La réserve s'ajoutera quand la première base existera.
#
# Les migrations ne s'écrivent pas à la main : elles sont engendrées depuis
# packages/depot-sqlite/src/migrations.ts par « pnpm build », et un test échoue
# si le disque a dérivé du tableau. Pour les appliquer :
#
#     npx wrangler d1 migrations apply lienotheque-registre --config wrangler.toml --remote
#
[[d1_databases]]
binding = "REGISTRE"
database_name = "lienotheque-registre"
database_id = "a4a21d00-c8a0-459a-a279-7b083ffa1794"
migrations_dir = "migrations/registre"

# ── La réserve de liaisons ────────────────────────────────────────────────────
#
# Une place par bibliothèque servie. Le registre dit laquelle est occupée par
# qui ; le Worker ne fait que lire la base qu'on lui a reliée.
#
# BIB_1 porte pour l'instant « lienotheque-essai », la bibliothèque d'essai du
# lot E1 — nommée ainsi pour qu'on ne la confonde jamais avec une vraie. Les
# places suivantes s'ajoutent quand une bibliothèque en a besoin : déclarer des
# places vides reviendrait à créer des bases que personne n'utilise.
#
#     npx wrangler d1 migrations apply lienotheque-essai --config wrangler.toml --remote
#
[[d1_databases]]
binding = "BIB_1"
database_name = "lienotheque-essai"
database_id = "5c4aba81-9504-4551-bd75-4d9761e7bc2c"
migrations_dir = "migrations/bibliotheque"
