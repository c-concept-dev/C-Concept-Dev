[package]
name = "lienotheque-bureau"
version = "0.1.0"
description = "Prototype bureau Liénothèque (lot 0) : PDF, sidecar, reprise, lecture par plages."
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "lienotheque_bureau"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.36"
tiny_http = "0.12"
uuid = { version = "1.20.0", features = ["v4"] }
tauri-plugin-dialog = "2"
sha2 = "0.10.9"
base64 = "0.23.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
