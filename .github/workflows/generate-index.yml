name: 🔄 Generate Index

on:
  push:
    paths:
      - '**/*.html'
      - '!index.html'
      - '!tools/lienotheque/**'
      - 'generate-index.js'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    name: 📋 Generate HTML Index
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 🔍 List HTML files
        run: |
          echo "📚 Fichiers HTML trouvés:"
          find . -name "*.html" -not -path "./.git/*" -not -name "index.html" | head -30
          echo ""
          echo "📊 Total: $(find . -name "*.html" -not -path "./.git/*" -not -name "index.html" | wc -l) fichiers"
      
      - name: 🔄 Pull latest changes (ANTI-CONFLIT)
        run: |
          echo "🔄 Synchronisation avec origin/main..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Pull avec rebase pour éviter conflits
          git pull --rebase origin main || {
            echo "⚠️ Conflit détecté, résolution automatique..."
            # Si conflit sur index.html, prendre la version remote et régénérer
            git checkout --theirs index.html 2>/dev/null || true
            git add index.html 2>/dev/null || true
            git rebase --continue || git rebase --skip
          }
      
      - name: 🚀 Generate index.html
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "🔄 Génération de l'index C Concept&Dev"
          echo "═══════════════════════════════════════════════════"
          # tools/lienotheque est une application, pas une page du site : on l'écarte le temps
          # de la génération, puis on la remet. (Une ligne dans generate-index.js, à côté de
          # l'exclusion EvidenceForge, ferait la même chose plus simplement.)
          mv tools/lienotheque "$RUNNER_TEMP/lienotheque"
          node generate-index.js
          mv "$RUNNER_TEMP/lienotheque" tools/lienotheque
      
      - name: 📊 Verify generated index
        run: |
          if [ -f index.html ]; then
            echo "✅ index.html généré avec succès"
            echo ""
            echo "📦 Taille du fichier:"
            ls -lh index.html
          else
            echo "❌ Erreur: index.html non généré"
            exit 1
          fi
      
      - name: 📤 Commit and push with retry (ANTI-CONFLIT)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Vérifier si changements
          if git diff --quiet index.html 2>/dev/null; then
            echo "ℹ️ Pas de changements détectés dans index.html"
            exit 0
          fi
          
          # Ajouter et commiter
          git add index.html
          git commit -m "🔄 Auto-update index.html [skip ci]"
          
          # Push avec retry (3 tentatives)
          for attempt in {1..3}; do
            echo "📤 Tentative de push ($attempt/3)..."
            
            if git push origin main; then
              echo "✅ Push réussi !"
              exit 0
            else
              echo "⚠️ Push échoué, tentative $attempt/3"
              
              if [ $attempt -lt 3 ]; then
                echo "🔄 Pull + rebase avant nouvelle tentative..."
                sleep 5
                
                # Pull avec rebase
                git pull --rebase origin main || {
                  echo "⚠️ Conflit durant rebase, résolution..."
                  # Prendre la version remote et régénérer, toujours sans tools/lienotheque
                  git checkout --theirs index.html 2>/dev/null || true
                  mv tools/lienotheque "$RUNNER_TEMP/lienotheque"
                  node generate-index.js
                  mv "$RUNNER_TEMP/lienotheque" tools/lienotheque
                  git add index.html
                  git rebase --continue || git rebase --skip
                }
              else
                echo "❌ Échec après 3 tentatives"
                exit 1
              fi
            fi
          done
      
      - name: 📋 Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "✅ WORKFLOW TERMINÉ"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "L'index.html est maintenant à jour et accessible"
          echo "sur GitHub Pages."
          echo ""
          echo "🔗 https://c-concept-dev.github.io/C-Concept-Dev/"
          echo ""
