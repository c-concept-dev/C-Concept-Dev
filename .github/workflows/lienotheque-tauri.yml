name: Liénothèque — prototype bureau

# Mesure le prototype Tauri : il construit le paquet, publie sa taille et celle des moteurs
# embarqués, puis éprouve les quatre critères du CDC. Il ne déploie rien.
# Les fixtures (PDF de 500 pages, image, MP3) sont fabriquées à la volée : aucun fichier sous
# droits, rien de versionné.
on:
  workflow_dispatch:
  push:
    # `wip/**` autant que `main`, et c'est une réparation, pas un confort.
    #
    # Mesuré le 12 novembre 2026 : le travail de ce projet vit sur `wip/lienotheque-2026-10-29`
    # depuis deux semaines, et ce déclencheur ne regardait que `main`. **Aucune des poussées de
    # Rust n'a donc été vérifiée par personne** — ni les trois bancs ajoutés par l'étape 1, ni
    # rien d'autre sous `src-tauri`. Un contrôle qui ne tourne jamais ne dit pas « vert » : il ne
    # dit rien, ce qui est plus dangereux, parce que la page des courses, elle, est verte.
    #
    # Les filtres de chemins restent ceux d'avant : cette course est la plus longue du dépôt, et
    # elle n'a de raison de partir que si `src-tauri` ou ses fixtures ont bougé.
    branches: [main, 'wip/**']
    paths:
      - 'tools/lienotheque/apps/app/src-tauri/**'
      - 'tools/lienotheque/fixtures/generer-locales.py'
      - '.github/workflows/lienotheque-tauri.yml'
  pull_request:
    paths:
      - 'tools/lienotheque/apps/app/src-tauri/**'
      - 'tools/lienotheque/fixtures/generer-locales.py'
      - '.github/workflows/lienotheque-tauri.yml'

permissions:
  contents: read

concurrency:
  group: lienotheque-tauri-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/lienotheque

jobs:
  mesurer:
    name: Mesures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows est hors périmètre POUR L'INSTANT — suspendu, pas abandonné (décision de
        # Christophe du 5 novembre 2026, qui remplace celle du 28 octobre). Les étapes marquées
        # `runner.os == 'Windows'` plus bas ne tournent donc plus ; elles sont gardées, non
        # supprimées, pour le jour où la question se reposera — et elle se reposera.
        os: [macos-latest]
    steps:
      - name: Récupérer le dossier Liénothèque
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools/lienotheque

      - name: Installer pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Installer Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/lienotheque/pnpm-lock.yaml

      # Cette action pose rustup et un stable ; **c'est `tools/lienotheque/rust-toolchain.toml`
      # qui décide** de la version employée, parce que rustup le lit dans le dossier courant et
      # ses parents. Le jour où le stable du moment s'éloigne de la version fixée, rustup
      # téléchargera celle-ci : c'est le prix, assumé, d'un outil qui ne change jamais par
      # surprise. Décision de Christophe du 13 novembre 2026, née d'un rouge que rien dans le
      # commit n'expliquait — voir le fichier lui-même.
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      # La version employée, dite à voix haute dans la course. Une dépendance invisible rend un
      # rouge indéchiffrable : celle-ci se lit désormais dans le journal, à côté du verdict.
      - name: Dire quelle version de Rust tourne
        shell: bash
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Mettre la cible Rust en cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/lienotheque/apps/app/src-tauri

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      # Pas de `brew install tesseract` ici, et c'est le lot 0u.
      #
      # Cette course installait le Tesseract de Homebrew et publiait « tesseract 5.5.4 (fra) »
      # comme critère du CDC, là où l'application embarque **5.5.1** et leptonica **1.86.0**. La
      # mesure publiée décrivait donc le coureur et non le produit livré — la dette D1 exactement,
      # que `lienotheque-ci.yml` avait déjà payée de son côté. Les moteurs viennent désormais de
      # l'archive publiée, plus bas, et c'est elle qui fait foi (décision de Christophe du
      # 14 novembre 2026).

      - name: Installer Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Le dépôt chocolatey répond parfois 504 : une panne de son côté, pas de la nôtre, et
          # elle fait sauter toutes les étapes suivantes. Deux tentatives, une pause entre les
          # deux. Pas davantage : au-delà, c'est une vraie panne, et une file de réessais ne la
          # ferait pas disparaître — elle la rendrait seulement plus lente à voir.
          # Un code de sortie non nul doit revenir à la boucle, pas interrompre le script :
          # selon la version de PowerShell, « stop » transforme l'un en l'autre, et le réessai ne
          # servirait alors jamais. On le dit plutôt que de s'en remettre à la version installée.
          $PSNativeCommandUseErrorActionPreference = $false
          $tentatives = 2
          for ($essai = 1; $essai -le $tentatives; $essai++) {
            choco install tesseract --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($essai -eq $tentatives) {
              throw "chocolatey n'a pas installé Tesseract après $tentatives tentatives (code $LASTEXITCODE)."
            }
            Write-Host "chocolatey a échoué (code $LASTEXITCODE) : nouvelle tentative dans 30 s."
            Start-Sleep -Seconds 30
          }
          # L'installateur ne livre que l'anglais : on ajoute le modèle français officiel.
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          $fra = Join-Path $tessdata "fra.traineddata"
          if (-not (Test-Path $fra)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fra.traineddata" -OutFile $fra
          }
          Add-Content $env:GITHUB_PATH "C:\Program Files\Tesseract-OCR"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Fabriquer les fixtures locales
        shell: bash
        run: python fixtures/generer-locales.py

      - name: Contrôler le lecteur de table d'imports
        shell: bash
        run: python apps/app/src-tauri/outils/preparer-moteurs.py --autotest

      # ── Les moteurs viennent de l'archive publiée, et non d'une fabrication du jour ─────
      #
      # Décision de Christophe du 14 novembre 2026 : « l'archive publiée fait foi […] et non une
      # fabrication du jour. On ne fabrique de nouveaux moteurs que volontairement, avec une
      # nouvelle archive publiée et épinglée ». Les quatre étapes ci-dessous sont celles de la
      # voie 3 de `lienotheque-ci.yml`, éprouvées depuis le 9 novembre.
      #
      # L'adresse et l'empreinte sont LUES dans `fixtures/moteurs-de-lecture.json`, jamais
      # recopiées : écrites à deux endroits, elles se périment à un seul des deux.
      - name: Relever l'archive des moteurs attendue
        if: runner.os == 'macOS'
        id: moteurs
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          archive = json.load(open("fixtures/moteurs-de-lecture.json"))["archive"]
          print(f"url={archive['url']}")
          print(f"empreinte={archive['empreinte_sha256']}")
          PY

      - name: Reprendre les moteurs de lecture en cache
        if: runner.os == 'macOS'
        id: cache-moteurs-lecture
        uses: actions/cache@v4
        with:
          path: tools/lienotheque/apps/app/src-tauri/moteurs
          # L'empreinte EST la clef : d'autres octets, un autre cache, jamais une reprise à tort.
          key: moteurs-lecture-${{ steps.moteurs.outputs.empreinte }}

      # Déployée aussi quand le cache a répondu mais ne porte pas les licences de l'archive.
      # Depuis le lot 0u ter, ce sont ELLES qui font foi : un `moteurs/` repris du cache sans son
      # `licences/INVENTAIRE.json` ferait refuser la collecte en accusant l'archive d'un défaut du
      # cache. Le cas n'est pas théorique — une course qui échouait après l'effacement des licences
      # laissait exactement cet état derrière elle.
      - name: Déployer les moteurs de l'application
        timeout-minutes: 15
        if: runner.os == 'macOS'
        shell: bash
        env:
          REPRIS: ${{ steps.cache-moteurs-lecture.outputs.cache-hit }}
        run: |
          inventaire=apps/app/src-tauri/moteurs/licences/INVENTAIRE.json
          if [ "$REPRIS" = "true" ] && [ -f "$inventaire" ]; then
            echo "moteurs repris du cache, licences de l'archive présentes"
            exit 0
          fi
          if [ "$REPRIS" = "true" ]; then
            echo "::warning::cache repris SANS $inventaire : l'archive est redéployée par-dessus"
            rm -rf apps/app/src-tauri/moteurs
          fi
          curl -fsSL -o "$RUNNER_TEMP/moteurs.tar.gz" "${{ steps.moteurs.outputs.url }}"
          obtenue=$(shasum -a 256 "$RUNNER_TEMP/moteurs.tar.gz" | cut -d' ' -f1)
          attendue="${{ steps.moteurs.outputs.empreinte }}"
          if [ "$obtenue" != "$attendue" ]; then
            echo "::error::empreinte inattendue pour l'archive des moteurs"
            echo "  attendue : $attendue"
            echo "  obtenue  : $obtenue"
            exit 1
          fi
          mkdir -p apps/app/src-tauri
          tar -xzf "$RUNNER_TEMP/moteurs.tar.gz" -C apps/app/src-tauri

      # Le moteur de traitement — Node réduit à l'architecture du runner, la chaîne rassemblée en
      # un fichier, et les codecs — est déclaré en binaire annexe dans tauri.conf.json. Sans cette
      # étape, la construction s'arrête avant de compiler, sur « resource path
      # moteurs/bin/node-… doesn't exist ». C'est arrivé, et la PR l'a montré.
      - name: Embarquer le moteur de traitement
        shell: bash
        run: python apps/app/src-tauri/outils/preparer-moteur-node.py
      # ── Le PATH des moteurs vient APRÈS la reconstruction de la chaîne ────────────────
      #
      # Et c'est une faute à moi, trouvée par la course du 16 novembre 2026. Ces deux étapes
      # étaient plus haut, juste après le déploiement de l'archive. `preparer-moteur-node.py`
      # prend le node du PATH (`shutil.which`) et l'écrit dans `moteurs/bin/node` ; avec
      # `moteurs/bin` en tête du PATH, il trouvait **sa propre cible**, l'effaçait — le script
      # efface avant de copier, pour ne pas écrire par-dessus un binaire signé — puis échouait
      # sur `FileNotFoundError`. Il doit embarquer le node DU COUREUR, pas celui de l'archive.
      #
      # L'ordre est donc à trois temps, et chacun a sa raison : l'archive d'abord (elle apporte
      # les programmes qui lisent), la chaîne ensuite (elle vient du commit sous essai et
      # recouvre celle de l'archive, vieille de cinq jours), le PATH en dernier (pour que les
      # contrôles lisent avec les programmes du paquet).


      # Le paquet DEVANT : ce qu'on emporte a été éprouvé avec la chaîne, ce que la machine
      # fournit ne l'a pas été. Et on dit QUEL tesseract répond : deux programmes joignables sans
      # savoir lequel parle, c'est la mesure fausse de nouveau, avec un chemin de plus.
      - name: Lire avec le programme de l'application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          moteurs="$PWD/apps/app/src-tauri/moteurs"
          echo "$moteurs/bin" >> "$GITHUB_PATH"
          echo "TESSDATA_PREFIX=$moteurs/tessdata" >> "$GITHUB_ENV"
          "$moteurs/bin/tesseract" --version | head -2
          "$moteurs/bin/sf" -sig "$moteurs/siegfried/default.sig" -version | head -1

      - name: Dire quel Tesseract répond, et refuser l'ambiguïté
        if: runner.os == 'macOS'
        shell: bash
        run: |
          attendu="$PWD/apps/app/src-tauri/moteurs/bin/tesseract"
          echo "tesseract joignables, dans l'ordre du PATH :"
          command -v -a tesseract || true
          repond=$(command -v tesseract || true)
          if [ "$repond" != "$attendu" ]; then
            echo "::error::ce n'est pas le tesseract de l'application qui répond"
            echo "  attendu : $attendu"
            echo "  obtenu  : ${repond:-aucun}"
            exit 1
          fi
          tesseract --version | head -2

      # Le paquet construit ici doit déclarer ce que SES moteurs exigent. Depuis le lot 0u, ces
      # moteurs sont ceux de l'archive publiée — donc exactement ceux que le produit embarque, et
      # non les bouteilles Homebrew du coureur du jour : le minimum relevé décrit désormais le
      # paquet livré. Modification locale au runner, jamais commitée. Voir docs/decisions.md.
      - name: Aligner le minimum macOS sur les moteurs embarqués
        if: runner.os == 'macOS'
        shell: bash
        run: python apps/app/src-tauri/outils/minimum-macos.py --ecrire

      # Les bancs de mesure sont hors de « pnpm check » : ils durent des minutes. Ici on a le
      # temps, et ils se sautent proprement là où les fixtures sous droits manquent.
      - name: Relancer les bancs de mesure
        shell: bash
        run: pnpm --filter @lienotheque/optimiseur run mesures

      # **`cargo test` ne compile aucun exemple**, et c'est la seconde moitié du trou — celle qui
      # restait ouverte après l'ajout de `wip/**`. Cette course lançait `cargo test` puis un seul
      # exemple nommé, `epreuve-du-paquet` ; les vingt-deux autres n'étaient compilés nulle part.
      # Les trois bancs poussés par l'étape 1 — `banc-boucle-hote`, `banc-decoupage-60`,
      # `banc-lecture-messages` — en font partie : ils seraient restés invérifiés même avec le
      # déclencheur réparé. Compiler ne les exécute pas, et c'est voulu : plusieurs sont des bancs
      # de mesure qui durent des minutes. Ce qu'on veut savoir ici est qu'ils compilent encore.
      - name: Compiler tous les exemples
        shell: bash
        run: cargo build --release --examples --manifest-path apps/app/src-tauri/Cargo.toml

      - name: Éprouver les quatre critères
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --manifest-path apps/app/src-tauri/Cargo.toml -- --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/mesures.txt"

      # Construits même si un critère a échoué : la taille fait partie des mesures attendues.
      - name: Construire le paquet (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: pnpm --filter @lienotheque/app run tauri build

      - name: Construire l'exécutable (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        # Pas d'installateur : on mesure l'exécutable et ses moteurs, sans dépendre de NSIS.
        run: pnpm --filter @lienotheque/app run tauri build --no-bundle

      # Construire le paquet ne prouve pas qu'il lit.
      #
      # Mille sept cents tests passaient, cette intégration construisait le paquet, et le moteur
      # embarqué ne savait lire aucun document : pdfjs construit une matrice au chargement de son
      # module de rendu — prise de `@napi-rs/canvas` dans le dépôt, absente d'un paquet — et il
      # cherche son module de travail par un chemin calculé à l'exécution, qu'un fichier unique
      # n'a pas sur son disque. Aucun des deux ne se voit en développement, où la chaîne tourne
      # depuis `node_modules`.
      #
      # Cette épreuve fait donc ce que fait l'interface : elle dépose un document, laisse la file
      # mener le travail par le moteur embarqué, et vérifie que la version porte des passages non
      # vides. Sur la fixture native fabriquée plus haut — synthétique, régénérable, aucune œuvre
      # sous droits — cinq cents pages en cinq secondes. Éprouvée dans les deux sens : sans l'une
      # ou l'autre correction, elle sort en erreur.
      - name: Éprouver que le moteur embarqué lit vraiment un document
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo run --release --manifest-path apps/app/src-tauri/Cargo.toml \
            --example epreuve-du-paquet -- \
            fixtures/fichiers/500-pages.pdf \
            fixtures/recettes/methode-pastille-piste.v2.json \
            fixtures/bibliotheques/F3.json

      - name: Publier les mesures
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # tee : les mesures vont au résumé d'exécution et restent lisibles dans le journal.
          python apps/app/src-tauri/outils/resumer-mesures.py \
            --journal "$RUNNER_TEMP/mesures.txt" \
            --systeme "${{ matrix.os }}" | tee -a "$GITHUB_STEP_SUMMARY"
