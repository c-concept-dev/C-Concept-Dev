name: Liénothèque — intégration continue

# Ce dépôt est un monorepo hétérogène : cette intégration continue ne concerne que
# tools/lienotheque. Elle ne déploie rien (voir deploy-worker.yml et deploy-pages.yml).
# Les branches de travail sont contrôlées comme `main`.
#
# Elles ne l'étaient pas, et le prix a été payé : du 30 octobre au 5 novembre 2026, tout le
# travail est allé sur `wip/lienotheque-2026-10-29`, qui n'est ni `main` ni une demande de
# fusion. L'intégration continue n'a donc **rien contrôlé** pendant une semaine — ni le typage,
# ni les tests, sur aucun des trois systèmes. Ce n'était pas une panne : c'était le déclencheur,
# et c'est pire, parce qu'un silence ressemble à un succès.
on:
  push:
    branches:
      - main
      - 'wip/**'
    paths:
      - 'tools/lienotheque/**'
      - '.github/workflows/lienotheque-ci.yml'
  pull_request:
    paths:
      - 'tools/lienotheque/**'
      - '.github/workflows/lienotheque-ci.yml'

permissions:
  contents: read

concurrency:
  group: lienotheque-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/lienotheque

jobs:
  check:
    name: Vérification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Un blocage doit échouer franchement, pas durer des heures (Ci2, 11 novembre 2026) : le
    # travail `Rendu` est resté 45 minutes figé sur une installation de paquets système. Et une
    # course qui ne conclut jamais ne rend même pas ses journaux — il a fallu passer par
    # `gh api .../jobs/<id>/logs` pour lire un travail pourtant terminé.
    # Le plus long travail observé tient en une vingtaine de minutes ; 45 laisse de la marge sans
    # laisser durer.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows est hors périmètre POUR L'INSTANT — suspendu, pas abandonné (décision de
        # Christophe du 5 novembre 2026, qui remplace celle du 28 octobre). Il n'est donc plus
        # éprouvé : un contrôle qu'on ne compte plus et qu'on laisse tourner finit par être lu
        # comme un succès, ou ignoré comme un bruit — les deux coûtent plus qu'ils ne rapportent.
        # Le rétablir se fera en remettant `windows-latest` ici, et rien d'autre.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Récupérer le dossier Liénothèque
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools/lienotheque

      # pnpm avant setup-node : le cache « pnpm » de setup-node a besoin de pnpm sur le PATH.
      - name: Installer pnpm
        timeout-minutes: 10
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Installer Node 24
        timeout-minutes: 10
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/lienotheque/pnpm-lock.yaml

      - name: Installer les dépendances
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      # ── Voie 3 : sur macOS, lire avec LE MÊME PROGRAMME que l'application ──────────────
      #
      # La dette D1 disait : le Tesseract de la CI (Homebrew 5.5.4) n'est pas celui de
      # l'application (5.5.1). Un contrôle de lecture vert sur un autre programme ne dit rien du
      # produit. La voie 1 (ne pas installer Tesseract du tout) évitait le mensonge en sautant les
      # contrôles ; la voie 3 les fait tourner sur les octets exacts du paquet.
      #
      # L'archive est épinglée par son empreinte dans fixtures/moteurs-de-lecture.json, lue ici
      # plutôt que recopiée : une adresse ou une empreinte écrite à deux endroits se périme à un
      # seul des deux.
      - name: Relever l'archive des moteurs attendue
        if: runner.os == 'macOS'
        id: moteurs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          archive = json.load(open("fixtures/moteurs-de-lecture.json"))["archive"]
          print(f"url={archive['url']}")
          print(f"empreinte={archive['empreinte_sha256']}")
          PY

      - name: Reprendre les moteurs de lecture en cache
        if: runner.os == 'macOS'
        id: cache-moteurs-lecture
        uses: actions/cache@v4
        with:
          path: tools/lienotheque/apps/app/src-tauri/moteurs
          # L'empreinte EST la clef : d'autres octets, un autre cache, jamais une reprise à tort.
          key: moteurs-lecture-${{ steps.moteurs.outputs.empreinte }}

      - name: Déployer les moteurs de l'application
        timeout-minutes: 15
        if: runner.os == 'macOS' && steps.cache-moteurs-lecture.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/moteurs.tar.gz" "${{ steps.moteurs.outputs.url }}"
          obtenue=$(shasum -a 256 "$RUNNER_TEMP/moteurs.tar.gz" | cut -d' ' -f1)
          attendue="${{ steps.moteurs.outputs.empreinte }}"
          if [ "$obtenue" != "$attendue" ]; then
            echo "::error::empreinte inattendue pour l'archive des moteurs"
            echo "  attendue : $attendue"
            echo "  obtenue  : $obtenue"
            exit 1
          fi
          mkdir -p apps/app/src-tauri
          tar -xzf "$RUNNER_TEMP/moteurs.tar.gz" -C apps/app/src-tauri

      # Les contrôles trouvent Tesseract sur le PATH (`tesseractDisponible`) et ses fichiers de
      # langue par TESSDATA_PREFIX. On met donc le paquet DEVANT : ce qu'on emporte a été éprouvé
      # avec la chaîne, ce que la machine fournit ne l'a pas été.
      - name: Lire avec le programme de l'application
        if: runner.os == 'macOS'
        run: |
          moteurs="$PWD/apps/app/src-tauri/moteurs"
          echo "$moteurs/bin" >> "$GITHUB_PATH"
          echo "TESSDATA_PREFIX=$moteurs/tessdata" >> "$GITHUB_ENV"
          "$moteurs/bin/tesseract" --version | head -2
          "$moteurs/bin/sf" -sig "$moteurs/siegfried/default.sig" -version | head -1

      # Réchauffer `otool` AVANT les tests — lot 14 quater, mesuré le 11 novembre 2026.
      #
      # `paquet-hermetique` lance `otool -l` sur les 22 Mach-O du paquet. Sur ce coureur, le
      # **premier** lancement d'`otool` coûte à lui seul **1 531 ms** : résolution de la chaîne
      # Xcode, caches dyld, vérification du binaire de la chaîne. Ce coût était payé À L'INTÉRIEUR
      # du contrôle, qui mettait **2 480 ms** pour un délai de 5 000 — une marge de ×2.05, la plus
      # courte du dépôt.
      #
      # Mesuré en quatre courses de la branche d'essai `wip/essai-otool-ci` (supprimée depuis) :
      #   sans préparation ......................... 2 480 ms
      #   88 otool sur le paquet d'abord ............  809 ms
      #   88 otool + traversée du paquet d'abord ....  456 ms
      #   UN SEUL otool sur un binaire du système ...  553 ms
      # Réchauffer le seul OUTIL suffit : le paquet n'a pas à être touché, et sa traversée ne coûte
      # que 11 ms à froid sur 97 fichiers.
      #
      # Ce qu'on ne fait pas, et qui serait plus court à écrire : allonger le délai du contrôle, ou
      # lui retirer des fichiers. Le contrôle n'a rien de trop ; c'est le coureur qui est froid.
      - name: Réchauffer otool avant les tests
        if: runner.os == 'macOS'
        run: /usr/bin/otool -l /usr/bin/true > /dev/null

      - name: Typage et tests
        run: pnpm check

  # Séparé de la vérification : ces tests-là mesurent le rendu dans de vrais moteurs, ce que
  # jsdom ne sait pas faire (PLT-09). Un seul système suffit : les trois moteurs y tournent.
  navigateurs:
    name: Rendu (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    # Voir ci-dessus. Ce travail tient d'ordinaire en moins de cinq minutes.
    timeout-minutes: 25
    steps:
      - name: Récupérer le dossier Liénothèque
        uses: actions/checkout@v5
        with:
          sparse-checkout: tools/lienotheque

      - name: Installer pnpm
        timeout-minutes: 10
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Installer Node 24
        timeout-minutes: 10
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/lienotheque/pnpm-lock.yaml

      - name: Installer les dépendances
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      # La version de Playwright commande celle des moteurs : elle sert de clef de cache.
      - name: Relever la version de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @lienotheque/app exec playwright --version | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"

      # La clef porte la version de l'IMAGE de l'exécutant, pas seulement celle de Playwright.
      #
      # Sans elle, ce job était rouge sans interruption depuis que GitHub a mis l'image à jour :
      # le WebKit en cache (`webkit-2359`) est construit contre ICU 74, l'image est passée à
      # ICU 78, et `install-deps` installe l'ICU du jour — jamais la 74. Le cache faisait mouche,
      # donc `playwright install` ne retournait jamais chercher un moteur bâti pour la nouvelle
      # image, et le MiniBrowser mourait au lancement :
      #
      #     MiniBrowser: error while loading shared libraries: libicudata.so.74
      #
      # Mesuré le 5 novembre 2026 sur l'exécution 40944685964 : 59 échecs, tous WebKit ; zéro
      # pour Chromium et Firefox. Les « Target page … has been closed » et « kill ESRCH » qu'on
      # lisait n'étaient que les conséquences du moteur mort.
      # `ImageOS` et `ImageVersion` sont injectés par l'exécutant dans l'environnement du
      # processus ; le contexte `env` d'une expression, lui, ne porte que ce que le workflow
      # déclare. Écrits tels quels dans la clef, ils rendaient donc du vide : mesuré le
      # 5 novembre 2026, « Cache not found for input keys: playwright-Linux---1.63.0 ». La clef
      # était constante — le cache ratait ce jour-là parce qu'elle était neuve, et le défaut
      # serait revenu à la mise à jour d'image suivante. On les relève comme la version de
      # Playwright, par une étape.
      - name: Relever la version de la machine
        id: machine
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Reprendre les moteurs en cache
        id: cache-moteurs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.machine.outputs.os }}-${{ steps.machine.outputs.version }}-${{ steps.playwright.outputs.version }}

      - name: Installer les moteurs
        timeout-minutes: 15
        if: steps.cache-moteurs.outputs.cache-hit != 'true'
        run: pnpm --filter @lienotheque/app exec playwright install --with-deps chromium firefox webkit

      # Les dépendances système ne sont pas dans le cache : à réinstaller même sur reprise.
      - name: Installer les dépendances système des moteurs
        timeout-minutes: 15
        if: steps.cache-moteurs.outputs.cache-hit == 'true'
        run: pnpm --filter @lienotheque/app exec playwright install-deps chromium firefox webkit

      - name: Mesurer le rendu
        run: pnpm --filter @lienotheque/app run test:navigateurs

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendu-navigateurs
          path: tools/lienotheque/apps/app/playwright-report/
          retention-days: 7
