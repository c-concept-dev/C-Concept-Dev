name: 🚀 Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["🔄 Generate Index"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A second run can be started when Generate Index finishes.  Let the first
  # deployment complete instead of cancelling it inside actions/deploy-pages:
  # cancelling that step can leave the Pages environment locked for minutes.
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
