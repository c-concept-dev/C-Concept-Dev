name: D103A sync generated standalone

on:
  push:
    branches: [ d103a-pure-longitudinal-core ]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: d103a-pure-longitudinal-core
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild standalone
        run: npm --prefix "tools/Je marche comme je suis" run build
      - name: Commit generated standalone if changed
        run: |
          if git diff --quiet -- "tools/Je marche comme je suis/je-marche-comme-je-suis-p0.html"; then
            echo "Generated standalone already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tools/Je marche comme je suis/je-marche-comme-je-suis-p0.html"
          git commit -m "build(D103A): synchronize standalone artifact"
          git push origin HEAD:d103a-pure-longitudinal-core
