name: Validate repository

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jsonschema

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Validate Brain JSON (if exists)
      run: |
        if [ -f "output/Brain.json" ]; then
          python automation/validate-schemas.py
        else
          echo "⚠️ Brain.json not found - skipping validation"
        fi
    
    - name: Validate modular walking application
      run: |
        npm --prefix "tools/Je marche comme je suis" run build
        git diff --exit-code -- "tools/Je marche comme je suis/je-marche-comme-je-suis-p0.html"
        npm --prefix "tools/Je marche comme je suis" test

    - name: Validate walking services Worker
      run: npm --prefix WalkServicesWorker test

    - name: Install Playwright
      run: |
        npm --prefix "tools/Je marche comme je suis" install
        npx --prefix "tools/Je marche comme je suis" playwright install --with-deps chromium webkit

    - name: Run critical browser tests
      run: npm --prefix "tools/Je marche comme je suis" run e2e:critical

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          tools/Je marche comme je suis/playwright-report/
          tools/Je marche comme je suis/test-results/
        if-no-files-found: warn
        retention-days: 14

    - name: Run remaining validations
      run: |
        echo "✅ All validations passed"
