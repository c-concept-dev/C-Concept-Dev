name: Deploy walking map services

on:
  push:
    branches: [main]
    paths:
      - "WalkServicesWorker/**"
      - ".github/workflows/deploy-walk-services.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
        working-directory: WalkServicesWorker
      - name: Test
        run: npm test
        working-directory: WalkServicesWorker
      - name: Deploy
        run: npm run deploy
        working-directory: WalkServicesWorker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
